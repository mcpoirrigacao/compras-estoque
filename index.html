<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compras-peças · MCPO Irrigação</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
  /* ============ Tokens (mesma base do BI de Compras Maqcampo) ============ */
  :root{
    color-scheme: light;
    --page-bg: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #ffffff;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --border-strong: rgba(11,11,11,0.16);

    --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100;
    --cat-5: #e87ba4; --cat-6: #008300; --cat-7: #4a3aa7; --cat-8: #e34948;

    --seq-100:#cde2fb; --seq-250:#86b6ef; --seq-400:#3987e5; --seq-450:#2a78d6; --seq-550:#1c5cab; --seq-700:#0d366b;

    --status-good:#0ca30c; --status-warning:#fab219; --status-serious:#ec835a; --status-critical:#d03b3b;
    --success-text:#006300;

    --shadow-1: 0 1px 2px rgba(11,11,11,0.04), 0 1px 1px rgba(11,11,11,0.03);
    --shadow-2: 0 4px 16px rgba(11,11,11,0.08), 0 1px 3px rgba(11,11,11,0.06);
    --radius-card: 14px; --radius-control: 8px;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --page-bg:#0d0d0d; --surface:#1a1a19; --surface-2:#201f1d;
      --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
      --gridline:#2c2c2a; --baseline:#383835;
      --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
      --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9; --cat-8:#e66767;
      --success-text:#0ca30c;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.3); --shadow-2: 0 8px 24px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page-bg:#0d0d0d; --surface:#1a1a19; --surface-2:#201f1d;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --gridline:#2c2c2a; --baseline:#383835;
    --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9; --cat-8:#e66767;
    --success-text:#0ca30c;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.3); --shadow-2: 0 8px 24px rgba(0,0,0,0.45);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  [hidden], .hidden{ display:none !important; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--page-bg); color:var(--text-primary); font-family:var(--font-ui); -webkit-font-smoothing:antialiased; }
  ::selection{ background:var(--cat-1); color:#fff; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  button{ font-family:inherit; }

  #app{ max-width:1920px; margin:0 auto; padding:20px 24px 64px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background:#15252e; border-radius: var(--radius-card) var(--radius-card) 0 0;
    padding:14px 20px 14px; position:relative;
  }
  .topbar-title{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .topbar-logo{ height:42px; width:auto; display:block; flex:none; }
  .topbar-divider{ width:1px; height:34px; background:rgba(255,255,255,0.22); flex:none; }
  .topbar-title h1{ font-size:17px; margin:0; letter-spacing:0.03em; font-weight:800; color:#fff; line-height:1.25; }
  .topbar-title .sub{ font-size:12.5px; color:rgba(255,255,255,0.78); }
  .topbar-actions{ display:flex; flex-direction:column; align-items:flex-end; gap:11px; flex:none; }
  .btn-update{
    display:inline-flex; align-items:center; gap:7px;
    background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.24);
    border-radius:var(--radius-control); font-size:12.5px; font-weight:600; cursor:pointer;
    padding:8px 13px; white-space:nowrap; transition:background .12s, border-color .12s, opacity .12s;
  }
  .btn-update:hover{ background:rgba(255,255,255,0.17); }
  .btn-update:disabled{ opacity:0.6; cursor:default; }
  .btn-update svg{ flex:none; }
  .btn-update.is-loading svg{ animation:spin .9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .topbar-timestamp{ font-size:11px; color:rgba(255,255,255,0.5); font-variant-numeric:tabular-nums; white-space:nowrap; }
  @media (max-width:520px){ .topbar-divider{ display:none; } }
  @media (max-width:700px){ .topbar-title h1{ font-size:14px; } .topbar-logo{ height:32px; } .btn-update{ font-size:11.5px; padding:7px 10px; } }

  /* ===== Toast ===== */
  #toast-host{ position:fixed; right:20px; bottom:20px; z-index:200; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .toast{
    background:#15252e; color:#fff; font-size:13px; font-weight:600; padding:11px 16px;
    border-radius:var(--radius-control); box-shadow:var(--shadow-2); max-width:360px;
    opacity:0; transform:translateY(8px); transition:opacity .18s, transform .18s;
  }
  .toast.is-visible{ opacity:1; transform:translateY(0); }
  .toast.is-error{ background:#5a1e1e; }

  /* ===== Filtros (barra escura) ===== */
  .filters-row{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:#182a33; padding:12px 20px; box-shadow:var(--shadow-2);
  }
  .filters-scope{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:rgba(255,255,255,0.6); margin-right:4px; white-space:nowrap; }
  .filters-note{ margin-left:auto; font-size:11.5px; color:rgba(255,255,255,0.55); }
  .btn-ghost:disabled{ opacity:0.45; cursor:default; }
  .btn-ghost:disabled:hover{ background:rgba(255,255,255,0.12); }
  .chart-empty{ padding:24px 8px; font-size:13px; color:var(--text-muted); text-align:center; }
  .abc-tools{ display:flex; gap:10px; align-items:center; margin:2px 0 10px; }
  .abc-search{ flex:1; max-width:360px; font:inherit; font-size:13px; padding:7px 10px; border-radius:var(--radius-control); border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text-primary); }
  .abc-search:focus{ outline:2px solid var(--cat-1); outline-offset:-1px; }
  .abc-table-scroll{ max-height:560px; }
  .abc-table th.sortable{ cursor:pointer; user-select:none; }
  .abc-table th.sortable:hover{ color:var(--text-primary); }
  .abc-table td .chip{ white-space:nowrap; }
  .abc-table td.abc-desc{ max-width:260px; overflow:hidden; text-overflow:ellipsis; }
  .abc-more{ margin:10px auto 0; display:block; color:var(--text-primary); background:transparent; border-color:var(--border-strong); }
  .abc-sum-table tfoot td{ font-weight:700; border-top:2px solid var(--status-good); border-bottom:none; background:color-mix(in srgb, var(--status-good) 12%, var(--surface)); padding:7px 8px; font-variant-numeric:tabular-nums; }
  .abc-sum-table td.num, .abc-sum-table th.num{ text-align:right; }
  .abc-track{ display:inline-block; width:44px; height:8px; border-radius:4px; background:var(--gridline); margin-right:8px; overflow:hidden; vertical-align:0; }
  .abc-bar{ display:block; height:100%; border-radius:4px; background:var(--cat-1); }
  .chart-card.abc-active{ border-color:color-mix(in srgb, var(--status-good) 55%, transparent); box-shadow:0 0 0 1px color-mix(in srgb, var(--status-good) 35%, transparent), var(--shadow-1); }
  .abc-row{ display:grid; grid-template-columns:minmax(280px,1fr) minmax(0,2fr); gap:14px; margin-bottom:14px; }
  @media (max-width:760px){ .abc-row{ grid-template-columns:1fr; } }
  .abc-sum-row{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; margin-bottom:14px; }
  @media (max-width:760px){ .abc-sum-row{ grid-template-columns:1fr; } }
  .abc-sum-row .chart-head{ padding:12px 12px 2px; }
  .abc-sum-row .chart-body{ padding:4px 8px 12px; }
  .abc-sum-row .chart-scroll{ overflow-x:hidden; }
  .abc-sum-row table.data-table th, .abc-sum-row table.data-table td{ padding:6px 5px; }
  .abc-sum-row table.data-table th{ font-size:10px; letter-spacing:0.02em; }
  .abc-sum-row table.data-table{ font-size:12px; }
  @media (max-width:1100px){ .abc-sum-row table.data-table{ font-size:11.5px; } .abc-sum-row table.data-table th{ font-size:9.5px; } }
  .abc-seg{ display:inline-flex; border:1px solid var(--border-strong); border-radius:var(--radius-control); overflow:hidden; flex:none; }
  .abc-seg button{ border:none; background:transparent; color:var(--text-secondary); font-size:11.5px; font-weight:600; padding:4px 10px; cursor:pointer; }
  .abc-seg button + button{ border-left:1px solid var(--border-strong); }
  .abc-seg button.is-on{ background:var(--status-good); color:#fff; }
  .abc-select, .abc-cob input{ font:inherit; font-size:12.5px; padding:6px 8px; border-radius:var(--radius-control); border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text-primary); }
  .abc-cob{ font-size:12.5px; color:var(--text-secondary); display:inline-flex; align-items:center; gap:6px; }
  .abc-cob input{ width:64px; }
  .abc-tools{ flex-wrap:wrap; }
  .abc-summary{ display:flex; flex-wrap:wrap; gap:8px 22px; padding:10px 12px; margin-bottom:10px; border-radius:10px; background:color-mix(in srgb, var(--status-good) 8%, var(--surface)); border:1px solid var(--border); }
  .abc-summary div{ display:flex; flex-direction:column; gap:2px; }
  .abc-summary span{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-muted); font-weight:600; }
  .abc-summary b{ font-size:15px; font-variant-numeric:tabular-nums; }
  .abc-summary b.t-bad{ color:var(--status-critical); }
  .abc-table td.abc-strong{ font-weight:700; }
  .chip.info{ background:color-mix(in srgb, var(--cat-1) 14%, transparent); color:var(--cat-1); }
  .chip.muted{ background:var(--border); color:var(--text-secondary); }
  .dropdown-all{ font-weight:650; border-bottom:1px solid var(--border); border-radius:6px 6px 0 0; padding-bottom:8px; margin-bottom:2px; }
  .dropdown-foot .btn{ flex:1; }
  .filter-group.light{ background:var(--surface-2); border-color:var(--border-strong); }
  .filter-group.light:hover{ background:var(--surface); }
  .filter-group.light > .filter-label, .filter-group.light .filter-btn{ color:var(--text-primary); }
  .filter-group.light .filter-value.is-placeholder{ color:var(--text-muted); }
  .filter-group.light .filter-btn .chev{ color:var(--text-muted); }
  .filter-group.light.has-value{ border-color:var(--status-good); box-shadow:0 0 0 2px color-mix(in srgb, var(--status-good) 20%, transparent); }
  .abc-export{ margin-left:auto; color:#fff; background:var(--status-good); border-color:transparent; }
  .abc-export:hover{ filter:brightness(1.08); }
  .abc-export:disabled{ opacity:0.6; cursor:default; }
  .abc-subtitle{ font-size:12.5px; font-weight:650; margin:16px 0 6px; padding-top:12px; border-top:1px solid var(--border); }
  .tab-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:#f2c14e; margin-left:6px; vertical-align:2px; }
  @media (max-width:900px){ .filters-note{ margin-left:0; flex-basis:100%; } }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border-radius:var(--radius-control); border:1px solid transparent;
    font-size:13.5px; font-weight:600; cursor:pointer; padding:9px 14px;
    transition:filter .12s, background .12s, border-color .12s, opacity .12s; white-space:nowrap;
  }
  .btn-sm{ padding:6px 10px; font-size:12.5px; }
  .btn-ghost{ background:rgba(255,255,255,0.12); color:#fff; border-color:rgba(255,255,255,0.32); }
  .btn-ghost:hover{ background:rgba(255,255,255,0.22); }
  .filter-group{
    display:flex; flex-direction:row; align-items:center; gap:5px; min-width:0;
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.32);
    border-radius:var(--radius-control); padding:7px 12px; transition:background .12s, border-color .12s;
  }
  .filter-group:hover{ background:rgba(255,255,255,0.2); }
  .filter-group.has-value{ border-color:rgba(255,255,255,0.6); box-shadow:0 0 0 3px color-mix(in srgb, #fff 20%, transparent); }
  .filter-group > .filter-label{ font-size:12px; font-weight:700; color:#fff; white-space:nowrap; }
  .filter-control{ position:relative; min-width:0; }
  .filter-btn{
    display:flex; align-items:center; gap:6px; min-width:0; padding:0; border:none; background:transparent;
    color:#fff; font-size:12px; cursor:pointer; text-align:left;
  }
  .filter-btn .chev{ margin-left:auto; color:rgba(255,255,255,0.7); flex:none; }
  .filter-btn .count-badge{ margin-left:4px; background:var(--cat-1); color:#fff; border-radius:999px; font-size:10.5px; font-weight:700; padding:1px 6px; min-width:16px; text-align:center; }
  .filter-value{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
  .filter-value.is-placeholder{ color:rgba(255,255,255,0.65); }
  .pill-select{
    background:transparent; border:none; color:#fff; font-size:12px; font-weight:600; cursor:pointer; outline:none;
  }
  .pill-select option{ color:#0b0b0b; }

  .dropdown-panel{
    position:absolute; top:calc(100% + 6px); left:0; z-index:40;
    background:var(--surface-2); border:1px solid var(--border-strong);
    border-radius:10px; box-shadow:var(--shadow-2);
    width:270px; max-width:80vw; padding:8px; display:flex; flex-direction:column; gap:6px;
  }
  .dropdown-list{ max-height:280px; overflow-y:auto; display:flex; flex-direction:column; }
  .dropdown-item{ display:flex; align-items:center; gap:8px; padding:6px 6px; border-radius:6px; font-size:13px; cursor:pointer; user-select:none; }
  .dropdown-item:hover{ background:var(--border); }
  .dropdown-item input{ accent-color:var(--cat-1); width:14px; height:14px; flex:none; }
  .dropdown-item .lbl{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .dropdown-item .n{ margin-left:auto; font-size:11px; color:var(--text-muted); flex:none; font-variant-numeric:tabular-nums; }
  .dropdown-foot{ display:flex; justify-content:space-between; gap:6px; padding-top:4px; border-top:1px solid var(--border); }

  .period-band{
    display:flex; align-items:center; justify-content:flex-start; gap:10px; flex-wrap:wrap;
    background:linear-gradient(90deg,#3a7a1e,#2e6717);
    border-radius:0 0 var(--radius-card) var(--radius-card); padding:0 20px; margin-bottom:18px; box-shadow:var(--shadow-2);
  }
  .view-tabs{ display:flex; gap:26px; flex:none; flex-wrap:wrap; }
  .view-tab{
    position:relative; border:none; background:transparent; box-shadow:none;
    color:rgba(255,255,255,0.75); font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    padding:13px 1px 11px; margin:0; border-radius:0; cursor:pointer; transition:color .15s; white-space:nowrap;
  }
  .view-tab:hover{ color:#fff; }
  .view-tab.is-active{ color:#fff; }
  .view-tab.is-active::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:3px; background:#fff; border-radius:2px 2px 0 0; }

  /* ============ KPI ============ */
  .kpi-row{ display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:12px; margin-bottom:16px; }
  .kpi-row.kpi-row-7{ grid-template-columns:repeat(7, minmax(0,1fr)); }
  .kpi-row.kpi-row-8{ grid-template-columns:repeat(8, minmax(0,1fr)); }
  .kpi-row.kpi-row-3{ grid-template-columns:repeat(3, minmax(0,1fr)); }
  .kpi-row.kpi-row-4{ grid-template-columns:repeat(4, minmax(0,1fr)); }
  @media (max-width:1500px){ .kpi-row{ grid-template-columns:repeat(3, minmax(0,1fr)); } }
  @media (max-width:620px){ .kpi-row{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .kpi-tile{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); padding:14px 16px; box-shadow:var(--shadow-1); min-width:0; }
  .kpi-label{ font-size:11.5px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px; }
  .kpi-value{ font-size:22px; font-weight:650; letter-spacing:-0.01em; line-height:1.1; }
  .kpi-row-8 .kpi-tile{ padding:14px 12px; }
  .kpi-row-8 .kpi-value{ font-size:17px; }
  .kpi-row-8 .kpi-label{ font-size:10.5px; }
  .kpi-sub{ margin-top:5px; font-size:12px; color:var(--text-secondary); }
  .kpi-sub.warn{ color:var(--status-critical); }
  .kpi-sub.good{ color:var(--success-text); }

  /* ============ Charts grid ============ */
  .chart-grid{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; margin-bottom:14px; }
  @media (max-width:1180px){ .chart-grid{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
  @media (max-width:720px){ .chart-grid{ grid-template-columns:1fr; } }
  .chart-grid-2{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; margin-bottom:14px; }
  @media (max-width:720px){ .chart-grid-2{ grid-template-columns:1fr; } }
  .chart-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); box-shadow:var(--shadow-1); display:flex; flex-direction:column; min-width:0; grid-column:span 1; }
  .chart-card.span-2{ grid-column:span 2; }
  .chart-card.span-3{ grid-column:span 3; }
  @media (max-width:1180px){ .chart-card.span-3{ grid-column:span 2; } }
  @media (max-width:720px){ .chart-card.span-2, .chart-card.span-3{ grid-column:span 1; } }
  .chart-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 16px 4px; }
  .chart-title{ font-size:13.5px; font-weight:650; letter-spacing:-0.005em; }
  .chart-title .n{ color:var(--text-muted); font-weight:500; }
  .chart-body{ padding:6px 14px 16px; min-height:0; }
  .chart-scroll{ max-height:360px; overflow-y:auto; overflow-x:auto; }

  .legend-row{ display:flex; flex-wrap:wrap; gap:12px; padding:0 2px 8px; }
  .legend-row-below{ justify-content:center; padding:10px 2px 2px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); }
  .legend-swatch{ width:10px; height:10px; border-radius:3px; flex:none; }
  .legend-swatch.line{ width:14px; height:2px; border-radius:1px; }

  svg.viz{ display:block; width:100%; overflow:visible; font-family:var(--font-ui); }
  .viz-axis-label{ fill:var(--text-muted); font-size:10.5px; }
  .viz-grid-line{ stroke:var(--gridline); stroke-width:1; }
  .viz-baseline{ stroke:var(--baseline); stroke-width:1; }
  .viz-bar-label{ fill:var(--text-secondary); font-size:11px; font-variant-numeric:tabular-nums; }
  .viz-cat-label{ fill:var(--text-primary); font-size:11.5px; }
  .bar-hit:hover .bar-fill{ filter:brightness(1.08); }

  /* ---- Ranked table ---- */
  .rank-table{ display:flex; flex-direction:column; }
  .rank-row{ display:grid; grid-template-columns:20px minmax(0,1.3fr) minmax(56px,1fr) auto auto; align-items:center; gap:10px; padding:7px 4px; border-bottom:1px solid var(--border); border-radius:6px; }
  .rank-row:last-child{ border-bottom:none; }
  .rank-row:hover{ background:var(--border); }
  .rank-rank{ font-size:11px; font-weight:700; color:var(--text-muted); text-align:center; font-variant-numeric:tabular-nums; }
  .rank-label{ font-size:12.5px; color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-bar-track{ height:8px; border-radius:4px; background:var(--gridline); overflow:hidden; }
  .rank-bar-fill{ height:100%; border-radius:4px; background:var(--status-good); min-width:2px; }

body.tab-compras .callout{font-size:12.5px; line-height:1.55; padding:10px 12px; border-radius:9px; background: color-mix(in srgb, var(--cat-1) 8%, transparent); color: var(--text-secondary); border:1px solid color-mix(in srgb, var(--cat-1) 22%, transparent);}
body.tab-compras .callout.warn{background: color-mix(in srgb, var(--status-critical) 10%, transparent); border-color: color-mix(in srgb, var(--status-critical) 28%, transparent); color: var(--status-critical);}
body.tab-compras .callout.good{background: color-mix(in srgb, var(--status-good) 10%, transparent); border-color: color-mix(in srgb, var(--status-good) 28%, transparent); color: var(--success-text);}
body.tab-compras .spinner{width:14px; height:14px; border-radius:50%; border:2px solid currentColor; border-right-color:transparent; animation: cp-spin .7s linear infinite; display:inline-block;}
@keyframes cp-spin{ to{ transform: rotate(360deg); } }
body.tab-compras #panel-compras .btn-ghost, body.tab-compras .dropdown-panel .btn-ghost{ background:transparent; color:var(--text-primary); border-color:var(--border-strong); }
body.tab-compras #panel-compras .btn-ghost:hover, body.tab-compras .dropdown-panel .btn-ghost:hover{ background:var(--border); }
.cp-head{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:6px 16px; margin:0 2px 12px; font-size:12.5px; color:var(--text-secondary); }
.cp-head b{ color:var(--text-primary); font-weight:600; }
.cp-fonte{ color:var(--text-muted); font-size:12px; }

<script>
(function(){
"use strict";
var DATA = null;   /* carregado do SharePoint após o login (ver setData) */
var FILIAIS = [];
/* meses cobertos pelos domínios que não dependem do upload de Faturamento —
   usado para recalcular DATA.meta.periodos sem acumular meses obsoletos
   (ex.: um mês que saiu da planilha de Faturamento numa atualização) */
var BASE_NONFAT_MONTHS = [];   /* recalculado em setData() */
var MES_NOMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

/* ---------- formatting ---------- */
function fmtBRL(v, compact, noPrefix){
  v = Number(v)||0;
  var pfx = noPrefix ? '' : 'R$ ';
  if (compact && Math.abs(v) >= 1000000){
    return pfx + (v/1000000).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' mi';
  }
  if (compact && Math.abs(v) >= 1000){
    return pfx + (v/1000).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0}) + ' mil';
  }
  if (noPrefix) return v.toLocaleString('pt-BR',{maximumFractionDigits:0});
  return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
}
function fmtNum(v){ return Math.round(Number(v)||0).toLocaleString('pt-BR'); }
function fmtPct(v, digits){ digits = digits==null?1:digits; return (Number(v)*100).toLocaleString('pt-BR',{minimumFractionDigits:digits,maximumFractionDigits:digits}) + '%'; }
function monthLabel(m){ var p=m.split('-'); return MESES[parseInt(p[1],10)-1] + '/' + p[0].slice(2); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }

/* ---------- tooltip ---------- */
var tooltip = el('div','viz-tooltip');
document.body.appendChild(tooltip);
function showTooltip(x,y,html){
  tooltip.innerHTML = html;
  tooltip.style.left = Math.min(x+14, window.innerWidth-260)+'px';
  tooltip.style.top = Math.max(y-10,8)+'px';
  tooltip.classList.add('is-visible');
}
function hideTooltip(){ tooltip.classList.remove('is-visible'); }

/* ================= FILTER STATE (por aba) =================
   Cada aba tem seus próprios filtros, definidos em TAB_FILTERS.
   fstate[aba][chave] = lista de valores selecionados ([] = todos). */
var MES_OPTS = MES_NOMES.map(function(n,i){ return {value:String(i+1).padStart(2,'0'), label:n}; });
var HIST_ALIAS = { 'Matriz':'Palmas' }; /* Inventário_de_Peças chama Palmas de "Matriz" */

function uniq(arr){ var s={}, out=[]; arr.forEach(function(x){ if(x!=null && !s[x]){ s[x]=1; out.push(x); } }); return out; }
function optsFromList(list){ return list.map(function(v){ return {value:v, label:v}; }); }

var TAB_FILTERS = {
  fat: [
    {key:'filial', label:'Filial', all:'Todas', plural:'filiais', options:function(){
      var g = DATA.fat.grid.grid;
      var fils = Object.keys(g).map(function(f){
        var t=0; Object.keys(g[f]).forEach(function(m){ t+=g[f][m].v||0; }); return {f:f,t:t};
      }).sort(function(a,b){ return b.t-a.t; }).map(function(x){ return x.f; });
      return optsFromList(fils);
    }},
    {key:'ano', label:'Ano', all:'Todos', plural:'anos', options:function(){
      return optsFromList(uniq(DATA.fat.grid.months.map(function(m){ return m.slice(0,4); })).sort());
    }},
    {key:'mes', label:'Mês', all:'Todos', plural:'meses', options:function(){ return MES_OPTS; }}
  ],
  abc: [
    {key:'filial', label:'Filial', all:'Todas', plural:'filiais', options:function(){
      var t={}; ((DATA.abc&&DATA.abc.rows)||[]).forEach(function(r){ t[r[0]]=(t[r[0]]||0)+r[5]; });
      return optsFromList(Object.keys(t).sort(function(a,b){ return t[b]-t[a]; }));
    }},
    {key:'pop', label:'POP', all:'Todos', plural:'faixas', options:function(){
      return POP_FAIXAS.map(function(f){ return {value:f.value, label:f.label}; });
    }}
  ],
  inv: [
    {key:'filial', label:'Filial', all:'Todas', plural:'filiais', options:function(){
      return optsFromList(DATA.invPecas.by_filial.filter(function(f){ return f.valor>=1 || f.qtd>=1; })
        .slice().sort(function(a,b){ return b.valor-a.valor; }).map(function(f){ return f.filial; }));
    }},
    {key:'arz', label:'Armazém', all:'Todos', plural:'armazéns', options:function(){
      return optsFromList(DATA.invPecas.by_arz.filter(function(f){ return f.valor>=1 || f.qtd>=1; })
        .slice().sort(function(a,b){ return b.valor-a.valor; }).map(function(a){ return a.nome; }));
    }}
  ],
  giro: [
    {key:'filial', label:'Filial', all:'Todas', plural:'filiais', options:function(){
      var e = DATA.giro.estoque, fin = DATA.giro.months[DATA.giro.months.length-1];
      return optsFromList(uniq(Object.keys(e).concat(Object.keys(DATA.giro.cmv||{}))).sort(function(a,b){ return ((e[b]||{})[fin]||0)-((e[a]||{})[fin]||0); }));
    }},
    {key:'ano', label:'Ano', all:'Todos', plural:'anos', options:function(){
      return optsFromList(uniq(DATA.giro.months.map(function(m){ return m.slice(0,4); })).sort());
    }},
    {key:'mes', label:'Mês', all:'Todos', plural:'meses', options:function(){ return MES_OPTS; }}
  ],
  sort: [
    {key:'filial', label:'Filial', all:'Todas', plural:'filiais', options:function(){
      var t={}; ((DATA.abc&&DATA.abc.rows)||[]).forEach(function(r){ t[r[0]]=(t[r[0]]||0)+1; });
      return optsFromList(Object.keys(t).sort(function(a,b){ return t[b]-t[a]; }));
    }},
    {key:'pop', label:'POP', all:'Todos', plural:'faixas', options:function(){
      return POP_FAIXAS.map(function(f){ return {value:f.value, label:f.label}; });
    }}
  ],
  zv: [
    {key:'filial', label:'Filial', all:'Todas', plural:'filiais', options:function(){
      var t = DATA.zv.tot || {};
      return optsFromList(Object.keys(t).sort(function(a,b){ return t[b].total-t[a].total; }));
    }}
  ]
};

var fstate = {};
function resetTabState(tab){
  fstate[tab] = {};
  (TAB_FILTERS[tab]||[]).forEach(function(f){ fstate[tab][f.key] = f.single ? [f.def] : null; });
}
Object.keys(TAB_FILTERS).forEach(resetTabState);

function filterDef(tab,key){ return (TAB_FILTERS[tab]||[]).filter(function(f){ return f.key===key; })[0]; }
/* fstate[aba][chave]: null = todos marcados (sem filtro); lista = itens marcados (lista vazia = nenhum) */
function fRaw(tab,key){ return fstate[tab] ? fstate[tab][key] : null; }
function fSel(tab,key){ return fRaw(tab,key) || []; }
function fIsAll(tab,key){ return fRaw(tab,key) == null; }
function fSelOrAll(tab,key){
  var v = fRaw(tab,key);
  if (v != null) return v.slice();
  return filterDef(tab,key).options().map(function(o){ return o.value; });
}
function fHas(tab,key,val){ var v = fRaw(tab,key); return v == null || v.indexOf(val)>=0; }
function activeFilterCount(tab){
  if (tab==='compras') return CP.contarFiltros();
  var n=0;
  (TAB_FILTERS[tab]||[]).forEach(function(f){
    var v = (fstate[tab]||{})[f.key];
    if (f.single ? (v||[])[0]!==f.def : v != null) n++;
  });
  return n;
}

function periodoLabel(m){ var p=m.split('-'); return p[1]+'/'+p[0]; }
/* meses do Faturamento que passam pelos filtros Ano + Mês */
function fatMonths(){
  return DATA.fat.grid.months.filter(function(m){
    return fHas('fat','ano',m.slice(0,4)) && fHas('fat','mes',m.slice(5,7));
  });
}
/* merge per-filial top lists (produtos/vendedores/itens) */
function mergeTopByFilial(dict, sel, keyField, valField, extraFields, limit){
  var acc = {};
  sel.forEach(function(fil){
    var list = dict[fil];
    if (!list) return;
    list.forEach(function(it){
      var k = it[keyField];
      if (!acc[k]) { acc[k] = Object.assign({}, it); }
      else {
        acc[k][valField] = (acc[k][valField]||0) + (it[valField]||0);
        (extraFields||[]).forEach(function(f){ if (typeof it[f]==='number') acc[k][f] = (acc[k][f]||0) + it[f]; });
      }
    });
  });
  var arr = Object.keys(acc).map(function(k){ return acc[k]; });
  arr.sort(function(a,b){ return b[valField]-a[valField]; });
  return arr.slice(0, limit);
}


/* ---------- KPI tile ---------- */
function kpiTile(label, value, sub, subClass){
  var t = el('div','kpi-tile');
  t.appendChild(el('div','kpi-label', esc(label)));
  t.appendChild(el('div','kpi-value', esc(value)));
  if (sub) t.appendChild(el('div','kpi-sub'+(subClass?' '+subClass:''), sub));
  return t;
}

/* ---------- chart card wrapper ---------- */
function chartCard(title, span, note){
  var card = el('div','chart-card'+(span?' span-'+span:''));
  var head = el('div','chart-head');
  head.appendChild(el('div','chart-title', esc(title) + (note? ' <span class="n">'+esc(note)+'</span>':'')));
  card.appendChild(head);
  var body = el('div','chart-body');
  card.appendChild(body);
  return {card:card, body:body};
}
function emptyNote(body, msg){
  body.appendChild(el('div','chart-empty', esc(msg||'Sem dados para o filtro selecionado.')));
}
function fullCardSvgWidth(){
  var appW = Math.min(window.innerWidth, 1920);
  return Math.max(600, appW - 48 - 2 - 28);
}

/* ---------- line/area chart ---------- */
function lineChart(body, points, opts){
  opts = opts || {};
  if (!points.length){ emptyNote(body); return; }
  var color = opts.color || 'var(--cat-1)';
  var showValueLabels = !!opts.showValueLabels;
  var W = opts.width || 760, H = opts.height || 220, padL = 54, padR = 14, padT = showValueLabels?(points.length>8?42:32):14, padB = 26;
  var vals = points.map(function(p){return p.value;});
  var maxV = Math.max.apply(null, vals.concat([0]));
  var minV = Math.min.apply(null, vals.concat([0]));
  if (maxV === minV) maxV = minV + 1;
  var rangeV = maxV - minV;
  if (showValueLabels) rangeV = rangeV * 1.22;
  var innerW = W - padL - padR, innerH = H - padT - padB;
  function x(i){ return padL + (points.length<=1?0:(i/(points.length-1))*innerW); }
  function y(v){ return padT + innerH - ((v-minV)/rangeV)*innerH; }

  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('class','viz');
  svg.style.height = H+'px';

  var gridN = 4;
  for (var g=0; g<=gridN; g++){
    var gv = minV + (rangeV*g/gridN);
    var gy = y(gv);
    var line = document.createElementNS(svgNS,'line');
    line.setAttribute('x1',padL); line.setAttribute('x2',W-padR);
    line.setAttribute('y1',gy); line.setAttribute('y2',gy);
    line.setAttribute('class', g===0 && minV>=0 ? 'viz-baseline' : 'viz-grid-line');
    svg.appendChild(line);
    var lbl = document.createElementNS(svgNS,'text');
    lbl.setAttribute('x', padL-8); lbl.setAttribute('y', gy+3.5);
    lbl.setAttribute('text-anchor','end'); lbl.setAttribute('class','viz-axis-label');
    if (opts.fontSize) lbl.style.fontSize = opts.fontSize;
    lbl.textContent = opts.axisFmt ? opts.axisFmt(gv) : fmtBRL(gv, true);
    svg.appendChild(lbl);
  }

  var step = opts.labelStep || Math.max(1, Math.round(points.length/8));
  var lastIdx = points.length-1;
  points.forEach(function(p,i){
    if ((i % step === 0 && lastIdx-i >= step*0.6) || i === lastIdx){
      var t = document.createElementNS(svgNS,'text');
      t.setAttribute('x', x(i)); t.setAttribute('y', H-6);
      t.setAttribute('text-anchor','middle'); t.setAttribute('class','viz-axis-label');
      if (opts.fontSize) t.style.fontSize = opts.fontSize;
      t.textContent = p.label;
      svg.appendChild(t);
    }
  });

  var areaD = 'M ' + x(0) + ' ' + y(points[0].value);
  points.forEach(function(p,i){ if(i>0) areaD += ' L ' + x(i) + ' ' + y(p.value); });
  var lineD = areaD;
  areaD += ' L ' + x(points.length-1) + ' ' + y(minV>=0?minV:0) + ' L ' + x(0) + ' ' + y(minV>=0?minV:0) + ' Z';

  var area = document.createElementNS(svgNS,'path');
  area.setAttribute('d', areaD);
  area.setAttribute('fill', color);
  area.setAttribute('opacity','0.12');
  svg.appendChild(area);

  var path = document.createElementNS(svgNS,'path');
  path.setAttribute('d', lineD);
  path.setAttribute('fill','none');
  path.setAttribute('stroke', color);
  path.setAttribute('stroke-width','2');
  path.setAttribute('stroke-linejoin','round');
  path.setAttribute('stroke-linecap','round');
  svg.appendChild(path);

  points.forEach(function(p,i){
    var c = document.createElementNS(svgNS,'circle');
    c.setAttribute('cx',x(i)); c.setAttribute('cy',y(p.value)); c.setAttribute('r','2.6');
    c.setAttribute('fill', color);
    c.setAttribute('opacity','0');
    c.setAttribute('class','pt');
    svg.appendChild(c);
  });

  if (showValueLabels){
    var manyPts = points.length > 8;
    var vfSize = manyPts ? '10px' : (opts.fontSize || null);
    points.forEach(function(p,i){
      var vt = document.createElementNS(svgNS,'text');
      var yOff = manyPts ? (i%2===0 ? 9 : 22) : 9;
      vt.setAttribute('x', x(i)); vt.setAttribute('y', y(p.value)-yOff);
      vt.setAttribute('text-anchor','middle'); vt.setAttribute('class','viz-bar-label');
      vt.setAttribute('font-weight','700');
      if (vfSize) vt.style.fontSize = vfSize;
      vt.textContent = opts.valueFmt ? opts.valueFmt(p.value) : fmtBRL(p.value, true);
      svg.appendChild(vt);
    });
  }

  var overlay = document.createElementNS(svgNS,'rect');
  overlay.setAttribute('x',padL); overlay.setAttribute('y',padT);
  overlay.setAttribute('width',Math.max(innerW,1)); overlay.setAttribute('height',Math.max(innerH,1));
  overlay.setAttribute('fill','transparent');
  svg.appendChild(overlay);

  var pts = svg.querySelectorAll('.pt');
  overlay.addEventListener('mousemove', function(evt){
    var rect = svg.getBoundingClientRect();
    var relX = (evt.clientX-rect.left) * (W/rect.width);
    var i = Math.round(((relX-padL)/innerW) * (points.length-1));
    i = Math.max(0, Math.min(points.length-1, i));
    pts.forEach(function(c,idx){ c.setAttribute('opacity', idx===i?'1':'0'); });
    var p = points[i];
    showTooltip(evt.clientX, evt.clientY, '<div class="viz-tooltip-title">'+esc(p.label)+'</div><div class="viz-tooltip-row"><span class="viz-tooltip-key" style="background:'+color+'"></span><span>'+(opts.tipLabel||'Valor')+'</span><span class="viz-tooltip-val">'+(opts.valueFmt?opts.valueFmt(p.value):fmtBRL(p.value))+'</span></div>');
  });
  overlay.addEventListener('mouseleave', function(){ pts.forEach(function(c){c.setAttribute('opacity','0');}); hideTooltip(); });

  body.appendChild(svg);
}

/* ---------- combo chart: 2 bar series + 1 line series (dual axis) ---------- */
function comboChart(body, points, opts){
  opts = opts || {};
  if (!points.length){ emptyNote(body); return; }
  var showLine = opts.showLine !== false;
  var showValueLabels = opts.showValueLabels != null ? opts.showValueLabels : !showLine;
  var fontSize = opts.fontSize || null;
  var valueFontSize = opts.valueFontSize || '10.5px';
  var barColor1 = opts.barColor1 || 'var(--cat-1)';
  var barColor2 = opts.barColor2 || 'var(--cat-4)';
  var lineColor = opts.lineColor || 'var(--cat-7)';
  var bar1Label = opts.bar1Label || 'Série 1';
  var bar2Label = opts.bar2Label || 'Série 2';
  var lineLabel = opts.lineLabel || 'Série 3';

  var W = opts.width || 800, H = opts.height || 240, padL = 60, padR = showLine?56:14, padT = showValueLabels?58:14, padB = 26;
  var barVals = [];
  points.forEach(function(p){ barVals.push(p.bar1||0); barVals.push(p.bar2||0); });
  var maxBar = Math.max.apply(null, barVals.concat([0]));
  var minBar = Math.min.apply(null, barVals.concat([0]));
  if (maxBar===minBar) maxBar = minBar+1;
  maxBar = maxBar * (showValueLabels?1.3:1.12);
  if (minBar < 0) minBar = minBar * (showValueLabels?1.3:1.12);
  var rangeBar = maxBar - minBar || 1;

  var pctVals = points.map(function(p){ return p.line||0; });
  var maxPct = Math.max.apply(null, pctVals.concat([0]));
  var minPct = Math.min.apply(null, pctVals.concat([0]));
  var padPct = Math.max((maxPct-minPct)*0.18, 0.01);
  maxPct += padPct;
  minPct = minPct < 0 ? (minPct - padPct) : 0;
  var rangePct = maxPct - minPct || 1;

  var innerW = W - padL - padR, innerH = H - padT - padB;
  function xC(i){ return padL + ((i+0.5)/points.length) * innerW; }
  function yBar(v){ return padT + innerH - ((v-minBar)/rangeBar) * innerH; }
  function yPct(v){ return padT + innerH - ((v-minPct)/rangePct) * innerH; }

  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('class','viz');
  svg.style.height = H+'px';

  var gridN = 4;
  for (var g=0; g<=gridN; g++){
    var frac = g/gridN;
    var gy = padT + innerH - frac*innerH;
    var line = document.createElementNS(svgNS,'line');
    line.setAttribute('x1',padL); line.setAttribute('x2',W-padR);
    line.setAttribute('y1',gy); line.setAttribute('y2',gy);
    line.setAttribute('class', Math.abs(minBar+frac*rangeBar) < rangeBar*0.001 ? 'viz-baseline' : 'viz-grid-line');
    svg.appendChild(line);
    var lLbl = document.createElementNS(svgNS,'text');
    lLbl.setAttribute('x', padL-8); lLbl.setAttribute('y', gy+3.5);
    lLbl.setAttribute('text-anchor','end'); lLbl.setAttribute('class','viz-axis-label');
    if (fontSize) lLbl.style.fontSize = fontSize;
    lLbl.textContent = fmtBRL(minBar+frac*rangeBar, true);
    svg.appendChild(lLbl);
    if (showLine){
      var rLbl = document.createElementNS(svgNS,'text');
      rLbl.setAttribute('x', W-padR+8); rLbl.setAttribute('y', gy+3.5);
      rLbl.setAttribute('text-anchor','start'); rLbl.setAttribute('class','viz-axis-label');
      if (fontSize) rLbl.style.fontSize = fontSize;
      rLbl.textContent = fmtPct(minPct+frac*rangePct, 0);
      svg.appendChild(rLbl);
    }
  }

  var slot = innerW/points.length;
  var groupW = slot*0.6;
  var barW = groupW/2 * 0.82;
  var gap = groupW - barW*2;
  var step = Math.max(1, Math.round(points.length/9));
  var lastIdx = points.length-1;

  points.forEach(function(p,i){
    var cx = xC(i);
    var gx = cx - groupW/2;
    var b0 = yBar(0);
    var y1 = yBar(p.bar1||0), h1 = Math.abs(y1-b0);
    var r1 = document.createElementNS(svgNS,'rect');
    r1.setAttribute('x', gx); r1.setAttribute('y', Math.min(y1,b0));
    r1.setAttribute('width', barW); r1.setAttribute('height', Math.max(h1,0.5));
    r1.setAttribute('fill', barColor1); r1.setAttribute('rx','1.5');
    r1.setAttribute('class','combo-bar');
    svg.appendChild(r1);
    var y2 = yBar(p.bar2||0), h2 = Math.abs(y2-b0);
    var r2 = document.createElementNS(svgNS,'rect');
    r2.setAttribute('x', gx+barW+gap); r2.setAttribute('y', Math.min(y2,b0));
    r2.setAttribute('width', barW); r2.setAttribute('height', Math.max(h2,0.5));
    r2.setAttribute('fill', barColor2); r2.setAttribute('rx','1.5');
    r2.setAttribute('class','combo-bar');
    svg.appendChild(r2);

    if (showValueLabels){
      addTipLabel(svg, gx+barW/2, y1, b0, fmtBRL(p.bar1||0, true), barColor1, valueFontSize);
      addTipLabel(svg, gx+barW+gap+barW/2, y2, b0, fmtBRL(p.bar2||0, true), barColor2, valueFontSize);
    }

    if ((i % step === 0 && lastIdx-i >= step*0.6) || i === lastIdx){
      var t = document.createElementNS(svgNS,'text');
      t.setAttribute('x', cx); t.setAttribute('y', H-6);
      t.setAttribute('text-anchor','middle'); t.setAttribute('class','viz-axis-label');
      if (fontSize) t.style.fontSize = fontSize;
      t.textContent = p.label;
      svg.appendChild(t);
    }
  });

  function addTipLabel(svgEl, cx, yVal, y0, text, color, size){
    var svgNS2 = 'http://www.w3.org/2000/svg';
    var isPos = yVal <= y0;
    var t = document.createElementNS(svgNS2,'text');
    t.setAttribute('text-anchor','start');
    t.style.fontSize = size; t.style.fontWeight='700'; t.style.fill = color;
    t.textContent = text;
    if (isPos){
      var ay = Math.min(yVal,y0)-5;
      t.setAttribute('x', cx); t.setAttribute('y', ay);
      t.setAttribute('transform','rotate(-90 '+cx+' '+ay+')');
    } else {
      var ay2 = Math.max(yVal,y0)+5;
      t.setAttribute('x', cx); t.setAttribute('y', ay2);
      t.setAttribute('transform','rotate(90 '+cx+' '+ay2+')');
    }
    svgEl.appendChild(t);
  }

  if (showLine){
    var lineD = '';
    points.forEach(function(p,i){ lineD += (i===0?'M ':' L ') + xC(i) + ' ' + yPct(p.line||0); });
    var linePath = document.createElementNS(svgNS,'path');
    linePath.setAttribute('d', lineD);
    linePath.setAttribute('fill','none');
    linePath.setAttribute('stroke', lineColor);
    linePath.setAttribute('stroke-width','2.4');
    linePath.setAttribute('stroke-linejoin','round');
    linePath.setAttribute('stroke-linecap','round');
    svg.appendChild(linePath);

    points.forEach(function(p,i){
      var c = document.createElementNS(svgNS,'circle');
      c.setAttribute('cx',xC(i)); c.setAttribute('cy',yPct(p.line||0)); c.setAttribute('r','2.8');
      c.setAttribute('fill', lineColor);
      svg.appendChild(c);
    });
  }

  var overlay = document.createElementNS(svgNS,'rect');
  overlay.setAttribute('x',padL); overlay.setAttribute('y',padT);
  overlay.setAttribute('width',Math.max(innerW,1)); overlay.setAttribute('height',Math.max(innerH,1));
  overlay.setAttribute('fill','transparent');
  svg.appendChild(overlay);

  overlay.addEventListener('mousemove', function(evt){
    var rect = svg.getBoundingClientRect();
    var relX = (evt.clientX-rect.left) * (W/rect.width);
    var i = Math.floor((relX-padL)/slot);
    i = Math.max(0, Math.min(points.length-1, i));
    var p = points[i];
    var rows = '<div class="viz-tooltip-title">'+esc(p.label)+'</div>'+
      '<div class="viz-tooltip-row"><span class="viz-tooltip-key" style="background:'+barColor1+'"></span><span>'+esc(bar1Label)+'</span><span class="viz-tooltip-val">'+fmtBRL(p.bar1||0)+'</span></div>'+
      '<div class="viz-tooltip-row"><span class="viz-tooltip-key" style="background:'+barColor2+'"></span><span>'+esc(bar2Label)+'</span><span class="viz-tooltip-val">'+fmtBRL(p.bar2||0)+'</span></div>';
    if (showLine) rows += '<div class="viz-tooltip-row"><span class="viz-tooltip-key" style="background:'+lineColor+'"></span><span>'+esc(lineLabel)+'</span><span class="viz-tooltip-val">'+fmtPct(p.line||0,1)+'</span></div>';
    showTooltip(evt.clientX, evt.clientY, rows);
  });
  overlay.addEventListener('mouseleave', function(){ hideTooltip(); });

  body.appendChild(svg);

  var legend = el('div','legend-row legend-row-below');
  [{label:bar1Label,color:barColor1},{label:bar2Label,color:barColor2}].forEach(function(c){
    legend.appendChild(el('div','legend-item','<span class="legend-swatch" style="background:'+c.color+'"></span>'+esc(c.label)));
  });
  if (showLine) legend.appendChild(el('div','legend-item','<span class="legend-swatch line" style="background:'+lineColor+'"></span>'+esc(lineLabel)));
  if (fontSize) legend.querySelectorAll('.legend-item').forEach(function(it){ it.style.fontSize = fontSize; });
  body.appendChild(legend);
}

/* ---------- year-over-year bar chart with growth delta ---------- */
function yearBarChart(body, rows, opts){
  opts = opts || {};
  if (!rows.length){ emptyNote(body); return; }
  var color = opts.color || 'var(--cat-1)';
  var fontSize = opts.fontSize || null;
  var many0 = rows.length > 6;
  var W = opts.width || 760, H = opts.height || 250, padL = 64, padR = 14, padT = many0?66:46, padB = 30;
  var vals = rows.map(function(r){ return r.value; });
  var maxV = Math.max.apply(null, vals.concat([0])) * (many0?1.45:1.3);
  var minV = Math.min.apply(null, vals.concat([0]));
  if (minV > 0) minV = 0; else minV = minV * (many0?1.35:1.15);
  var rangeV = (maxV - minV) || 1;
  var innerW = W - padL - padR, innerH = H - padT - padB;
  function xC(i){ return padL + ((i+0.5)/rows.length) * innerW; }
  function yV(v){ return padT + innerH - ((v-minV)/rangeV) * innerH; }

  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('class','viz');
  svg.style.height = H+'px';

  var gridN = 4;
  for (var g=0; g<=gridN; g++){
    var frac = g/gridN;
    var gy = padT + innerH - frac*innerH;
    var gline = document.createElementNS(svgNS,'line');
    gline.setAttribute('x1',padL); gline.setAttribute('x2',W-padR);
    gline.setAttribute('y1',gy); gline.setAttribute('y2',gy);
    gline.setAttribute('class', Math.abs(minV+frac*rangeV) < rangeV*0.001 ? 'viz-baseline' : 'viz-grid-line');
    svg.appendChild(gline);
    var lbl = document.createElementNS(svgNS,'text');
    lbl.setAttribute('x', padL-8); lbl.setAttribute('y', gy+3.5);
    lbl.setAttribute('text-anchor','end'); lbl.setAttribute('class','viz-axis-label');
    if (fontSize) lbl.style.fontSize = fontSize;
    lbl.textContent = opts.axisFmt ? opts.axisFmt(minV+frac*rangeV) : fmtBRL(minV+frac*rangeV, true);
    svg.appendChild(lbl);
  }

  var many = rows.length > 6;
  var rotateLabels = opts.rotateLabels != null ? opts.rotateLabels : many;
  var xStep = many ? Math.max(1, Math.round(rows.length/9)) : 1;
  var xLastIdx = rows.length-1;
  var valFontSize = fontSize ? (many ? '10px' : fontSize) : null;
  var barW = Math.min(innerW/rows.length*0.46, 88);
  var b0 = yV(0);
  rows.forEach(function(r,i){
    var cx = xC(i);
    var y1 = yV(r.value), h1 = Math.abs(y1-b0);
    var rect = document.createElementNS(svgNS,'rect');
    rect.setAttribute('x', cx-barW/2); rect.setAttribute('y', Math.min(y1,b0));
    rect.setAttribute('width', barW); rect.setAttribute('height', Math.max(h1,0.5));
    rect.setAttribute('fill', color); rect.setAttribute('rx','2');
    svg.appendChild(rect);

    var valText = opts.valueFmt ? opts.valueFmt(r.value) : fmtBRL(r.value, opts.valueCompact !== false, !!opts.valueNoPrefix);
    if (rotateLabels){
      var isPos = y1 <= b0;
      var valLbl = document.createElementNS(svgNS,'text');
      valLbl.setAttribute('text-anchor','start'); valLbl.setAttribute('class','viz-bar-label');
      valLbl.setAttribute('font-weight','700');
      if (valFontSize) valLbl.style.fontSize = valFontSize;
      valLbl.textContent = valText;
      if (isPos){
        var ay = Math.min(y1,b0)-5;
        valLbl.setAttribute('x', cx); valLbl.setAttribute('y', ay);
        valLbl.setAttribute('transform','rotate(-90 '+cx+' '+ay+')');
      } else {
        var ay2 = Math.max(y1,b0)+5;
        valLbl.setAttribute('x', cx); valLbl.setAttribute('y', ay2);
        valLbl.setAttribute('transform','rotate(90 '+cx+' '+ay2+')');
      }
      svg.appendChild(valLbl);
    } else {
      var valLbl2 = document.createElementNS(svgNS,'text');
      valLbl2.setAttribute('x', cx); valLbl2.setAttribute('y', Math.min(y1,b0)-8);
      valLbl2.setAttribute('text-anchor','middle'); valLbl2.setAttribute('class','viz-bar-label');
      valLbl2.setAttribute('font-weight','700');
      if (valFontSize) valLbl2.style.fontSize = valFontSize;
      valLbl2.textContent = valText;
      svg.appendChild(valLbl2);
    }

    if (r.delta != null){
      var up = r.delta >= 0;
      var deltaLbl = document.createElementNS(svgNS,'text');
      deltaLbl.setAttribute('x', cx); deltaLbl.setAttribute('y', Math.min(y1,b0)-(fontSize?24:21));
      deltaLbl.setAttribute('text-anchor','middle');
      deltaLbl.setAttribute('font-size', fontSize||'11px'); deltaLbl.setAttribute('font-weight','700');
      deltaLbl.setAttribute('fill', up ? 'var(--status-good)' : 'var(--status-critical)');
      deltaLbl.textContent = (up?'▲ ':'▼ ') + fmtPct(Math.abs(r.delta),1);
      svg.appendChild(deltaLbl);
    }

    if (!many || (i % xStep === 0 && xLastIdx-i >= xStep*0.6) || i === xLastIdx){
      var t = document.createElementNS(svgNS,'text');
      t.setAttribute('x', cx); t.setAttribute('y', H-8);
      t.setAttribute('text-anchor','middle'); t.setAttribute('class','viz-axis-label');
      if (fontSize) t.style.fontSize = fontSize;
      t.textContent = r.label;
      svg.appendChild(t);
    }
  });

  body.appendChild(svg);
}

/* ---------- rank list (horizontal bars) ---------- */
function rankList(body, rows, opts){
  opts = opts || {};
  if (!rows.length){ emptyNote(body); return; }
  var wrap = el('div','rank-table');
  var maxV = Math.max.apply(null, rows.map(function(r){return Math.abs(r.value);}).concat([1]));
  rows.forEach(function(r,i){
    var row = el('div','rank-row');
    row.appendChild(el('div','rank-rank', String(i+1)));
    row.appendChild(el('div','rank-label', esc(r.label)));
    var track = el('div','rank-bar-track');
    var fill = el('div','rank-bar-fill');
    fill.style.width = Math.max(2, Math.abs(r.value)/maxV*100) + '%';
    if (r.color) fill.style.background = r.color;
    track.appendChild(fill);

    row.appendChild(el('div','rank-value', opts.valueFmt ? opts.valueFmt(r.value) : fmtBRL(r.value, true)));

      row.appendChild(el('div','rank-pct', fmtPct(r.pct,1)));
    } else {
      row.appendChild(el('div','rank-pct',''));
    }
    wrap.appendChild(row);
  });
  body.appendChild(wrap);
}

/* ---------- stacked segment bars (Inventário por filial x categoria) ---------- */
function stackedBars(body, rows, cats){
  if (!rows.length){ emptyNote(body); return; }
  var maxTotal = Math.max.apply(null, rows.map(function(r){return r.total;}).concat([1]));
  var wrap = el('div','compare-bars');
  rows.forEach(function(r){
    var group = el('div','compare-row');
    var head = el('div','compare-row-head');
    head.innerHTML = '<span>'+esc(r.filial)+'</span><span>'+fmtBRL(r.total, true)+'</span>';
    group.appendChild(head);
    var widthPct = Math.max(1, r.total/maxTotal*100);
    var inner = el('div');
    inner.style.cssText = 'display:flex; width:'+widthPct+'%; height:20px; border-radius:6px; overflow:hidden; background:none;';
    cats.forEach(function(cat){
      var v = r[cat.key] || 0;
      if (v<=0) return;
      var seg = document.createElement('div');
      var segPct = v/r.total*100;
      seg.style.cssText = 'width:'+segPct+'%; background:'+cat.color+'; height:100%; cursor:pointer;';
      seg.addEventListener('mousemove', function(evt){
        showTooltip(evt.clientX, evt.clientY, '<div class="viz-tooltip-title">'+esc(r.filial)+' · '+esc(cat.label)+'</div><div class="viz-tooltip-row"><span class="viz-tooltip-val">'+fmtBRL(v)+'</span></div>');
      });
      seg.addEventListener('mouseleave', hideTooltip);
      inner.appendChild(seg);
    });
    var outerTrack = el('div');
    outerTrack.style.cssText = 'height:20px; border-radius:6px; background:var(--gridline); overflow:hidden;';
    outerTrack.appendChild(inner);
    group.appendChild(outerTrack);
    wrap.appendChild(group);
  });
  body.appendChild(wrap);
}

    var group = el('div','compare-row');
    var head = el('div','compare-row-head');
    head.innerHTML = '<span>'+esc(r.label)+'</span><span>'+fmtNum(r.covered)+' / '+fmtNum(r.total)+' &middot; '+fmtPct(r.pct,1)+'</span>';
    group.appendChild(head);
    var track = el('div','compare-track');
    track.style.width = Math.max(4, r.total/maxV*100)+'%';
    var fill = el('div','compare-fill');
    fill.style.width = Math.min(100, r.pct*100)+'%';
    fill.style.background = r.color || 'var(--cat-1)';
    track.appendChild(fill);
    group.appendChild(track);
    wrap.appendChild(group);
  });
  body.appendChild(wrap);
}

function dataTable(body, cols, rows){
  if (!rows.length){ emptyNote(body); return; }
  var scroll = el('div','chart-scroll');
  var table = el('table','data-table');
  var thead = el('thead');
  var htr = el('tr');
  cols.forEach(function(c){ var th=el('th', c.num?'num':'', esc(c.label)); htr.appendChild(th); });
  thead.appendChild(htr); table.appendChild(thead);
  var tbody = el('tbody');
  rows.forEach(function(r){
    var tr = el('tr');
    cols.forEach(function(c){
      var td = el('td', c.num?'num':'');
      td.textContent = c.fmt ? c.fmt(r[c.key]) : r[c.key];
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroll.appendChild(table);
  body.appendChild(scroll);
}

function giroColor(g){
  if (g==null) return 'var(--text-muted)';
  if (g >= 1) return 'var(--status-good)';
  if (g >= 0.3) return 'var(--status-warning)';
  return 'var(--status-critical)';
}
function pctColor(p, goodLow){
  if (goodLow){
    if (p <= 0.2) return 'var(--status-good)';
    if (p <= 0.5) return 'var(--status-warning)';
    return 'var(--status-critical)';
  }
  if (p >= 0.7) return 'var(--status-good)';
  if (p >= 0.5) return 'var(--status-warning)';
  return 'var(--status-critical)';
}

function buildFaturamento(){
  var sel = fSelOrAll('fat','filial');
  var allMonths = DATA.fat.grid.months;
  var months = fatMonths();
  var grid = DATA.fat.grid.grid;
  var comprasGrid = DATA.compras && DATA.compras.grid || {};
  var clientsGrid = DATA.fat.clients_grid || {};

  var devolGrid = (DATA.fat.devol_grid && DATA.fat.devol_grid.grid) || {};

  var kpi = {valor:0, impostos:0, cmv:0, devolucoes:0};
  var clientSet = {};
  var byFilial = [];
  sel.forEach(function(fil){
    var g = grid[fil];
    var fv=0, fi=0, fc=0;
    if (g){
      months.forEach(function(m){ var d=g[m]; if (d){ fv+=d.v; fi+=d.i; fc+=d.c; } });
    }
    var cg = clientsGrid[fil];
    if (cg){ months.forEach(function(m){ var cl=cg[m]; if (cl) cl.forEach(function(id){ clientSet[id]=1; }); }); }
    var dg = devolGrid[fil];
    if (dg){ months.forEach(function(m){ var dv=dg[m]; if (dv){ kpi.devolucoes+=dv; } }); }
    var fvl = fv - fi, flb = fvl - fc;
    if (fv || fi || fc){ byFilial.push({filial:fil, valor:fv, impostos:fi, cmv:fc, vendaLiq:fvl, lb:flb, pctLb: fvl?flb/fvl:0}); }
    kpi.valor+=fv; kpi.impostos+=fi; kpi.cmv+=fc;
  });
  byFilial.sort(function(a,b){return b.valor-a.valor;});

  var vendaLiquida = kpi.valor - kpi.impostos;
  var lucroBruto = vendaLiquida - kpi.cmv;
  var pctLB = vendaLiquida ? lucroBruto/vendaLiquida : 0;
  var qtdeClientes = Object.keys(clientSet).length;

  /* últimos meses (fixo, independente do filtro de período) */
  var last13 = allMonths.slice(-13);
  function monthAgg(m){
    var bv=0, bi=0, bc=0;
    sel.forEach(function(fil){
      var d = grid[fil] && grid[fil][m];
      if (d){ bv+=d.v; bi+=d.i; bc+=d.c; }
    });
    var bvl = bv-bi, blb = bvl-bc;
    return { v: bv, vl: bvl, lb: blb };
  }
  var combo13Points = last13.map(function(m){
    var a = monthAgg(m);
    return { label: monthLabel(m), bar1: a.v, bar2: a.lb };
  });
  var pct13Points = last13.map(function(m){
    var a = monthAgg(m);
    return { label: monthLabel(m), value: a.vl ? a.lb/a.vl : 0 };
  });

  /* agregação por ano: comparativo fixo de todos os anos da base — ignora Ano e Mês, segue só o filtro de Filial */
  var years = [];
  allMonths.forEach(function(m){ var y=m.slice(0,4); if (years.indexOf(y)<0) years.push(y); });
  years.sort();
  var yearAgg = years.map(function(y){
    var monthsInYear = allMonths.filter(function(m){ return m.slice(0,4)===y; });
    var yv=0, yi=0, yc=0;
    monthsInYear.forEach(function(m){
      sel.forEach(function(fil){
        var d = grid[fil] && grid[fil][m];
        if (d){ yv+=d.v; yi+=d.i; yc+=d.c; }
      });
    });
    var yvl = yv-yi, ylb = yvl-yc;
    var label = monthsInYear.length<12 ? y+' ('+monthsInYear.length+'m)' : y;
    return { year:y, label:label, valor:yv, vl:yvl, lb:ylb, pctLb: yvl?ylb/yvl:0 };
  });
  var faturamentoAnoRows = yearAgg.map(function(r,i){
    var prev = i>0 ? yearAgg[i-1] : null;
    return { label:r.label, value:r.valor, delta: prev && prev.valor ? (r.valor-prev.valor)/prev.valor : null };
  });
  var lucroAnoRows = yearAgg.map(function(r,i){
    var prev = i>0 ? yearAgg[i-1] : null;
    return { label:r.label, value:r.lb, delta: prev && prev.lb ? (r.lb-prev.lb)/prev.lb : null };
  });
  var pctLbAnoRows = yearAgg.map(function(r,i){
    var prev = i>0 ? yearAgg[i-1] : null;
    return { label:r.label, value:r.pctLb, delta: prev ? r.pctLb-prev.pctLb : null };
  });

  var panel = el('div','tab-panel', '');
  var kpiRow = el('div','kpi-row kpi-row-8');
  kpiRow.appendChild(kpiTile('Faturamento total', fmtBRL(kpi.valor)));
  kpiRow.appendChild(kpiTile('Devoluções', fmtBRL(kpi.devolucoes)));
  kpiRow.appendChild(kpiTile('Impostos', fmtBRL(kpi.impostos)));
  kpiRow.appendChild(kpiTile('Venda líquida', fmtBRL(vendaLiquida)));
  kpiRow.appendChild(kpiTile('CMV', fmtBRL(kpi.cmv)));
  kpiRow.appendChild(kpiTile('Lucro bruto', fmtBRL(lucroBruto)));
  kpiRow.appendChild(kpiTile('% LB', fmtPct(pctLB,1)));
  kpiRow.appendChild(kpiTile('Clientes', fmtNum(qtdeClientes)));
  panel.appendChild(kpiRow);

  var FONT_MATCH = '12.5px';

  var fatMonthlyRows = combo13Points.map(function(p){ return {label:p.label, value:p.bar1}; });
  var lbMonthlyRows = combo13Points.map(function(p){ return {label:p.label, value:p.bar2}; });

  var gridFilial = el('div','chart-grid');

  var c6 = chartCard('Faturamento por filial', 1);
  rankList(c6.body, byFilial.map(function(f){return {label:f.filial, value:f.valor, color:'var(--status-good)'};}), {showPct:false, valueFmt:function(v){return fmtBRL(v,true);}});
  gridFilial.appendChild(c6.card);

  var c7 = chartCard('Lucro bruto por filial', 1);
  rankList(c7.body, byFilial.slice().sort(function(a,b){return b.lb-a.lb;}).map(function(f){return {label:f.filial, value:f.lb, color:'var(--status-good)'};}), {showPct:false, valueFmt:function(v){return fmtBRL(v,true);}});
  gridFilial.appendChild(c7.card);

  var c9 = chartCard('% LB por filial', 1);
  rankList(c9.body, byFilial.slice().sort(function(a,b){return b.pctLb-a.pctLb;}).map(function(f){
    return {label:f.filial, value:f.pctLb, pct:null, color: f.pctLb>=0.3?'var(--status-good)':(f.pctLb>=0.1?'var(--status-warning)':'var(--status-critical)')};
  }), {showPct:false, valueFmt:function(v){return fmtPct(v,1);}});
  gridFilial.appendChild(c9.card);

  panel.appendChild(gridFilial);

  var gridAno = el('div','chart-grid');

  var c3 = chartCard('Faturamento por ano', 1, 'todos os anos');
  yearBarChart(c3.body, faturamentoAnoRows, {width:460, fontSize:FONT_MATCH, color:'var(--status-good)'});
  gridAno.appendChild(c3.card);

  var c4 = chartCard('Lucro bruto por ano', 1, 'todos os anos');
  yearBarChart(c4.body, lucroAnoRows, {width:460, fontSize:FONT_MATCH, color:'var(--cat-4)'});
  gridAno.appendChild(c4.card);

  var c5 = chartCard('% LB por ano', 1, 'todos os anos');
  yearBarChart(c5.body, pctLbAnoRows, {
    width:460, fontSize:FONT_MATCH, color:'var(--status-good)',
    axisFmt:function(v){return fmtPct(v,0);}, valueFmt:function(v){return fmtPct(v,1);}
  });
  gridAno.appendChild(c5.card);

  panel.appendChild(gridAno);

  var gridPctLB = el('div','chart-grid');
  var c8 = chartCard('% Lucro bruto', 3, 'últimos 13 meses');
  lineChart(c8.body, pct13Points.map(function(p){return {label:p.label, value:p.value};}), {
    width:1400, height:280, fontSize:FONT_MATCH, showValueLabels:true,
    color:'var(--status-good)', tipLabel:'% Lucro bruto', labelStep:1,
    axisFmt:function(v){return fmtPct(v,0);}, valueFmt:function(v){return fmtPct(v,1);}
  });
  gridPctLB.appendChild(c8.card);
  panel.appendChild(gridPctLB);

  var gridSide = el('div','chart-grid-2');

  var c1 = chartCard('Faturamento', null, 'últimos 13 meses');
  yearBarChart(c1.body, fatMonthlyRows, {width:700, height:300, fontSize:FONT_MATCH, color:'var(--status-good)', valueCompact:false, valueNoPrefix:true});
  gridSide.appendChild(c1.card);

  var c2 = chartCard('Lucro bruto', null, 'últimos 13 meses');
  yearBarChart(c2.body, lbMonthlyRows, {width:700, height:300, fontSize:FONT_MATCH, color:'var(--cat-4)', valueCompact:false, valueNoPrefix:true});
  gridSide.appendChild(c2.card);

  panel.appendChild(gridSide);

  return panel;
}

function buildInvHeatmap(body, byFilial, byArz, cross){
  var wrap = el('div','chart-scroll');
  var table = document.createElement('table');
  table.className = 'data-table heatmap-table';

  /* máximo por coluna (armazém), para normalizar a intensidade de cor dentro de cada coluna */
  var colMax = {};
  byArz.forEach(function(a){
    var mx = 0;
    byFilial.forEach(function(f){ var v = (cross[f.filial]&&cross[f.filial][a.nome])||0; if (v>mx) mx=v; });
    colMax[a.nome] = mx;
  });

  function cellStyle(v, mx){
    if (!v || !mx) return '';
    var r = Math.max(0, Math.min(1, v/mx));
    var pct = Math.round(6 + r*38);
    return ' style="background:color-mix(in srgb, var(--status-good) '+pct+'%, var(--surface)); color:var(--text-primary);"';
  }

  var thead = document.createElement('thead');
  var htr = document.createElement('tr');
  htr.innerHTML = '<th>Filial</th>' + byArz.map(function(a){ return '<th class="num">'+esc(a.nome)+'</th>'; }).join('') + '<th class="num">Total</th>';
  thead.appendChild(htr);
  table.appendChild(thead);

  var tbody = document.createElement('tbody');
  byFilial.forEach(function(f){
    var tr = document.createElement('tr');
    var cells = '<td>'+esc(f.filial)+'</td>';
    byArz.forEach(function(a){
      var v = (cross[f.filial]&&cross[f.filial][a.nome])||0;
      if (v < 1) v = 0;
      cells += '<td class="num"'+cellStyle(v, colMax[a.nome])+'>'+(v?fmtBRL(v,true):'<span style="color:var(--text-muted)">–</span>')+'</td>';
    });
    cells += '<td class="num" style="font-weight:700;">'+fmtBRL(f.valor,true)+'</td>';
    tr.innerHTML = cells;
    tbody.appendChild(tr);
  });
  var totalTr = document.createElement('tr');
  totalTr.className = 'heatmap-total-row';
  var totalCells = '<td>Total</td>';
  byArz.forEach(function(a){ totalCells += '<td class="num">'+fmtBRL(a.valor,true)+'</td>'; });
  totalCells += '<td class="num">'+fmtBRL(byFilial.reduce(function(s,f){return s+f.valor;},0),true)+'</td>';
  totalTr.innerHTML = totalCells;
  tbody.appendChild(totalTr);
  table.appendChild(tbody);

  wrap.appendChild(table);
  body.appendChild(wrap);
}

function buildInventario(){
  /* Visão baseada em Inventário_de_Peças.xlsx + Armazém.xlsx.
     Filtros da aba: Filial e Armazém. */
  var inv = DATA.invPecas;
  var cross = inv.cross || {};
  var selFil = fSelOrAll('inv','filial');
  var selArz = fSelOrAll('inv','arz');
  var allFil = fIsAll('inv','filial'), allArz = fIsAll('inv','arz');

  function cellV(fil, arz){ return (cross[fil] && cross[fil][arz]) || 0; }

  var byFilial = selFil.map(function(fil){
    var base = inv.by_filial.filter(function(f){ return f.filial===fil; })[0] || {valor:0};
    var v = allArz ? base.valor : selArz.reduce(function(s,a){ return s+cellV(fil,a); },0);
    return {filial:fil, valor:v};
  }).filter(function(f){ return f.valor>=1; }).sort(function(a,b){ return b.valor-a.valor; });

  var byArz = selArz.map(function(a){
    var base = inv.by_arz.filter(function(x){ return x.nome===a; })[0] || {valor:0};
    var v = allFil ? base.valor : selFil.reduce(function(s,f){ return s+cellV(f,a); },0);
    return {nome:a, valor:v};
  }).filter(function(a){ return a.valor>=1; }).sort(function(a,b){ return b.valor-a.valor; });

  var totalValor = byFilial.reduce(function(s,f){ return s+f.valor; },0);

  var skusAll = inv.skus_by_filial || [];
  var skusSel = skusAll.filter(function(f){ return selFil.indexOf(f.filial)>=0; });
  var skusSelTotal = skusSel.reduce(function(s,f){ return s+f.skus; },0);
  var skusByFilial = skusSel.slice().sort(function(a,b){ return b.skus-a.skus; })
    .map(function(f){ return {filial:f.filial, skus:f.skus, pct: skusSelTotal? f.skus/skusSelTotal : 0}; });

  var panel = el('div','tab-panel','');

  var kpiRow = el('div','kpi-row kpi-row-3');
  kpiRow.appendChild(kpiTile('Valor do inventário', fmtBRL(totalValor),
    (allFil && allArz) ? 'Todas as filiais e armazéns' : fmtPct(inv.kpi.valor_total? totalValor/inv.kpi.valor_total : 0,1)+' do total'));
  if (allFil){
    kpiRow.appendChild(kpiTile("SKU's com saldo", fmtNum(inv.kpi.skus), 'Sem repetição'));
  } else {
    kpiRow.appendChild(kpiTile("SKU's com saldo", '—', 'Sem repetição · só disponível sem filtro de filial'));
  }
  kpiRow.appendChild(kpiTile("SKU's com saldo", fmtNum(allFil ? inv.kpi.skus_repeat : skusSelTotal), 'Repete por filial'+(allArz?'':' · não filtra por armazém')));
  panel.appendChild(kpiRow);

  var grid2 = el('div','chart-grid');
  var c1 = chartCard('Valor do inventário por filial', 1);
  rankList(c1.body, byFilial.map(function(f){return {label:f.filial, value:f.valor, pct: totalValor?f.valor/totalValor:0, color:'var(--status-good)'};}), {showPct:true, valueFmt:function(v){return fmtBRL(v,true);}});
  grid2.appendChild(c1.card);

  var c2 = chartCard('Valor do inventário por armazém', 1);
  rankList(c2.body, byArz.map(function(f){return {label:f.nome, value:f.valor, pct: totalValor?f.valor/totalValor:0, color:'var(--status-good)'};}), {showPct:true, valueFmt:function(v){return fmtBRL(v,true);}});
  grid2.appendChild(c2.card);

  var c2b = chartCard("SKU's por filial", 1, allArz ? null : 'todos os armazéns');
  rankList(c2b.body, skusByFilial.map(function(f){return {label:f.filial, value:f.skus, pct:f.pct, color:'var(--status-good)'};}), {showPct:true, valueFmt:function(v){return fmtNum(v);}});
  grid2.appendChild(c2b.card);

  panel.appendChild(grid2);

  var gridCross = el('div','chart-grid');
  var c3 = chartCard('Valor do inventário por filial e armazém', 3);
  if (byFilial.length && byArz.length){
    var crossView = {};
    byFilial.forEach(function(f){ crossView[f.filial] = {}; byArz.forEach(function(a){ crossView[f.filial][a.nome] = cellV(f.filial,a.nome); }); });
    buildInvHeatmap(c3.body, byFilial, byArz, crossView);
  } else { emptyNote(c3.body); }
  gridCross.appendChild(c3.card);
  panel.appendChild(gridCross);

  var hist = inv.hist;
  if (hist && hist.months && hist.months.length){
    var histLast13 = hist.months.slice(-13);
    var showHist = allArz || selArz.indexOf('Peças varejo')>=0;
    var histPoints = histLast13.map(function(m){
      var v = 0;
      if (allFil) v = hist.total[m] || 0;
      else selFil.forEach(function(f){ var g = hist.grid[HIST_ALIAS[f]||f] || hist.grid[f]; if (g && g[m]!=null) v += g[m]; });
      return { label: monthLabel(m), value: v };
    });
    var gridHist = el('div','chart-grid');
    var c4 = chartCard('Evolução do estoque Varejo', 3, 'últimos 13 meses · armazém Peças varejo');
    if (showHist){
      lineChart(c4.body, histPoints, {
        width:fullCardSvgWidth(), height:440, fontSize:'12.5px', showValueLabels:true,
        color:'var(--status-good)', tipLabel:'Valor do inventário', labelStep:1,
        axisFmt:function(v){return fmtBRL(v,true);}, valueFmt:function(v){return fmtBRL(v,true);}
      });
    } else {
      emptyNote(c4.body, 'O histórico existe só para o armazém Peças varejo — inclua-o no filtro de Armazém para ver a evolução.');
    }
    gridHist.appendChild(c4.card);
    panel.appendChild(gridHist);
  }

  return panel;
}

/* ===== GIRO =====
   Fontes: CMV = Base_Fat. (soma da coluna CMV, devoluções já negativas); Estoque = Estoque Histórico.xlsx (saldo mensal armazém 01).
   Janela = 12 meses terminando no mês mais recente das combinações Ano/Mês selecionadas.
   Estoque médio = média dos saldos mensais da janela (mês sem saldo na filial = 0).
   CMV 12m = soma do CMV da janela. Giro = CMV 12m / Estoque médio. */
function addMonths(mk, n){
  var y=+mk.slice(0,4), m=+mk.slice(5,7)+n;
  while(m<=0){ m+=12; y--; } while(m>12){ m-=12; y++; }
  return y+'-'+String(m).padStart(2,'0');
}
function giroWindowEnding(end){
  var base = {}; DATA.giro.months.forEach(function(m){ base[m]=1; });
  var list = [];
  for (var i=11;i>=0;i--){ var k=addMonths(end,-i); if (base[k]) list.push(k); }
  return list;
}
function giroWindow(){
  var cand = DATA.giro.months.filter(function(m){ return fHas('giro','ano',m.slice(0,4)) && fHas('giro','mes',m.slice(5,7)); });
  if (!cand.length) return {end:null, months:[]};
  var end = cand[cand.length-1];
  return {end:end, months:giroWindowEnding(end)};
}
function giroCalc(fils, months){
  var est = DATA.giro.estoque, cmv = DATA.giro.cmv;
  var n = months.length || 1, sumE=0, sumC=0;
  fils.forEach(function(f){
    months.forEach(function(m){ sumE += ((est[f]||{})[m])||0; sumC += ((cmv[f]||{})[m])||0; });
  });
  var med = sumE/n;
  return {estMedio:med, cmv:sumC, giro: med ? sumC/med : null};
}
function giroFmt(v){ return v==null ? '—' : v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'x'; }

function buildGiro(){
  var sel = fSelOrAll('giro','filial');
  var allFil = fIsAll('giro','filial');
  var w = giroWindow();
  var panel = el('div','tab-panel','');
  if (!w.end){ var cE = chartCard('Giro', 3); emptyNote(cE.body, 'Sem estoque para o Ano/Mês selecionados.'); panel.appendChild(cE.card); return panel; }
  var months = w.months, end = w.end, prev = addMonths(end,-1);
  var est = DATA.giro.estoque, cmv = DATA.giro.cmv;

  var rows = sel.map(function(f){
    var c = giroCalc([f], months);
    var fim = ((est[f]||{})[end])||0, ant = ((est[f]||{})[prev]);
    return {filial:f, estMedio:c.estMedio, cmv:c.cmv, giro:c.giro, fim:fim, delta: ant ? (fim-ant)/ant : null};
  }).filter(function(r){ return r.estMedio || r.cmv || r.fim; });
  var tot = giroCalc(sel, months);
  var totFim = 0, totAnt = 0;
  sel.forEach(function(f){ totFim += ((est[f]||{})[end])||0; totAnt += ((est[f]||{})[prev])||0; });
  var criticos = rows.filter(function(r){ return r.estMedio>0 && r.giro!=null && r.giro < 0.3; }).length;
  var coberturaMeses = tot.cmv>0 ? totFim/(tot.cmv/12) : null;

  var kpiRow = el('div','kpi-row');
  kpiRow.style.gridTemplateColumns = 'repeat(auto-fit, minmax(170px,1fr))';
  kpiRow.appendChild(kpiTile('Giro', giroFmt(tot.giro), 'CMV 12m / estoque médio'));
  kpiRow.appendChild(kpiTile('Estoque médio', fmtBRL(tot.estMedio,true), 'média de '+months.length+' meses'));
  kpiRow.appendChild(kpiTile('CMV 12 meses', fmtBRL(tot.cmv,true), monthLabel(months[0])+' a '+monthLabel(end)));
  kpiRow.appendChild(kpiTile('Estoque em '+monthLabel(end), fmtBRL(totFim,true), totAnt ? ((totFim>=totAnt?'+':'')+fmtPct((totFim-totAnt)/totAnt,1)+' vs. mês anterior') : ''));
  kpiRow.appendChild(kpiTile('Cobertura', coberturaMeses==null?'—':coberturaMeses.toLocaleString('pt-BR',{maximumFractionDigits:1})+' meses', 'estoque final / CMV médio mensal'));
  kpiRow.appendChild(kpiTile('Filiais em giro crítico', String(criticos), 'giro < 0,30x', criticos>0?'warn':'good'));
  panel.appendChild(kpiRow);

  var grid1 = el('div','chart-grid');
  var c1 = chartCard('Ranking de giro por filial', 2, 'CMV 12m / Estoque médio');
  var ranked = rows.filter(function(r){ return r.estMedio>0; }).sort(function(a,b){ return (b.giro||0)-(a.giro||0); });

  grid1.appendChild(c1.card);
  var c2 = chartCard('Variação do estoque em '+monthLabel(end), 1, 'vs. '+monthLabel(prev));
  var rows2 = rows.filter(function(r){ return r.delta!=null && r.estMedio >= 30000; }).sort(function(a,b){ return Math.abs(b.delta)-Math.abs(a.delta); }).slice(0,9);
  rankList(c2.body, rows2.map(function(r){ return {label:r.filial, value:r.delta, color: r.delta>=0?'var(--status-good)':'var(--status-critical)'}; }), {showPct:false, valueFmt:function(v){return (v>=0?'+':'')+fmtPct(v,1);}});
  grid1.appendChild(c2.card);
  panel.appendChild(grid1);

  var scope = allFil ? 'rede' : (sel.length===1 ? sel[0] : sel.length+' filiais');
  var grid2 = el('div','chart-grid');
  var c3 = chartCard('Giro móvel 12 meses · '+scope, 3, 'cada ponto = CMV dos 12 meses até o mês / estoque médio do mesmo período');
  var gPts = months.map(function(m){ var g = giroCalc(sel, giroWindowEnding(m)); return {label:monthLabel(m), value:g.giro||0}; });
  lineChart(c3.body, gPts, {width:fullCardSvgWidth(), height:240, color:'var(--status-good)', tipLabel:'Giro', showValueLabels:true, labelStep:1,
    axisFmt:function(v){ return v.toLocaleString('pt-BR',{maximumFractionDigits:2})+'x'; }, valueFmt:giroFmt});
  grid2.appendChild(c3.card);
  panel.appendChild(grid2);

  var grid3 = el('div','chart-grid');
  var c4 = chartCard('Estoque mensal · '+scope, 3, 'Estoque Histórico');
  var ePts = months.map(function(m){ var v=0; sel.forEach(function(f){ v += ((est[f]||{})[m])||0; }); return {label:monthLabel(m), value:v}; });
  lineChart(c4.body, ePts, {width:fullCardSvgWidth(), height:280, color:'var(--cat-6)', tipLabel:'Estoque', showValueLabels:true, labelStep:1,
    valueFmt:function(v){ return fmtBRL(v,true); }});
  grid3.appendChild(c4.card);
  panel.appendChild(grid3);

  var c6 = chartCard('Memória de cálculo por filial', 3, monthLabel(months[0])+' a '+monthLabel(end));
  var scroll = el('div','chart-scroll');
  var tbl = el('table','data-table heatmap-table');
  tbl.innerHTML = '<thead><tr><th>Filial</th><th class="num">Estoque médio</th><th class="num">CMV 12m</th><th class="num">Giro</th><th class="num">Cobertura (meses)</th><th class="num">Estoque '+esc(monthLabel(end))+'</th><th class="num">Var. mês</th></tr></thead>';
  var tb = el('tbody');
  function covOf(fim, c){ return c>0 ? (fim/(c/12)).toLocaleString('pt-BR',{maximumFractionDigits:1}) : '—'; }
  rows.slice().sort(function(a,b){ return b.estMedio-a.estMedio; }).forEach(function(r){
    var tr = el('tr');
    tr.innerHTML = '<td>'+esc(r.filial)+'</td><td class="num">'+fmtBRL(r.estMedio)+'</td><td class="num">'+fmtBRL(r.cmv)+'</td>'+
      '<td class="num"><span class="chip '+(r.giro==null?'muted':(r.giro>=1?'good':(r.giro>=0.3?'warn':'bad')))+'">'+giroFmt(r.giro)+'</span></td>'+
      '<td class="num">'+covOf(r.fim, r.cmv)+'</td><td class="num">'+fmtBRL(r.fim)+'</td><td class="num">'+(r.delta==null?'—':(r.delta>=0?'+':'')+fmtPct(r.delta,1))+'</td>';
    tb.appendChild(tr);
  });
  var trT = el('tr','heatmap-total-row');
  trT.innerHTML = '<td>Total</td><td class="num">'+fmtBRL(tot.estMedio)+'</td><td class="num">'+fmtBRL(tot.cmv)+'</td><td class="num">'+giroFmt(tot.giro)+'</td><td class="num">'+covOf(totFim, tot.cmv)+'</td><td class="num">'+fmtBRL(totFim)+'</td><td class="num">'+(totAnt?((totFim>=totAnt?'+':'')+fmtPct((totFim-totAnt)/totAnt,1)):'—')+'</td>';
  tb.appendChild(trT);
  tbl.appendChild(tb); scroll.appendChild(tbl); c6.body.appendChild(scroll);
  var g4 = el('div','chart-grid'); g4.appendChild(c6.card); panel.appendChild(g4);
