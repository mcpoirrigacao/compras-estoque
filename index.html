/* ===== GIRO =====
   Fontes: CMV = Base_Fat. (soma da coluna CMV, devoluções já negativas); Estoque = Estoque Histórico.xlsx (saldo mensal armazém 01).
   Janela = 12 meses terminando no mês mais recente das combinações Ano/Mês selecionadas.
   Estoque médio = média dos saldos mensais da janela (mês sem saldo na filial = 0).
   CMV 12m = soma do CMV da janela. Giro = CMV 12m / Estoque médio. */
function addMonths(mk, n){
  var y=+mk.slice(0,4), m=+mk.slice(5,7)+n;
  while(m<=0){ m+=12; y--; } while(m>12){ m-=12; y++; }
  return y+'-'+String(m).padStart(2,'0');
}
function giroWindowEnding(end){
  var base = {}; DATA.giro.months.forEach(function(m){ base[m]=1; });
  var list = [];
  for (var i=11;i>=0;i--){ var k=addMonths(end,-i); if (base[k]) list.push(k); }
  return list;
}
function giroWindow(){
  var cand = DATA.giro.months.filter(function(m){ return fHas('giro','ano',m.slice(0,4)) && fHas('giro','mes',m.slice(5,7)); });
  if (!cand.length) return {end:null, months:[]};
  var end = cand[cand.length-1];
  return {end:end, months:giroWindowEnding(end)};
}
function giroCalc(fils, months){
  var est = DATA.giro.estoque, cmv = DATA.giro.cmv;
  var n = months.length || 1, sumE=0, sumC=0;
  fils.forEach(function(f){
    months.forEach(function(m){ sumE += ((est[f]||{})[m])||0; sumC += ((cmv[f]||{})[m])||0; });
  });
  var med = sumE/n;
  return {estMedio:med, cmv:sumC, giro: med ? sumC/med : null};
}
function giroFmt(v){ return v==null ? '—' : v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'x'; }

function buildGiro(){
  var sel = fSelOrAll('giro','filial');
  var allFil = fIsAll('giro','filial');
  var w = giroWindow();
  var panel = el('div','tab-panel','');
  if (!w.end){ var cE = chartCard('Giro', 3); emptyNote(cE.body, 'Sem estoque para o Ano/Mês selecionados.'); panel.appendChild(cE.card); return panel; }
  var months = w.months, end = w.end, prev = addMonths(end,-1);
  var est = DATA.giro.estoque, cmv = DATA.giro.cmv;

  var rows = sel.map(function(f){
    var c = giroCalc([f], months);
    var fim = ((est[f]||{})[end])||0, ant = ((est[f]||{})[prev]);
    return {filial:f, estMedio:c.estMedio, cmv:c.cmv, giro:c.giro, fim:fim, delta: ant ? (fim-ant)/ant : null};
  }).filter(function(r){ return r.estMedio || r.cmv || r.fim; });
  var tot = giroCalc(sel, months);
  var totFim = 0, totAnt = 0;
  sel.forEach(function(f){ totFim += ((est[f]||{})[end])||0; totAnt += ((est[f]||{})[prev])||0; });
  var criticos = rows.filter(function(r){ return r.estMedio>0 && r.giro!=null && r.giro < 0.3; }).length;
  var coberturaMeses = tot.cmv>0 ? totFim/(tot.cmv/12) : null;

  var kpiRow = el('div','kpi-row');
  kpiRow.style.gridTemplateColumns = 'repeat(auto-fit, minmax(170px,1fr))';
  kpiRow.appendChild(kpiTile('Giro', giroFmt(tot.giro), 'CMV 12m / estoque médio'));
  kpiRow.appendChild(kpiTile('Estoque médio', fmtBRL(tot.estMedio,true), 'média de '+months.length+' meses'));
  kpiRow.appendChild(kpiTile('CMV 12 meses', fmtBRL(tot.cmv,true), monthLabel(months[0])+' a '+monthLabel(end)));
  kpiRow.appendChild(kpiTile('Estoque em '+monthLabel(end), fmtBRL(totFim,true), totAnt ? ((totFim>=totAnt?'+':'')+fmtPct((totFim-totAnt)/totAnt,1)+' vs. mês anterior') : ''));
  kpiRow.appendChild(kpiTile('Cobertura', coberturaMeses==null?'—':coberturaMeses.toLocaleString('pt-BR',{maximumFractionDigits:1})+' meses', 'estoque final / CMV médio mensal'));
  kpiRow.appendChild(kpiTile('Filiais em giro crítico', String(criticos), 'giro < 0,30x', criticos>0?'warn':'good'));
  panel.appendChild(kpiRow);

  var grid1 = el('div','chart-grid');
  var c1 = chartCard('Ranking de giro por filial', 2, 'CMV 12m / Estoque médio');
  var ranked = rows.filter(function(r){ return r.estMedio>0; }).sort(function(a,b){ return (b.giro||0)-(a.giro||0); });
  rankList(c1.body, ranked.map(function(r){ return {label:r.filial, value:r.giro||0, color:giroColor(r.giro)}; }), {showPct:false, valueFmt:giroFmt});
  grid1.appendChild(c1.card);
  var c2 = chartCard('Variação do estoque em '+monthLabel(end), 1, 'vs. '+monthLabel(prev));
  var rows2 = rows.filter(function(r){ return r.delta!=null && r.estMedio >= 30000; }).sort(function(a,b){ return Math.abs(b.delta)-Math.abs(a.delta); }).slice(0,9);
  rankList(c2.body, rows2.map(function(r){ return {label:r.filial, value:r.delta, color: r.delta>=0?'var(--status-good)':'var(--status-critical)'}; }), {showPct:false, valueFmt:function(v){return (v>=0?'+':'')+fmtPct(v,1);}});
  grid1.appendChild(c2.card);
  panel.appendChild(grid1);

  var scope = allFil ? 'rede' : (sel.length===1 ? sel[0] : sel.length+' filiais');
  var grid2 = el('div','chart-grid');
  var c3 = chartCard('Giro móvel 12 meses · '+scope, 3, 'cada ponto = CMV dos 12 meses até o mês / estoque médio do mesmo período');
  var gPts = months.map(function(m){ var g = giroCalc(sel, giroWindowEnding(m)); return {label:monthLabel(m), value:g.giro||0}; });
  lineChart(c3.body, gPts, {width:fullCardSvgWidth(), height:240, color:'var(--status-good)', tipLabel:'Giro', showValueLabels:true, labelStep:1,
    axisFmt:function(v){ return v.toLocaleString('pt-BR',{maximumFractionDigits:2})+'x'; }, valueFmt:giroFmt});
  grid2.appendChild(c3.card);
  panel.appendChild(grid2);

  var grid3 = el('div','chart-grid');
  var c4 = chartCard('Estoque mensal · '+scope, 3, 'Estoque Histórico');
  var ePts = months.map(function(m){ var v=0; sel.forEach(function(f){ v += ((est[f]||{})[m])||0; }); return {label:monthLabel(m), value:v}; });
  lineChart(c4.body, ePts, {width:fullCardSvgWidth(), height:280, color:'var(--cat-6)', tipLabel:'Estoque', showValueLabels:true, labelStep:1,
    valueFmt:function(v){ return fmtBRL(v,true); }});
  grid3.appendChild(c4.card);
  panel.appendChild(grid3);

  var c6 = chartCard('Memória de cálculo por filial', 3, monthLabel(months[0])+' a '+monthLabel(end));
  var scroll = el('div','chart-scroll');
  var tbl = el('table','data-table heatmap-table');
  tbl.innerHTML = '<thead><tr><th>Filial</th><th class="num">Estoque médio</th><th class="num">CMV 12m</th><th class="num">Giro</th><th class="num">Cobertura (meses)</th><th class="num">Estoque '+esc(monthLabel(end))+'</th><th class="num">Var. mês</th></tr></thead>';
  var tb = el('tbody');
  function covOf(fim, c){ return c>0 ? (fim/(c/12)).toLocaleString('pt-BR',{maximumFractionDigits:1}) : '—'; }
  rows.slice().sort(function(a,b){ return b.estMedio-a.estMedio; }).forEach(function(r){
    var tr = el('tr');
    tr.innerHTML = '<td>'+esc(r.filial)+'</td><td class="num">'+fmtBRL(r.estMedio)+'</td><td class="num">'+fmtBRL(r.cmv)+'</td>'+
      '<td class="num"><span class="chip '+(r.giro==null?'muted':(r.giro>=1?'good':(r.giro>=0.3?'warn':'bad')))+'">'+giroFmt(r.giro)+'</span></td>'+
      '<td class="num">'+covOf(r.fim, r.cmv)+'</td><td class="num">'+fmtBRL(r.fim)+'</td><td class="num">'+(r.delta==null?'—':(r.delta>=0?'+':'')+fmtPct(r.delta,1))+'</td>';
    tb.appendChild(tr);
  });
  var trT = el('tr','heatmap-total-row');
  trT.innerHTML = '<td>Total</td><td class="num">'+fmtBRL(tot.estMedio)+'</td><td class="num">'+fmtBRL(tot.cmv)+'</td><td class="num">'+giroFmt(tot.giro)+'</td><td class="num">'+covOf(totFim, tot.cmv)+'</td><td class="num">'+fmtBRL(totFim)+'</td><td class="num">'+(totAnt?((totFim>=totAnt?'+':'')+fmtPct((totFim-totAnt)/totAnt,1)):'—')+'</td>';
  tb.appendChild(trT);
  tbl.appendChild(tb); scroll.appendChild(tbl); c6.body.appendChild(scroll);
  var g4 = el('div','chart-grid'); g4.appendChild(c6.card); panel.appendChild(g4);
  return panel;
}

/* ===== SORTIMENTO =====
   Itens = Filial × Part Number vendidos nos últimos 12 meses da Base_Fat. (mesma relação da Curva ABC: POP = NFs venda − NFs devolução; POP ≤ 0 ou Qtd ≤ 0 ficam fora).
   Saldo = Inventário_de_Peças.xlsx, armazém 01 da filial. Saldo > 0 → item sortido (100%); zero/ausente → 0%.
   Nível de sortimento = itens com saldo / itens vendidos. <80% atenção · 80–90% bom · >90% ótimo. POP 3+ = reposição recomendada. */
function sortColor(p){
  if (p==null) return 'var(--text-muted)';
  if (p > 0.9) return 'var(--status-good)';
  if (p >= 0.8) return 'var(--status-warning)';
  return 'var(--status-critical)';
}
function sortChipCls(p){ return p==null ? 'muted' : (p > 0.9 ? 'good' : (p >= 0.8 ? 'warn' : 'bad')); }
function popKey(p){ return p>=6 ? '6+' : String(p); }

var sortGapLimit = 100;
function buildSortimento(){
  var sel = fSelOrAll('sort','filial');
  var allFil = fIsAll('sort','filial');
  var popSel = fSelOrAll('sort','pop');
  var inv = (DATA.abc && DATA.abc.inv) || {stock:{}};
  var rows = abcRows().filter(function(r){ return sel.indexOf(r.filial)>=0 && popSel.indexOf(popKey(r.pop))>=0; });
  rows.forEach(function(r){ var st = inv.stock[r.filial+'|'+r.item]; r.saldo = st ? st[0] : 0; r.ok = r.saldo > 0; });
  /* saldo do item nas outras filiais (armazém 01) — indica possibilidade de transferência */
  var redeStock = {};
  Object.keys(inv.stock).forEach(function(k){ var i = k.indexOf('|'); var it = k.slice(i+1), fil = k.slice(0,i); var q = inv.stock[k][0]||0; if (q>0){ (redeStock[it] = redeStock[it] || []).push({fil:fil, q:q}); } });
  rows.forEach(function(r){
    var lst = (redeStock[r.item]||[]).filter(function(x){ return x.fil!==r.filial; });
    r.saldoRede = lst.reduce(function(t,x){ return t+x.q; }, 0);
    r.saldoRedeTip = lst.map(function(x){ return x.fil+': '+fmtNum(x.q); }).join(' · ');
  });

  var keys = POP_FAIXAS.map(function(f){ return f.value; }).filter(function(k){ return popSel.indexOf(k)>=0; });
  function agg(list){
    var o = {n:0, s:0, byPop:{}};
    keys.forEach(function(k){ o.byPop[k] = {n:0, s:0}; });
    o.p3 = {n:0, s:0};
    list.forEach(function(r){
      var k = popKey(r.pop); o.n++; if (r.ok) o.s++;
      if (o.byPop[k]){ o.byPop[k].n++; if (r.ok) o.byPop[k].s++; }
      if (r.pop>=3){ o.p3.n++; if (r.ok) o.p3.s++; }
    });
    o.pct = o.n ? o.s/o.n : null; o.p3.pct = o.p3.n ? o.p3.s/o.p3.n : null;
    keys.forEach(function(k){ var b=o.byPop[k]; b.pct = b.n ? b.s/b.n : null; });
    return o;
  }
  var tot = agg(rows);
  var filiais = uniq(rows.map(function(r){ return r.filial; }));
  var byFil = filiais.map(function(f){ var a = agg(rows.filter(function(r){ return r.filial===f; })); a.filial=f; return a; })
    .sort(function(a,b){ return b.n-a.n; });

  var panel = el('div','tab-panel','');
  if (!rows.length){ var cE = chartCard('Sortimento', 3); emptyNote(cE.body); panel.appendChild(cE.card); return panel; }

  var gaps = rows.filter(function(r){ return !r.ok; });
  var gaps3 = gaps.filter(function(r){ return r.pop>=3; });
  var kpiRow = el('div','kpi-row');
  kpiRow.style.gridTemplateColumns = 'repeat(auto-fit, minmax(170px,1fr))';
  function lvl(p){ return p==null?'':(p>0.9?'ótimo':(p>=0.8?'bom':'atenção')); }
  kpiRow.appendChild(kpiTile('Nível de sortimento', tot.pct==null?'—':fmtPct(tot.pct,1), fmtNum(tot.s)+' de '+fmtNum(tot.n)+' itens · '+lvl(tot.pct), tot.pct==null?'':(tot.pct>0.9?'good':(tot.pct>=0.8?'':'warn'))));
  kpiRow.appendChild(kpiTile('Sortimento POP 3+', tot.p3.pct==null?'—':fmtPct(tot.p3.pct,1), fmtNum(tot.p3.s)+' de '+fmtNum(tot.p3.n)+' · reposição recomendada', tot.p3.pct==null?'':(tot.p3.pct>0.9?'good':(tot.p3.pct>=0.8?'':'warn'))));
  kpiRow.appendChild(kpiTile('Itens vendidos', fmtNum(tot.n), 'filial × part number · 12 meses'));
  kpiRow.appendChild(kpiTile('Com saldo', fmtNum(tot.s), 'saldo > 0 no armazém 01'));
  kpiRow.appendChild(kpiTile('Sem saldo', fmtNum(tot.n-tot.s), 'vendidos e zerados'));
  kpiRow.appendChild(kpiTile('Sem saldo POP 3+', fmtNum(gaps3.length), 'prioridade de reposição', gaps3.length>0?'warn':'good'));
  panel.appendChild(kpiRow);

  /* matriz filial × POP */
  var c1 = chartCard('Nível de sortimento por POP', 3, 'itens com saldo / itens vendidos · por filial e empresa');
  var scroll = el('div','chart-scroll'); scroll.style.maxHeight = 'none';
  var tbl = el('table','data-table heatmap-table');
  var h = '<thead><tr><th>Filial</th>';
  keys.forEach(function(k){ h += '<th class="num">'+(k==='6+'?'POP 6+':'POP '+k)+'</th>'; });
  h += '<th class="num">POP 3+</th><th class="num">Total</th><th class="num">Itens</th></tr></thead>';
  tbl.innerHTML = h;
  var tb = el('tbody');
  function cell(b){
    if (!b || !b.n) return '<td class="num" style="color:var(--text-muted)">—</td>';
    return '<td class="num" title="'+b.s+' de '+b.n+' itens com saldo"><span class="chip '+sortChipCls(b.pct)+'">'+fmtPct(b.pct,0)+'</span> <span style="color:var(--text-muted);font-size:11px">'+b.s+'/'+b.n+'</span></td>';
  }
  function rowHtml(name, a){
    var x = '<td>'+esc(name)+'</td>';
    keys.forEach(function(k){ x += cell(a.byPop[k]); });
    x += cell(a.p3) + cell({n:a.n, s:a.s, pct:a.pct}) + '<td class="num">'+fmtNum(a.n)+'</td>';
    return x;
  }
  byFil.forEach(function(a){ var tr = el('tr'); tr.innerHTML = rowHtml(a.filial, a); tb.appendChild(tr); });
  var trT = el('tr','heatmap-total-row'); trT.innerHTML = rowHtml(allFil ? 'Empresa' : 'Total selecionado', tot); tb.appendChild(trT);
  tbl.appendChild(tb); scroll.appendChild(tbl); c1.body.appendChild(scroll);
  var leg = el('div','legend-row legend-row-below');
  leg.innerHTML = '<span class="legend-item"><span class="legend-swatch" style="background:var(--status-critical)"></span>&lt; 80% atenção</span>'+
    '<span class="legend-item"><span class="legend-swatch" style="background:var(--status-warning)"></span>80% a 90% bom</span>'+
    '<span class="legend-item"><span class="legend-swatch" style="background:var(--status-good)"></span>&gt; 90% ótimo</span>'+
    '<span class="legend-item">POP 3+ = reposição recomendada</span>';
  c1.body.appendChild(leg);
  var g1 = el('div','chart-grid'); g1.appendChild(c1.card); panel.appendChild(g1);

  /* empresa por POP + ranking filiais */
  var g2 = el('div','chart-grid');
  var c2 = chartCard('Sortimento por POP · '+(allFil?'empresa':(sel.length===1?sel[0]:sel.length+' filiais')), 1);
  coverageBars(c2.body, keys.filter(function(k){ return tot.byPop[k].n; }).map(function(k){
    var b = tot.byPop[k]; return {label:(k==='6+'?'POP 6 ou mais':'POP '+k), covered:b.s, total:b.n, pct:b.pct, color:sortColor(b.pct)};
  }));
  g2.appendChild(c2.card);
  var c3 = chartCard('Nível de sortimento por filial', 1, 'todas as faixas selecionadas');
  rankList(c3.body, byFil.slice().sort(function(a,b){ return (b.pct||0)-(a.pct||0); }).map(function(a){ return {label:a.filial, value:a.pct||0, color:sortColor(a.pct)}; }), {showPct:false, valueFmt:function(v){ return fmtPct(v,1); }});
  g2.appendChild(c3.card);
  var c4 = chartCard('Sortimento POP 3+ por filial', 1, 'itens com reposição recomendada');
  rankList(c4.body, byFil.filter(function(a){ return a.p3.n; }).sort(function(a,b){ return (b.p3.pct||0)-(a.p3.pct||0); }).map(function(a){ return {label:a.filial+' ('+a.p3.s+'/'+a.p3.n+')', value:a.p3.pct||0, color:sortColor(a.p3.pct)}; }), {showPct:false, valueFmt:function(v){ return fmtPct(v,1); }});
  g2.appendChild(c4.card);
  panel.appendChild(g2);

  /* lista de itens sem saldo */
  var c5 = chartCard('Itens vendidos sem saldo', 3, '');
  var titleN = c5.card.querySelector('.chart-title .n') || (function(){ var t=c5.card.querySelector('.chart-title'); var sp=el('span','n',''); t.appendChild(document.createTextNode(' ')); t.appendChild(sp); return sp; })();
  var tools = el('div','abc-tools');
  var search = el('input','abc-search'); search.type='search'; search.placeholder='Buscar item ou descrição...';
  var onlyP3 = el('label','abc-cob','<input type="checkbox" checked style="width:auto"> Só POP 3+ (reposição recomendada)');
  var expS = el('button','btn btn-sm abc-export','Exportar Excel'); expS.type='button';
  expS.title = 'Exporta todos os itens da lista (com a busca e o "Só POP 3+" atuais) + o nível de sortimento por filial e POP';
  tools.appendChild(search); tools.appendChild(onlyP3); tools.appendChild(expS);

/* ================= ZERO VENDAS (refeita em 06/10/2026) =================
   Base: Inventário_de_Peças.xlsx, armazém 01 (Peças varejo), por filial × item (IRRIGAFAZ fora — sem data de entrada).
   Sem venda = nenhuma venda líquida (vendida − devolvida > 0) do item NA FILIAL nos últimos 12 meses da Base_Fat. (DATA.zv.ini a DATA.zv.fim).
   Data da última entrada = coluna J (Dt.Ult.Entr.). Corte = 1º dia da janela de 12 meses (DATA.zv.corte).
   Zero venda = sem venda 12m e última entrada ANTES do corte (no estoque há mais de 12 meses).
   Novo inventário sem venda = sem venda 12m e última entrada a partir do corte (no estoque há menos de 12 meses).
   Linhas DATA.zv.rows: [filial, item, desc, saldo qtd, valor, custo unit., dt últ. entrada, última venda na filial (base desde DATA.zv.baseIni), qtd vendida 12m outras filiais, detalhe outras filiais] */
var ZV_COLS = {filial:0, item:1, desc:2, qtd:3, valor:4, custo:5, entr:6, ult:7, outQ:8, outTip:9};
var zvTableState = { sit:'all', search:'', onlyTransf:false, limit:100 };
function zvIso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function zvAddMonths(iso, n){ var d = new Date(iso+'T00:00:00'); d.setMonth(d.getMonth()+n); return zvIso(d); }
function zvAddDays(iso, n){ var d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return zvIso(d); }
function zvMonthsBetween(a, b){ /* meses completos de a até b (ISO) */
  var A = new Date(a+'T00:00:00'), B = new Date(b+'T00:00:00');
  var m = (B.getFullYear()-A.getFullYear())*12 + (B.getMonth()-A.getMonth());
  if (B.getDate() < A.getDate()) m--;
  return Math.max(0, m);
}
function zvRows(){
  var z = DATA.zv || {rows:[]};
  var ref = z.ref;
  return (z.rows||[]).map(function(r){
    var o = {filial:r[0], item:r[1], desc:r[2], qtd:r[3], valor:r[4], custo:r[5], entr:r[6], ult:r[7], outQ:r[8]||0, outTip:r[9]||''};
    o.sit = (o.entr && o.entr < z.corte) ? 'zv' : 'novo';
    o.meses = o.entr ? zvMonthsBetween(o.entr, ref) : null;
    return o;
  });
}
var ZV_SIT = { zv:{label:'Zero venda', cls:'bad', color:'var(--status-critical)'}, novo:{label:'Novo sem venda', cls:'warn', color:'var(--status-warning)'} };

function exportSortExcel(list, ctx, btn){
  if (typeof XLSX === 'undefined'){ showToast('Não foi possível carregar o gerador de Excel (sem conexão com a internet?).', true); return; }
  var a = DATA.abc || {};
  function lvl(p){ return p==null?'':(p>0.9?'ótimo':(p>=0.8?'bom':'atenção')); }
  function pctV(p){ return p==null ? null : Math.round(p*10000)/10000; }
  /* aba 1: itens vendidos sem saldo (linhas filtradas, ordem da tela) */
  var head = ['Filial','Item','Descrição','POP','Meses c/ venda','Qtd. Vds','Saldo (arm. 01 filial)','Saldo outras filiais','Detalhe outras filiais','Faturamento','Última venda'];
  var aoa = [head];
  list.forEach(function(r){
    aoa.push([r.filial, r.item, r.desc, r.pop, r.meses, r.qtd, r.saldo, r.saldoRede, r.saldoRedeTip || '', Math.round(r.valor*100)/100, r.ult ? r.ult.split('-').reverse().join('/') : '']);
  });
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  var fmts = {5:'#,##0.##', 6:'#,##0.##', 7:'#,##0.##', 9:'#,##0.00'};
  for (var R=1; R<aoa.length; R++){
    Object.keys(fmts).forEach(function(c){ var ref = XLSX.utils.encode_cell({r:R, c:+c}); if (ws[ref] && typeof ws[ref].v==='number') ws[ref].z = fmts[c]; });
  }
  ws['!cols'] = [12,16,48,6,10,10,12,12,40,14,12].map(function(w){ return {wch:w}; });
  ws['!autofilter'] = {ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:Math.max(aoa.length-1,1), c:head.length-1}})};
  /* aba 2: nível de sortimento por filial × POP */
  var keys = ctx.keys;
  var h2 = ['Filial'];
  keys.forEach(function(k){ var n = (k==='6+'?'POP 6+':'POP '+k); h2.push(n+' %', n+' com saldo', n+' vendidos'); });
  h2.push('POP 3+ %','POP 3+ com saldo','POP 3+ vendidos','Total %','Com saldo','Itens vendidos','Sem saldo','Situação');
  var aoa2 = [h2];
  function line(name, o){
    var x = [name];
    keys.forEach(function(k){ var b = o.byPop[k] || {n:0,s:0,pct:null}; x.push(pctV(b.pct), b.s, b.n); });
    x.push(pctV(o.p3.pct), o.p3.s, o.p3.n, pctV(o.pct), o.s, o.n, o.n-o.s, lvl(o.pct));
    return x;
  }
  ctx.byFil.forEach(function(o){ aoa2.push(line(o.filial, o)); });
  aoa2.push(line(ctx.allFil ? 'Empresa' : 'Total selecionado', ctx.tot));
  var ws2 = XLSX.utils.aoa_to_sheet(aoa2);
  for (var R2=1; R2<aoa2.length; R2++){
    for (var C=1; C<h2.length; C++){
      var ref = XLSX.utils.encode_cell({r:R2, c:C});
      if (ws2[ref] && typeof ws2[ref].v==='number') ws2[ref].z = /%$/.test(h2[C]) ? '0.0%' : '#,##0';
    }
  }
  ws2['!cols'] = h2.map(function(t,i){ return {wch: i===0 ? 18 : Math.max(10, t.length+1)}; });
  /* aba 3: parâmetros */
  var inv = a.inv || {};
  var info = [
    ['Painel de Métricas · Sortimento'],
    ['Período de vendas', (a.ini?monthLabel(a.ini):'')+' a '+(a.fim?monthLabel(a.fim):'')+' (Base_Fat.)'],
    ['Saldo', (inv.data||'Inventário_de_Peças.xlsx')+' · armazém 01 Peças varejo da filial'],
    ['Filiais', ctx.sel.join(', ')],
    ['POP', keys.map(function(k){ return k==='6+'?'6+':k; }).join(', ')],
    ['Lista de itens', (ctx.p3 ? 'só POP 3+' : 'todos os POP')+(ctx.q ? ' · busca: "'+ctx.q+'"' : '')],
    ['Linhas exportadas (itens sem saldo)', list.length],
    ['Gerado em', fmtDateTime(todayStr())],
    [],
    ['Regras'],
    ['Itens vendidos', 'Filial × Part Number com venda líquida nos últimos 12 meses (mesma relação da Curva ABC; POP ≤ 0 ou Qtd ≤ 0 ficam fora)'],
    ['POP', 'NFs de venda distintas − NFs de devolução distintas'],
    ['Sortido', 'saldo > 0 no armazém 01 da filial'],
    ['Nível de sortimento', 'itens com saldo ÷ itens vendidos'],
    ['Faixas', '< 80% atenção · 80% a 90% bom · > 90% ótimo'],
    ['Saldo outras filiais', 'saldo do mesmo item no armazém 01 das demais filiais (indica transferência)']
  ];
  var ws3 = XLSX.utils.aoa_to_sheet(info);
  ws3['!cols'] = [{wch:34},{wch:100}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Itens sem saldo');
  XLSX.utils.book_append_sheet(wb, ws2, 'Nível por filial');
  XLSX.utils.book_append_sheet(wb, ws3, 'Parâmetros');

/* ================= CURVA ABC =================
   Base: Base_Fat. (últimos 12 meses fechados na base).
   Linha = Filial × Item. POP = NFs de venda distintas (Tipo N) − NFs de devolução distintas (Tipo D); itens com POP ≤ 0 ou Qtd. Vds ≤ 0 não são listados.
   Qtd. Vds = qtde vendida − qtde devolvida (Tipo D). Valor e LB líquidos de devolução. */
var ABC_COLS = {filial:0, item:1, desc:2, pop:3, qtd:4, valor:5, lb:6, ult:7, cli:8, dev:9};
var ABC_CRIT = { q:{label:'Quantidade', art:'da quantidade', field:'qtd'}, v:{label:'Valor', art:'do valor', field:'valor'}, l:{label:'Lucro bruto', art:'do lucro bruto', field:'lb'} };
var ABC_COLORS = { A:'var(--status-good)', B:'var(--status-warning)', C:'var(--status-critical)' };
var POP_FAIXAS = [
  {value:'1', label:'POP 1', test:function(p){ return p===1; }},
  {value:'2', label:'POP 2', test:function(p){ return p===2; }},
  {value:'3', label:'POP 3', test:function(p){ return p===3; }},
  {value:'4', label:'POP 4', test:function(p){ return p===4; }},
  {value:'5', label:'POP 5', test:function(p){ return p===5; }},
  {value:'6+', label:'POP 6 ou mais', test:function(p){ return p>=6; }}
];

function abcRows(){
  return ((DATA.abc && DATA.abc.rows) || []).map(function(r){
    return {filial:r[0], item:r[1], desc:r[2], pop:r[3], qtd:r[4], valor:r[5], lb:r[6], ult:r[7], cli:r[8], dev:r[9]||0, meses:r[10]||0, cmv:r[11]||0};
  });
}
/* ---------- Sugestão de compra ----------
   Saldo: Inventário_de_Peças.xlsx, armazém 01 (Peças varejo) da filial. Item ausente no inventário = saldo 0.
   Custo médio: custo do item na filial; sem saldo na filial → custo médio do item na rede; sem estoque na rede → CMV unitário das vendas.
   Demanda mensal = Qtd. Vds 12m ÷ 12.
   Item recorrente = vendeu em 2+ meses diferentes. Item com venda em 1 mês só = "Sob encomenda" (não sugere compra).
   Estoque alvo = demanda mensal × cobertura (meses, ajustável).  Sugestão = arredonda para cima (alvo − saldo), mínimo 0. */
var abcCobertura = 2;
function abcApplyPurchase(rows){
  var inv = (DATA.abc && DATA.abc.inv) || {stock:{}, netcost:{}};
  rows.forEach(function(r){
    var st = inv.stock[r.filial+'|'+r.item];
    r.saldo = st ? st[0] : 0;
    if (st && st[1] > 0){ r.custo = st[1]; r.custoFonte = 'Custo médio da filial'; }
    else if (inv.netcost[r.item] > 0){ r.custo = inv.netcost[r.item]; r.custoFonte = 'Custo médio da rede (sem saldo na filial)'; }
    else if (r.qtd > 0 && r.cmv > 0){ r.custo = r.cmv / r.qtd; r.custoFonte = 'CMV unitário das vendas (sem estoque na rede)'; }
    else { r.custo = 0; r.custoFonte = 'Sem custo'; }
    r.dm = r.qtd / 12;
    r.cobAtual = r.dm > 0 ? r.saldo / r.dm : null;
    var recorrente = r.meses >= 2;
    if (!recorrente){
      r.sug = 0; r.status = 'Sob encomenda';
    } else {
      var alvo = r.dm * abcCobertura;
      r.sug = Math.max(0, Math.ceil(alvo - r.saldo - 1e-9));
      if (r.saldo <= 0) r.status = 'Ruptura';
      else if (r.sug > 0) r.status = 'Comprar';
      else if (r.cobAtual != null && r.cobAtual > abcCobertura * 3) r.status = 'Excesso';
      else r.status = 'OK';
    }
    r.vCompra = r.sug * r.custo;
  });
}
var ABC_STATUS = { 'Ruptura':'bad', 'Comprar':'warn', 'OK':'good', 'Excesso':'info', 'Sob encomenda':'muted' };
function statusChip(s){ return '<span class="chip '+(ABC_STATUS[s]||'muted')+'">'+esc(s)+'</span>'; }
/* classifica A (até 80% acumulado), B (até 95%), C (resto / valores ≤ 0) */
function classifyAbc(rows, field, key){
  var pos = rows.filter(function(r){ return r[field] > 0; }).sort(function(a,b){ return b[field]-a[field]; });
  var total = pos.reduce(function(s,r){ return s+r[field]; },0);
  var cum = 0;
  pos.forEach(function(r){
    var before = total ? cum/total : 1;
    r[key] = before < 0.80 ? 'A' : (before < 0.95 ? 'B' : 'C');
    cum += r[field];
    r[key+'Cum'] = total ? cum/total : 0;
  });
  rows.forEach(function(r){ if (!(r[field] > 0)){ r[key] = 'C'; r[key+'Cum'] = 1; } });
  return {sorted: pos, total: total};
}

function abcChip(c){
  var cls = c==='A' ? 'good' : (c==='B' ? 'warn' : 'bad');
  return '<span class="chip '+cls+'">'+c+'</span>';
}

/* curva de Pareto: % itens (x) × % acumulado do critério (y) */
function paretoChart(body, sorted, field, totalItems){
  if (!sorted.length){ emptyNote(body); return; }
  var W = 760, H = 280, padL = 46, padR = 16, padT = 14, padB = 30;
  var innerW = W-padL-padR, innerH = H-padT-padB;
  var total = sorted.reduce(function(s,r){ return s+r[field]; },0) || 1;
  var n = totalItems || sorted.length;
  function x(f){ return padL + f*innerW; }
  function y(f){ return padT + innerH - f*innerH; }
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('class','viz'); svg.style.height = H+'px';
  function mk(tag, attrs){ var e=document.createElementNS(svgNS,tag); Object.keys(attrs).forEach(function(k){ e.setAttribute(k,attrs[k]); }); svg.appendChild(e); return e; }

  /* faixas A/B/C pelo nº de itens */
  var cntA=0, cntB=0;
  sorted.forEach(function(r){ if (r._cls==='A') cntA++; else if (r._cls==='B') cntB++; });
  var bands = [
    {c:'A', from:0, to:cntA/n},
    {c:'B', from:cntA/n, to:(cntA+cntB)/n},
    {c:'C', from:(cntA+cntB)/n, to:1}
  ];
  bands.forEach(function(b){
    if (b.to<=b.from) return;
    mk('rect',{x:x(b.from), y:padT, width:Math.max(0.5,x(b.to)-x(b.from)), height:innerH, fill:ABC_COLORS[b.c], opacity:'0.09'});
    var t = mk('text',{x:(x(b.from)+x(b.to))/2, y:y(0.06), 'text-anchor':'middle', 'font-size':'12', 'font-weight':'800', fill:ABC_COLORS[b.c]});
    t.textContent = b.c;
  });
  [0,0.25,0.5,0.75,1].forEach(function(g){
    mk('line',{x1:padL, x2:W-padR, y1:y(g), y2:y(g), 'class': g===0?'viz-baseline':'viz-grid-line'});
    var t = mk('text',{x:padL-8, y:y(g)+3.5, 'text-anchor':'end', 'class':'viz-axis-label'}); t.textContent = Math.round(g*100)+'%';
    var tx = mk('text',{x:x(g), y:H-8, 'text-anchor': g===0?'start':(g===1?'end':'middle'), 'class':'viz-axis-label'}); tx.textContent = Math.round(g*100)+'% dos itens';
  });
  [0.8,0.95].forEach(function(g){
    mk('line',{x1:padL, x2:W-padR, y1:y(g), y2:y(g), stroke:'var(--text-muted)', 'stroke-dasharray':'4 4', 'stroke-width':'1'});
  });
  var d = 'M '+x(0)+' '+y(0), cum = 0, pts=[];
  sorted.forEach(function(r,i){ cum += r[field]; var px=x((i+1)/n), py=y(cum/total); d += ' L '+px+' '+py; pts.push({px:px, py:py, r:r, cum:cum/total, i:i}); });
  if (pts.length) d += ' L '+x(1)+' '+pts[pts.length-1].py;
  mk('path',{d:d, fill:'none', stroke:'var(--cat-1)', 'stroke-width':'2.2', 'stroke-linejoin':'round'});
  var dot = mk('circle',{r:'3.5', fill:'var(--cat-1)', opacity:'0'});
  var overlay = mk('rect',{x:padL, y:padT, width:innerW, height:innerH, fill:'transparent'});
  overlay.addEventListener('mousemove', function(evt){
    var rect = svg.getBoundingClientRect();
    var relX = (evt.clientX-rect.left)*(W/rect.width);
    var idx = Math.round(((relX-padL)/innerW)*n)-1;
    idx = Math.max(0, Math.min(pts.length-1, idx));
    var p = pts[idx];
    dot.setAttribute('cx',p.px); dot.setAttribute('cy',p.py); dot.setAttribute('opacity','1');
    showTooltip(evt.clientX, evt.clientY,
      '<div class="viz-tooltip-title">'+(p.i+1)+'º · '+esc(p.r.desc)+'</div>'+
      '<div class="viz-tooltip-row"><span>Filial</span><span class="viz-tooltip-val">'+esc(p.r.filial)+'</span></div>'+
      '<div class="viz-tooltip-row"><span>Classe</span><span class="viz-tooltip-val">'+p.r._cls+'</span></div>'+
      '<div class="viz-tooltip-row"><span>% acumulado</span><span class="viz-tooltip-val">'+fmtPct(p.cum,1)+'</span></div>'+
      '<div class="viz-tooltip-row"><span>% dos itens</span><span class="viz-tooltip-val">'+fmtPct((p.i+1)/n,1)+'</span></div>');
  });
  overlay.addEventListener('mouseleave', function(){ dot.setAttribute('opacity','0'); hideTooltip(); });
  body.appendChild(svg);
}

        renderTable();
      });

  var currentList = [];

  search.addEventListener('input', function(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){ abcTableState.search = search.value; abcTableState.limit = 50; renderTable(); }, 150);
  });

/* exporta a tabela de itens (linhas filtradas, na ordem atual) para .xlsx */

  var aoa = [head];
  list.forEach(function(r){
    aoa.push([r.filial, r.item, r.desc, r.abcQ, r.abcV, r.abcL, r.pop, r.meses, r.qtd, r.saldo, r.custo ? Math.round(r.custo*100)/100 : null,
      r.cobAtual==null ? null : Math.round(r.cobAtual*10)/10, r.sug, Math.round(r.vCompra*100)/100, r.status,
      Math.round(r.valor*100)/100, Math.round(r.lb*100)/100, Math.round(r.pctlb*10000)/10000, fmtDateBR(r.ult)]);
  });
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  var fmts = {10:'#,##0.00', 13:'#,##0.00', 15:'#,##0.00', 16:'#,##0.00', 17:'0.0%', 11:'0.0', 8:'#,##0.##', 9:'#,##0.##'};
  for (var R=1; R<aoa.length; R++){
    Object.keys(fmts).forEach(function(c){ var ref = XLSX.utils.encode_cell({r:R, c:+c}); if (ws[ref] && typeof ws[ref].v==='number') ws[ref].z = fmts[c]; });
  }
  ws['!cols'] = [12,16,48,8,9,9,6,9,10,10,12,11,11,13,14,14,14,8,12].map(function(w){ return {wch:w}; });
  ws['!autofilter'] = {ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:aoa.length-1, c:head.length-1}})};
  var info = [
    ['Painel de Métricas · Curva ABC'],
    ['Período de vendas', (DATA.abc && DATA.abc.ini ? monthLabel(DATA.abc.ini)+' a '+monthLabel(DATA.abc.fim) : '')],
    ['Filiais', selFil.join(', ')],
    ['Cobertura alvo (meses)', abcCobertura],
    ['Linhas exportadas', list.length],
    ['Gerado em', fmtDateTime(todayStr())],
    [],
    ['Regras'],
    ['POP', 'NFs de venda distintas menos NFs de devolução no período'],
    ['Saldo atual', 'Inventário_de_Peças.xlsx, armazém 01 (Peças varejo) da filial'],
    ['Sugestão compra', 'arredonda p/ cima (Qtd. Vds ÷ 12 × cobertura alvo − saldo); itens vendidos em 1 mês só = Sob encomenda']
  ];
  var ws2 = XLSX.utils.aoa_to_sheet(info);
  ws2['!cols'] = [{wch:24},{wch:90}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Itens');
  XLSX.utils.book_append_sheet(wb, ws2, 'Parâmetros');
  var filename = 'Curva_ABC_' + (selFil.length===1 ? selFil[0].replace(/\s+/g,'_') + '_' : '') + todayStr().slice(0,10) + '.xlsx';
  var buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  btn.disabled = true;
  var done = function(){ btn.disabled = false; };
  var useP = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads') : Promise.resolve(null);
  Promise.resolve(useP).then(function(dl){
    if (dl){
      return dl.save({filename: filename, data: new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})})
        .then(function(){ showToast('Excel gerado: '+list.length+' linhas.'); })
        .catch(function(err){ if (err && err.code==='declined') return; showToast('Não foi possível salvar o arquivo ('+((err&&err.code)||'erro')+').', true); });
    }
    XLSX.writeFile(wb, filename);
    showToast('Excel gerado: '+list.length+' linhas.');
  }).catch(function(e){ console.error(e); showToast('Não foi possível gerar o Excel.', true); }).then(done, done);
}

/* recalcula DATA.abc a partir das linhas da Base_Fat. (usado no botão Atualizar dados) */
function computeAbcFromAoa(faoa, headerRowIdx, header){
  var ix = function(n){ return header.indexOf(n); };
  var iLoja=ix('Loja'), iAM=ix('Ano_Mes'), iTipo=ix('Tipo'), iNf=ix('N.Nf'), iSerie=ix('Serie'), iProd=ix('Produto'),
      iDesc=ix('Desc. Produto'), iQ=ix('Qtde.'), iV=ix('Valor'), iLB=ix('LB'), iDt=ix('Datas'), iCli=ix('Cliente'), iCMV=ix('CMV');
  if (iProd<0 || iLoja<0 || iAM<0) return null;
  var maxM = null;
  for (var r=headerRowIdx+1; r<faoa.length; r++){ var row=faoa[r]; if (!row) continue; var mk=excelMonthKey(row[iAM]); if (mk && (!maxM || mk>maxM)) maxM=mk; }
  if (!maxM) return null;
  var win = {}, y=+maxM.slice(0,4), m=+maxM.slice(5,7), list=[];
  for (var i=0;i<12;i++){ var mm=m-i, yy=y; while(mm<=0){ mm+=12; yy--; } var k=yy+'-'+String(mm).padStart(2,'0'); win[k]=1; list.push(k); }
  function num(v){ if (typeof v==='number') return v; var n=parseFloat(String(v==null?'':v).replace(',','.')); return isNaN(n)?0:n; }
  function dstr(v){ if (v instanceof Date && !isNaN(v)) return v.getUTCFullYear()+'-'+String(v.getUTCMonth()+1).padStart(2,'0')+'-'+String(v.getUTCDate()).padStart(2,'0'); return String(v==null?'':v).slice(0,10); }
  var acc = {};
  for (var r2=headerRowIdx+1; r2<faoa.length; r2++){
    var row2 = faoa[r2]; if (!row2) continue;
    var fil = row2[iLoja], mk2 = excelMonthKey(row2[iAM]);
    if (!fil || !mk2 || !win[mk2]) continue;
    var prod = String(row2[iProd]==null?'':row2[iProd]).trim(); if (!prod) continue;
    var key = fil+'\u0001'+prod;
    var a = acc[key] || (acc[key] = {fil:fil, prod:prod, desc:String(row2[iDesc]==null?'':row2[iDesc]).trim(), nf:{}, dv:{}, q:0, v:0, lb:0, c:0, ult:'', cli:{}, m:{}});
    var q = num(row2[iQ]);
    if (row2[iTipo]==='D'){ a.q -= q; a.dv[String(row2[iSerie]==null?'':row2[iSerie]).trim()+'|'+String(row2[iNf]==null?'':row2[iNf]).trim()] = 1; }
    else {
      a.q += q;
      a.nf[String(row2[iSerie]==null?'':row2[iSerie]).trim()+'|'+String(row2[iNf]==null?'':row2[iNf]).trim()] = 1;
      a.cli[String(row2[iCli]==null?'':row2[iCli]).trim()] = 1;
      a.m[mk2] = 1;
      var ds = dstr(row2[iDt]); if (ds > a.ult) a.ult = ds;
    }
    a.v += num(row2[iV]); a.lb += num(row2[iLB]); if (iCMV>=0) a.c += num(row2[iCMV]);
  }
  var rows = [];
  Object.keys(acc).forEach(function(k){
    var a = acc[k], nVend = Object.keys(a.nf).length, nDev = Object.keys(a.dv).length;
    if (!nVend) return;
    var pop = nVend - nDev;
    if (pop <= 0 || a.q <= 0) return;
    rows.push([a.fil, a.prod, a.desc, pop, Math.round(a.q*100)/100, Math.round(a.v*100)/100, Math.round(a.lb*100)/100, a.ult, Object.keys(a.cli).length, nDev, Object.keys(a.m).length, Math.round(a.c*100)/100]);
  });
  rows.sort(function(p,q){ return q[5]-p[5]; });
  list.sort();
  return {ini:list[0], fim:list[list.length-1], rows:rows, inv:(DATA.abc && DATA.abc.inv) || {stock:{}, netcost:{}}};
}

/* Dropdown de múltipla escolha, padrão único do painel:
   "Selecionar todos" no topo + botões Marcar todos / Desmarcar todos.
   cfg: {label, all, plural, options:[{value,label}], get:()=>null|lista, set:(null|lista)=>void, onChange, light} */
function buildMultiDropdown(cfg){
  var opts = cfg.options;
  var allVals = opts.map(function(o){ return o.value; });
  var group = el('div','filter-group'+(cfg.light?' light':''));
  group.appendChild(el('span','filter-label', esc(cfg.label)));
  var ctrl = el('div','filter-control');
  var btn = el('button','filter-btn','<span class="filter-value"></span>'+CHEV);
  btn.type = 'button';
  var valueEl = btn.querySelector('.filter-value');
  var panel = el('div','dropdown-panel hidden');
  var allRow = el('label','dropdown-item dropdown-all','<input type="checkbox"><span class="lbl">Selecionar todos</span>');
  var allCb = allRow.querySelector('input');
  var list = el('div','dropdown-list');
  var foot = el('div','dropdown-foot');
  var markB = el('button','btn btn-ghost btn-sm','Marcar todos'); markB.type='button'; markB.style.cssText = FOOT_BTN_STYLE;
  var clearB = el('button','btn btn-ghost btn-sm','Desmarcar todos'); clearB.type='button'; clearB.style.cssText = FOOT_BTN_STYLE;
  foot.appendChild(markB); foot.appendChild(clearB);
  panel.appendChild(allRow); panel.appendChild(list); panel.appendChild(foot);
  ctrl.appendChild(btn); ctrl.appendChild(panel);
  group.appendChild(ctrl);

  function cur(){ var v = cfg.get(); return v == null ? allVals.slice() : v.slice(); }
  function setSel(arr){
    var isAll = arr.length===allVals.length && allVals.every(function(v){ return arr.indexOf(v)>=0; });
    cfg.set(isAll ? null : arr);
    syncChecks(); refreshLabel(); cfg.onChange();
  }
  function syncChecks(){
    var c = cur();
    list.querySelectorAll('input').forEach(function(cb){ cb.checked = c.indexOf(cb.value)>=0; });
    allCb.checked = c.length===allVals.length;
    allCb.indeterminate = c.length>0 && c.length<allVals.length;
  }
  function refreshLabel(){
    var v = cfg.get(), txt;
    if (v == null) txt = cfg.all;
    else if (!v.length) txt = 'Nenhum';
    else if (v.length===1){ var o = opts.filter(function(x){ return x.value===v[0]; })[0]; txt = o ? o.label : v[0]; }
    else txt = v.length+' '+cfg.plural;
    valueEl.textContent = txt;
    valueEl.classList.toggle('is-placeholder', v == null);
    group.classList.toggle('has-value', v != null);
  }

  opts.forEach(function(o){
    var item = el('label','dropdown-item');
    item.innerHTML = '<input type="checkbox"><span class="lbl">'+esc(o.label)+'</span>';
    var cb = item.querySelector('input');
    cb.value = o.value;
    cb.addEventListener('change', function(){
      var c = cur(), idx = c.indexOf(o.value);
      if (cb.checked && idx<0) c.push(o.value);
      if (!cb.checked && idx>=0) c.splice(idx,1);
      c.sort(function(a,b){ return allVals.indexOf(a)-allVals.indexOf(b); });
      setSel(c);
    });
    list.appendChild(item);
  });
  allCb.addEventListener('change', function(){ setSel(allCb.checked ? allVals.slice() : []); });
  markB.addEventListener('click', function(){ setSel(allVals.slice()); });
  clearB.addEventListener('click', function(){ setSel([]); });
  btn.addEventListener('click', function(evt){
    evt.stopPropagation();
    var willOpen = panel.classList.contains('hidden');
    closeAllPanels(panel);
    panel.classList.toggle('hidden', !willOpen);
  });

  syncChecks(); refreshLabel();
  return group;
}

var TAB_NOTES = {

function fmtDateTime(s){
  if (!s) return '—';
  var parts = String(s).split('T');
  var d = parts[0].split('-');
  if (d.length !== 3) return String(s);
  var out = d[2]+'/'+d[1]+'/'+d[0];
  if (parts[1]) out += ' ' + parts[1].slice(0,5);
  return out;
}

function excelMonthKey(d){
  if (!(d instanceof Date) || isNaN(d)) return null;
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0');
}
function todayStr(){
  /* horário de Brasília (America/Sao_Paulo), independente do fuso do navegador */
  var fmt = new Intl.DateTimeFormat('en-CA', { timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false });
  var parts = {};
  fmt.formatToParts(new Date()).forEach(function(p){ parts[p.type] = p.value; });
  return parts.year + '-' + parts.month + '-' + parts.day + 'T' + parts.hour + ':' + parts.minute;
}

/* localiza blocos de tabela dinâmica (ex.: Soma de Valor / Soma de CMV / Soma de LB) numa aba,
   a partir da linha 'Rótulos de Linha' que antecede cada bloco */
function findPivotBlocks(aoa){
  var blocks = {};
  for (var i=0;i<aoa.length;i++){
    var row = aoa[i];
    if (row && row[0] === 'Rótulos de Linha'){
      var label = (aoa[i-1] && aoa[i-1][0]) || ('bloco'+i);
      var months = [];
      var j=1;
      while (row[j] instanceof Date){ months.push(row[j]); j++; }
      var dataRows = [];
      var k = i+1;
      while (aoa[k] && aoa[k][0] && aoa[k][0] !== 'Total Geral'){
        dataRows.push(aoa[k]);
        k++;
      }
      blocks[label] = { months: months, rows: dataRows };
    }
  }
  return blocks;
}

function parseFaturamentoWorkbook(wb){
  var histSheet = wb.Sheets['Fat_Hist_Filial'];
  var fatSheet = wb.Sheets['Base_Fat.'];
  if (!histSheet || !fatSheet) throw new Error('Não encontrei as abas "Fat_Hist_Filial" e/ou "Base_Fat." na planilha.');

  var aoa = XLSX.utils.sheet_to_json(histSheet, {header:1, raw:true});
  var blocks = findPivotBlocks(aoa);
  var bV = blocks['Soma de Valor'], bC = blocks['Soma de CMV'], bL = blocks['Soma de LB'];
  if (!bV || !bC || !bL) throw new Error('Não encontrei os blocos de Valor/CMV/LB em "Fat_Hist_Filial".');

  var pivotMonths = bV.months.map(excelMonthKey).filter(function(m){ return !!m; });
  var pivotMonthSet = {};
  pivotMonths.forEach(function(m){ pivotMonthSet[m]=1; });

  function metricMap(block){
    var map = {};
    block.rows.forEach(function(row){
      var fil = row[0];
      if (!fil) return;
      var byMonth = {};
      block.months.forEach(function(d,i){
        var mk = excelMonthKey(d);
        if (!mk) return;
        var v = row[1+i];
        if (v == null || v === '') return;
        byMonth[mk] = Number(v)||0;
      });
      map[fil] = byMonth;
    });
    return map;
  }
  var mV = metricMap(bV), mC = metricMap(bC), mL = metricMap(bL);

  var grid = {};
  Object.keys(mV).forEach(function(fil){
    var byMonth = {};
    pivotMonths.forEach(function(m){
      var v = mV[fil] && mV[fil][m];
      if (v == null) return;
      var c = (mC[fil] && mC[fil][m]) || 0;
      var l = (mL[fil] && mL[fil][m]) || 0;
      byMonth[m] = { v:v, c:c, l:l, i:(v-c-l), q:0 };
    });
    grid[fil] = byMonth;
  });

  /* linhas brutas: qtde. e clientes distintos para todos os meses, e também
     v/c/i/l diretos para meses que ainda não aparecem no resumo histórico
     (ex.: o mês corrente, antes da tabela dinâmica ser atualizada) */
  var faoa = XLSX.utils.sheet_to_json(fatSheet, {header:1, raw:true});
  var headerRowIdx = -1, header = null;
  for (var r=0; r<Math.min(faoa.length,20); r++){
    var row2 = faoa[r];
    if (row2 && row2.indexOf('Loja')>=0 && row2.indexOf('Ano_Mes')>=0 && row2.indexOf('Valor')>=0){
      headerRowIdx = r; header = row2; break;
    }
  }
  var clientsGrid = {};
  var extraMonthsSet = {};
  var devolGrid = {};
  if (headerRowIdx >= 0){
    var idxLoja = header.indexOf('Loja');
    var idxAnoMes = header.indexOf('Ano_Mes');
    var idxCliente = header.indexOf('Cliente');
    var idxQtde = header.indexOf('Qtde.');
    var idxValor = header.indexOf('Valor');
    var idxCMV = header.indexOf('CMV');
    var idxImpostos = header.indexOf('Impostos');
    var idxLB = header.indexOf('LB');
    var idxTipo = header.indexOf('Tipo');
    var clientSets = {};
    var rawAgg = {};
    var cmvGrid = {};
    for (var rr=headerRowIdx+1; rr<faoa.length; rr++){
      var row3 = faoa[rr];
      if (!row3) continue;
      var fil2 = row3[idxLoja];
      var mk2 = excelMonthKey(row3[idxAnoMes]);
      if (!fil2 || !mk2) continue;

      if (pivotMonthSet[mk2]){
        if (grid[fil2] && grid[fil2][mk2]){
          grid[fil2][mk2].q += Number(row3[idxQtde])||0;
        }
      } else {
        extraMonthsSet[mk2] = 1;
        rawAgg[fil2] = rawAgg[fil2] || {};
        var cell = rawAgg[fil2][mk2] || {v:0,c:0,i:0,l:0,q:0};
        cell.v += Number(row3[idxValor])||0;
        cell.c += Number(row3[idxCMV])||0;
        cell.i += Number(row3[idxImpostos])||0;
        cell.l += Number(row3[idxLB])||0;
        cell.q += Number(row3[idxQtde])||0;
        rawAgg[fil2][mk2] = cell;
      }

      cmvGrid[fil2] = cmvGrid[fil2] || {};
      cmvGrid[fil2][mk2] = (cmvGrid[fil2][mk2]||0) + (Number(row3[idxCMV])||0);

      var cliente = row3[idxCliente];
      if (cliente != null){
        clientSets[fil2] = clientSets[fil2] || {};
        clientSets[fil2][mk2] = clientSets[fil2][mk2] || {};
        clientSets[fil2][mk2][cliente] = 1;
      }

      if (idxTipo>=0 && row3[idxTipo]==='D'){
        devolGrid[fil2] = devolGrid[fil2] || {};
        devolGrid[fil2][mk2] = (devolGrid[fil2][mk2]||0) + Math.abs(Number(row3[idxValor])||0);
      }
    }
    Object.keys(clientSets).forEach(function(fil3){
      clientsGrid[fil3] = {};
      Object.keys(clientSets[fil3]).forEach(function(m3){
        clientsGrid[fil3][m3] = Object.keys(clientSets[fil3][m3]);
      });
    });
    Object.keys(rawAgg).forEach(function(fil4){
      grid[fil4] = grid[fil4] || {};
      Object.keys(rawAgg[fil4]).forEach(function(m4){
        grid[fil4][m4] = rawAgg[fil4][m4];
      });
    });
  }

  var months = pivotMonths.concat(Object.keys(extraMonthsSet)).sort();
  var filiais = Object.keys(grid);
  var devolMonths = {};
  Object.keys(devolGrid).forEach(function(f){ Object.keys(devolGrid[f]).forEach(function(m){ devolMonths[m]=1; }); });

  var abc = headerRowIdx >= 0 ? computeAbcFromAoa(faoa, headerRowIdx, header) : null;
  return { months: months, grid: grid, clientsGrid: clientsGrid, filiais: filiais, devolGrid: devolGrid, devolMonths: Object.keys(devolMonths).sort(), abc: abc, cmvGrid: (typeof cmvGrid!=='undefined' ? cmvGrid : null) };
}

function applyFaturamentoUpdate(parsed, fileName){

/* Estoque Histórico.xlsx: colunas B9_FILIAL, LOJA, B9_LOCAL, ..., MÊS_ANO, TOTAL → DATA.giro.estoque */
function isEstoqueHistWorkbook(wb){
  var ws = wb.Sheets[wb.SheetNames[0]];
  var aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true});
  for (var r=0; r<Math.min(aoa.length,10); r++){ var row=aoa[r]||[]; if (row.indexOf('B9_FILIAL')>=0 && row.indexOf('TOTAL')>=0) return true; }
  return false;
}
function parseEstoqueHistWorkbook(wb){
  var ws = wb.Sheets[wb.SheetNames[0]];
  var aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true});
  var h=-1, header=null;
  for (var r=0; r<Math.min(aoa.length,10); r++){ var row=aoa[r]||[]; if (row.indexOf('B9_FILIAL')>=0 && row.indexOf('TOTAL')>=0){ h=r; header=row; break; } }
  if (h<0) throw new Error('Cabeçalho do Estoque Histórico não encontrado.');
  var iL=header.indexOf('LOJA'), iMA=header.indexOf('MÊS_ANO'), iA=header.indexOf('ANO'), iM=header.indexOf('MES'), iT=header.indexOf('TOTAL');
  var grid={}, ms={};
  for (var k=h+1; k<aoa.length; k++){
    var rw=aoa[k]; if (!rw || !rw[iL]) continue;
    var mk = iMA>=0 ? excelMonthKey(rw[iMA]) : null;
    if (!mk && iA>=0 && iM>=0 && rw[iA] && rw[iM]) mk = rw[iA]+'-'+String(rw[iM]).padStart(2,'0');
    if (!mk) continue;
    var fil = String(rw[iL]).trim();
    grid[fil] = grid[fil] || {};
    grid[fil][mk] = (grid[fil][mk]||0) + (Number(rw[iT])||0);
    ms[mk]=1;
  }
  return {estoque:grid, months:Object.keys(ms).sort()};
}

var updateBtn = document.getElementById('update-data-btn');
var updateInput = document.getElementById('update-data-input');

if (updateBtn && updateInput){
  updateBtn.addEventListener('click', function(){
    if (!DATA){ showToast('Carregue primeiro a base completa na aba Parâmetros.', true); return; }
    if (nivelAcesso()!=='admin' && nivelAcesso()!=='local'){ showToast('Somente administradores atualizam os dados.', true); return; }
    updateInput.click();
  });
  updateInput.addEventListener('change', function(){
    var files = Array.prototype.slice.call(updateInput.files || []);
    updateInput.value = '';
    if (!files.length) return;
    if (typeof XLSX === 'undefined'){
      showToast('Não foi possível carregar o leitor de planilhas (sem conexão com a internet?).', true);
      return;
    }
    updateBtn.disabled = true; updateBtn.classList.add('is-loading');
    updateLabel.textContent = 'Atualizando...';
    function readOne(file){
      return new Promise(function(res, rej){
        var reader = new FileReader();
        reader.onload = function(e){ res({file:file, buf:e.target.result}); };
        reader.onerror = function(){ rej(new Error('Erro ao ler "'+file.name+'".')); };
        reader.readAsArrayBuffer(file);
      });
    }
    Promise.all(files.map(readOne)).then(function(items){
      var done = [];
      items.forEach(function(it){
        try{
          var wb = XLSX.read(it.buf, {type:'array', cellDates:true});
          if (isEstoqueHistWorkbook(wb)){
            var est = parseEstoqueHistWorkbook(wb);
            DATA.giro.estoque = est.estoque; DATA.giro.months = est.months;
            BASE_NONFAT_MONTHS = computeBaseNonfat();
            dirtySec.estoque = true;
            resetTabState('giro');
            done.push('Estoque ("'+it.file.name+'")');
          } else {
            var parsed = parseFaturamentoWorkbook(wb);
            applyFaturamentoUpdate(parsed, it.file.name);
            dirtySec.fat = true;
            done.push('Faturamento/Curva ABC/CMV do Giro ("'+it.file.name+'")');
          }
        } catch(err){
          console.error(err);
          showToast('Não foi possível atualizar "'+it.file.name+'": ' + err.message, true);
        }
      });
      if (done.length){
        DATA.meta.gerado_em = todayStr();
        updateSourceLabel(); renderFilterBar(); updateTabDots(); rerenderAll();
        scheduleCloudSave();
        showToast('Atualizado: '+done.join(' · ')+(msAccount?' — gravando no SharePoint…':'.'));
      }
    }).catch(function(err){ showToast(err.message, true); }).then(function(){
      updateBtn.disabled = false; updateBtn.classList.remove('is-loading');
      updateLabel.textContent = 'Atualizar dados';
    });
  });
}

function shareId(url){

/* resolve o link de compartilhamento da pasta → driveId + itemId */
function resolverPasta(){
  if (pasta) return Promise.resolve(pasta);
  return getGraphToken().then(function(token){
    if (!token){ pastaErro = 'sem token'; return null; }
    return fetch('https://graph.microsoft.com/v1.0/shares/'+shareId(SP_PASTA_LINK)+'/driveItem', {headers:{Authorization:'Bearer '+token}})
      .then(function(r){
        if (!r.ok){ pastaErro = 'HTTP '+r.status; return null; }
        return r.json().then(function(j){
          pasta = { driveId: j.parentReference && j.parentReference.driveId, itemId: j.id, nome: j.name, webUrl: j.webUrl };
          if (!pasta.driveId || !pasta.itemId){ pasta = null; pastaErro = 'pasta inválida'; }
          return pasta;
        });
      }).catch(function(e){ pastaErro = e.message || 'rede'; return null; });
  });
}
function fileUrl(name){ return 'https://graph.microsoft.com/v1.0/drives/'+pasta.driveId+'/items/'+pasta.itemId+':/'+encodeURIComponent(name)+':'; }

/* GET metadados (eTag); com content=true baixa o JSON. → {ok, missing, etag, data} */
function graphGet(name, content){
  return Promise.all([getGraphToken(), resolverPasta()]).then(function(a){
    var token = a[0]; if (!token || !pasta) return {ok:false};
    var base = fileUrl(name);
    return fetch(base, {headers:{Authorization:'Bearer '+token}}).then(function(meta){
      if (meta.status===404) return {ok:true, missing:true, data:null, etag:null};
      if (!meta.ok) return {ok:false, status:meta.status};
      return meta.json().then(function(mj){
        var etag = mj.eTag || mj.cTag || null;
        if (!content) return {ok:true, etag:etag};
        return fetch(base+'/content', {headers:{Authorization:'Bearer '+token}}).then(function(c){
          if (!c.ok) return {ok:false, status:c.status};
          return c.json().then(function(data){ return {ok:true, data:data, etag:etag}; });
        });
      });
    }).catch(function(){ return {ok:false}; });
  });
}
/* PUT com trava otimista (If-Match) → {ok, status, etag} */
function graphPut(name, obj, etag){
  return Promise.all([getGraphToken(), resolverPasta()]).then(function(a){
    var token = a[0]; if (!token || !pasta) return {ok:false, status:0};
    var headers = {Authorization:'Bearer '+token, 'Content-Type':'application/json'};
    if (etag) headers['If-Match'] = etag;
    return fetch(fileUrl(name)+'/content', {method:'PUT', headers:headers, body:JSON.stringify(obj)}).then(function(r){
      if (!r.ok) return {ok:false, status:r.status};
      return r.json().then(function(j){ return {ok:true, status:r.status, etag:j.eTag||j.cTag||null}; }).catch(function(){ return {ok:true, status:r.status, etag:null}; });
    }).catch(function(){ return {ok:false, status:0}; });
  });
}

    r.meta.filiais = clone(DATA.meta.filiais); r.meta.periodos = clone(DATA.meta.periodos); r.meta.fonte = DATA.meta.fonte;
  }
  if (dirtySec.estoque){ r.giro.estoque = clone(DATA.giro.estoque); r.giro.months = clone(DATA.giro.months); }
  r.meta.gerado_em = DATA.meta.gerado_em;
  return r;
}

/* ---------- sincronização ---------- */
function setSyncStatus(txt, cls){
  var s = document.getElementById('sync-status'); if (!s) return;
  s.textContent = txt; s.className = 'sync-status' + (cls?' '+cls:''); s.hidden = !txt;
}
function sincronizarNuvem(silencioso){
  if (!msAccount) return Promise.resolve();
  setSyncStatus('⏳ conectando…','saving');
  return resolverPasta().then(function(p){
    if (!p){ acessoOk = false; applyAccess(); setSyncStatus('⚠ pasta do SharePoint inacessível','warn'); return; }
    return graphGet(ACESSO_FILE, true).then(function(ac){
      if (ac.ok){
        acessoOk = true; acessoEtag = ac.etag;
        acesso = { emailsAutorizados:(ac.data && ac.data.emailsAutorizados)||[], emailsComuns:(ac.data && ac.data.emailsComuns)||[] };
      } else acessoOk = false;
      applyAccess();
      if (!acessoOk){ setSyncStatus('⚠ falha ao ler a lista de acesso','warn'); return; }
      if (nivelAcesso()==='bloqueado'){ setSyncStatus('',''); return; }
      /* primeiro acesso (lista vazia): grava o usuário atual como admin */
      if (!acesso.emailsAutorizados.length && !acesso.emailsComuns.length){
        acesso.emailsAutorizados = [emailAtual()]; saveAcesso();
      }
      return graphGet(DADOS_FILE, true).then(function(dd){
        if (dd.ok && dadosValidos(dd.data)){
          var novo = Object.keys(dirtySec).length ? aplicarLocalSobre(dd.data) : dd.data;
          cloudEtag = dd.etag; setData(novo); salvarCache();
          ultimaSync = new Date();
          setSyncStatus('☁ conectado','ok');
          if (!silencioso) showToast('Dados atualizados do SharePoint.');
        } else if (dd.ok && dd.missing){
          cloudEtag = null;
          setSyncStatus('⚠ sem base no SharePoint','warn');
          if (!DATA) showToast('Nenhuma base encontrada na pasta. Um admin deve importar a base em Parâmetros.', true);
        } else {
          setSyncStatus('⚠ erro ao ler os dados','warn');
        }
        if (currentTab==='param') rerenderTab('param');
        startPolling();
      });
    });
  });
}
function scheduleCloudSave(){
  if (!msAccount){ salvarCache(); return; }
  setSyncStatus('⏳ salvando…','saving');
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(salvarDados, 600);
}
function salvarDados(){
  if (!msAccount || nivelAcesso()!=='admin' || !DATA) return Promise.resolve();
  if (salvando){ pendente = true; return Promise.resolve(); }
  salvando = true;
  var tent = 0;
  function tentar(){
    tent++;
    return graphPut(DADOS_FILE, DATA, cloudEtag).then(function(res){
      if (res.ok){ cloudEtag = res.etag || cloudEtag; dirtySec = {}; salvarCache(); ultimaSync = new Date(); setSyncStatus('☁ salvo no SharePoint','ok'); if (currentTab==='param') rerenderTab('param'); return true; }
      if ((res.status===412 || res.status===409) && tent<5){
        setSyncStatus('⟳ mesclando…','saving');
        return graphGet(DADOS_FILE, true).then(function(dd){
          if (dd.ok && dd.data){ cloudEtag = dd.etag; setData(aplicarLocalSobre(dd.data)); return tentar(); }
          return false;
        });
      }
      return false;
    });
  }
  return tentar().then(function(ok){
    salvando = false;
    if (!ok){ salvarCache(); setSyncStatus('⚠ salvo só neste aparelho','warn'); showToast('Não foi possível gravar no SharePoint agora.', true); }
    if (pendente){ pendente = false; salvarDados(); }
  });
}
function startPolling(){ clearInterval(_pollTimer); _pollTimer = setInterval(puxarSeMudou, 60000); }
function puxarSeMudou(){
  if (!msAccount || salvando || Object.keys(dirtySec).length || nivelAcesso()==='bloqueado') return;
  graphGet(DADOS_FILE, false).then(function(m){
    if (!m.ok || !m.etag || m.etag===cloudEtag) return;
    return graphGet(DADOS_FILE, true).then(function(dd){
      if (dd.ok && dadosValidos(dd.data)){ cloudEtag = dd.etag; setData(dd.data); salvarCache(); setSyncStatus('⟳ atualizado agora','ok'); }
    });
  });
}
document.addEventListener('visibilitychange', function(){ if (!document.hidden) puxarSeMudou(); });

function saveAcesso(){
  if (!msAccount){ showToast('Entre com o Microsoft para gerenciar usuários.', true); return Promise.resolve(false); }
  var tent = 0;
  function uniao(a,b){ return uniq((a||[]).concat(b||[])); }
  function tentar(){
    tent++;
    return graphPut(ACESSO_FILE, acesso, acessoEtag).then(function(res){
      if (res.ok){ acessoEtag = res.etag || acessoEtag; return true; }
      if ((res.status===412 || res.status===409) && tent<5){
        return graphGet(ACESSO_FILE, true).then(function(ac){
          if (!ac.ok || !ac.data) return false;
          acesso.emailsAutorizados = uniao(ac.data.emailsAutorizados, acesso.emailsAutorizados);
          acesso.emailsComuns = uniao(ac.data.emailsComuns, acesso.emailsComuns).filter(function(e){ return acesso.emailsAutorizados.indexOf(e)<0; });
          acessoEtag = ac.etag; return tentar();
        });
      }
      return false;
    });
  }
  return tentar().then(function(ok){ if (!ok) showToast('Não foi possível salvar os usuários agora.', true); return ok; });
}

/* ---------- níveis de acesso ---------- */
function emailAtual(){ return msAccount ? String(msAccount.username||'').toLowerCase() : ''; }
function lower(l){ return (l||[]).map(function(x){ return String(x).toLowerCase(); }); }
function nivelAcesso(){
  if (!msAccount) return msalReady ? 'deslogado' : 'local';
  if (!acessoOk) return 'bloqueado';
  var e = emailAtual();
  if (lower(acesso.emailsAutorizados).indexOf(e)>=0) return 'admin';
  if (lower(acesso.emailsComuns).indexOf(e)>=0) return 'comum';
  if (!acesso.emailsAutorizados.length && !acesso.emailsComuns.length) return 'admin'; /* primeiro acesso */
  return 'bloqueado';
}
function applyAccess(){
  var nivel = nivelAcesso();
  var ovLogin = document.getElementById('overlay-login'), ovNeg = document.getElementById('overlay-negado');
  ovLogin.hidden = nivel!=='deslogado';
  ovNeg.hidden = nivel!=='bloqueado' || !msAccount;
  if (nivel==='bloqueado' && msAccount){
    document.getElementById('overlay-email-info').textContent = 'Logado como: '+emailAtual();
    document.getElementById('overlay-negado-msg').textContent = !pasta
      ? 'Não consegui acessar a pasta do SharePoint ('+(pastaErro||'erro')+'). Verifique se sua conta tem acesso à pasta e tente de novo.'
      : (!acessoOk ? 'Não consegui ler a lista de usuários no SharePoint. Tente novamente.' : 'Seu e-mail ainda não tem acesso a este painel. Peça a um administrador para cadastrá-lo na aba Parâmetros.');
  }
  var isAdmin = nivel==='admin' || nivel==='local';
  document.body.classList.toggle('is-admin', isAdmin);
  var tp = TABS.filter(function(t){ return t.id==='param'; })[0];
  if (tp) tp._btn.hidden = !isAdmin;
  if (!isAdmin && currentTab==='param'){ TABS[0]._btn.click(); }
  updateLoginUI();
}
function updateLoginUI(){
  var lbl = document.getElementById('ms-login-label');
  if (!lbl) return;
  if (msAccount) lbl.textContent = (msAccount.name || msAccount.username);
  else lbl.textContent = msalReady ? 'Entrar com Microsoft' : 'Modo local';
  document.getElementById('btn-ms-login').title = msAccount ? 'Logado como '+msAccount.username+' — clique para sair' : 'Entrar com a conta Microsoft da MAQCAMPO';
}
function resetAuthState(){
  msAccount = null; cloudEtag = null; acessoEtag = null; acessoOk = false; pasta = null;
  acesso = { emailsAutorizados:[], emailsComuns:[] }; dirtySec = {};
  salvando = false; pendente = false;
  clearInterval(_pollTimer); clearTimeout(_saveTimer);
  try { localStorage.removeItem(CACHE_KEY); } catch(e){}
  setSyncStatus('','');
}
function fazerLogin(){
  if (!msalInstance){ showToast('Login indisponível neste modo (abra pelo endereço publicado).', true); return; }
  document.getElementById('ms-login-label').textContent = 'Abrindo login…';
  msalInstance.loginPopup({ scopes:GRAPH_SCOPES, prompt:'select_account' }).then(function(resp){
    msAccount = resp.account;
    try { msalInstance.setActiveAccount(msAccount); } catch(e){}
    updateLoginUI();
    return sincronizarNuvem(true).then(function(){ showToast('Logado como '+msAccount.username); });
  }).catch(function(e){
    updateLoginUI();
    var code = (e && (e.errorCode||e.message)) || '';
    if (/popup/.test(code)) showToast('Popup bloqueado — libere popups para este site.', true);
    else if (code==='user_cancelled') showToast('Login cancelado.');
    else showToast('Erro no login: '+(code||'desconhecido'), true);
  });
}
function fazerLogout(){
  var inst = msalInstance;
  resetAuthState(); setData(null); applyAccess();
  if (inst){
    try { if (inst.clearCache) inst.clearCache(); } catch(e){}
    try { inst.setActiveAccount(null); } catch(e){}
  }
  showToast('Sessão encerrada.');
}
document.getElementById('btn-ms-login').addEventListener('click', function(){
  if (msAccount){ if (confirm('Sair de '+msAccount.username+'?')) fazerLogout(); return; }
  fazerLogin();
});
document.getElementById('overlay-login-btn').addEventListener('click', fazerLogin);
document.getElementById('overlay-sair-btn').addEventListener('click', fazerLogout);
document.getElementById('overlay-retry-btn').addEventListener('click', function(){ pasta = null; sincronizarNuvem(false); });

function initAuth(){
  return loadMsal().then(function(){
    var MsalClass = window.msal && window.msal.PublicClientApplication;
    if (!MsalClass) throw new Error('MSAL indisponível');
    msalInstance = new MsalClass(MSAL_CONFIG);
    return msalInstance.initialize();
  }).then(function(){
    msalReady = true;
    var accs = msalInstance.getAllAccounts();
    if (accs.length){
      msAccount = accs[0];
      var c = lerCache();                 /* mostra o último cache enquanto confere a nuvem */
      if (c){ cloudEtag = c.etag; setData(c.data); }
      updateLoginUI();
      return sincronizarNuvem(true);
    }
    applyAccess();
  }).catch(function(){
    /* sem MSAL (ex.: arquivo aberto direto no computador) → modo local, sem bloqueio */
    msalReady = false; msalInstance = null;
    var c = lerCache(); if (c) setData(c.data);
    applyAccess();
    setSyncStatus('modo local — dados só neste aparelho','warn');
  });
}

/* ================= ABA PARÂMETROS ================= */
function buildParametros(){
  var panel = el('div','tab-panel','');
  var nivel = nivelAcesso();
  var grid = el('div','chart-grid param-grid');

  /* --- Usuários --- */
  var cU = chartCard('Usuários e acesso', 2, 'admin vê Parâmetros e atualiza os dados · comum só visualiza');
  var who = el('div','param-who');
  who.innerHTML = '<div><span>Usuário logado</span><b>'+esc(emailAtual()||'— (modo local)')+'</b></div>'+
    '<div><span>Nível</span><b>'+esc(nivel==='local'?'local (sem login)':nivel)+'</b></div>';
  cU.body.appendChild(who);
  if (!msAccount){
    cU.body.appendChild(el('div','param-note','Entre com a conta Microsoft para gerenciar os usuários. A lista fica no arquivo '+esc(ACESSO_FILE)+' da pasta do SharePoint.'));
  } else {
    var cols = el('div','param-cols');
    cols.appendChild(listaUsuarios('Administradores', 'emailsAutorizados', 'admin'));
    cols.appendChild(listaUsuarios('Usuários comuns', 'emailsComuns', 'comum'));
    cU.body.appendChild(cols);
  }
  grid.appendChild(cU.card);

  /* --- Armazenamento --- */
  var cS = chartCard('Armazenamento', 1, 'SharePoint MCPOIRRIGACAO');
  var info = el('div','param-kv');
  info.innerHTML =
    '<div><span>Pasta</span><b>'+(pasta ? '<a href="'+esc(pasta.webUrl)+'" target="_blank" rel="noopener">'+esc(pasta.nome)+'</a>' : '<a href="'+esc(SP_PASTA_LINK)+'" target="_blank" rel="noopener">abrir pasta</a>'+(pastaErro?' · <span class="t-bad">'+esc(pastaErro)+'</span>':''))+'</b></div>'+
    '<div><span>Arquivo de dados</span><b>'+esc(DADOS_FILE)+'</b></div>'+
    '<div><span>Arquivo de acesso</span><b>'+esc(ACESSO_FILE)+'</b></div>'+
    '<div><span>Última sincronização</span><b>'+(ultimaSync? esc(ultimaSync.toLocaleString('pt-BR')) : '—')+'</b></div>';
  cS.body.appendChild(info);
  var bSync = el('button','btn btn-sm param-btn','Sincronizar agora'); bSync.type='button';
  bSync.addEventListener('click', function(){ if (!msAccount){ showToast('Entre com o Microsoft primeiro.', true); return; } pasta = null; sincronizarNuvem(false); });
  cS.body.appendChild(bSync);
  grid.appendChild(cS.card);

  /* --- Base de dados --- */
  var cB = chartCard('Base de dados', 3, '');
  var m = (DATA && DATA.meta) || {};
  var kv = el('div','param-kv param-kv-row');
  kv.innerHTML =
    '<div><span>Situação</span><b>'+(DATA?'carregada':'<span class="t-bad">sem base</span>')+'</b></div>'+
    '<div><span>Atualizada em</span><b>'+esc(fmtDateTime(m.gerado_em))+'</b></div>'+
    '<div><span>Última planilha importada</span><b>'+esc(m.fonte||'—')+'</b></div>'+
    '<div><span>Faturamento</span><b>'+(DATA && DATA.fat.grid.months.length ? esc(monthLabel(DATA.fat.grid.months[0])+' a '+monthLabel(DATA.fat.grid.months[DATA.fat.grid.months.length-1])) : '—')+'</b></div>'+
    '<div><span>Estoque histórico</span><b>'+(DATA && DATA.giro.months.length ? esc(monthLabel(DATA.giro.months[0])+' a '+monthLabel(DATA.giro.months[DATA.giro.months.length-1])) : '—')+'</b></div>'+
    '<div><span>Inventário (posição)</span><b>'+esc(DATA && DATA.zv ? fmtDateBR(DATA.zv.invData) : '—')+'</b></div>';
  cB.body.appendChild(kv);
  cB.body.appendChild(el('div','param-note',
    '<b>Atualizar dados</b> (topo da tela): envie o <b>Métrica Mensal.xlsx</b> (Faturamento, Curva ABC e CMV do Giro) e/ou o <b>Estoque Histórico.xlsx</b> (estoque do Giro). '+
    'O painel recalcula e grava a base no SharePoint para todos os usuários. '+
    'Inventário, Sortimento e Zero Vendas usam a posição do inventário que está na base — para trocá-la, importe uma base completa nova abaixo.'));
  var tools = el('div','abc-tools');
  var inp = document.createElement('input'); inp.type='file'; inp.accept='.json,application/json'; inp.hidden = true;
  var bImp = el('button','btn btn-sm param-btn','Importar base completa (.json)'); bImp.type='button';
  var bExp = el('button','btn btn-sm param-btn param-btn-ghost','Baixar base (.json)'); bExp.type='button';
  bImp.addEventListener('click', function(){ inp.click(); });
  inp.addEventListener('change', function(){
    var f = inp.files && inp.files[0]; inp.value=''; if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      var d; try { d = JSON.parse(rd.result); } catch(e){ d = null; }
      if (!dadosValidos(d)){ showToast('Arquivo inválido: não é uma base do painel.', true); return; }
      if (DATA && !confirm('Substituir a base atual por "'+f.name+'" para todos os usuários?')) return;
      setData(d); dirtySec.tudo = true; scheduleCloudSave();
      showToast('Base importada'+(msAccount?' — gravando no SharePoint…':' (modo local).'));
    };
    rd.readAsText(f);
  });
  bExp.addEventListener('click', function(){
    if (!DATA){ showToast('Não há base carregada.', true); return; }
    var blob = new Blob([JSON.stringify(DATA)], {type:'application/json'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = DADOS_FILE;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });
  tools.appendChild(bImp); tools.appendChild(bExp); tools.appendChild(inp);
  cB.body.appendChild(tools);
  grid.appendChild(cB.card);

  panel.appendChild(grid);
  return panel;
}
function listaUsuarios(titulo, campo, tipo){
  var box = el('div','param-users');
  box.appendChild(el('div','abc-subtitle', esc(titulo)+' <span class="n">('+acesso[campo].length+')</span>'));
  var ul = el('div','param-list');
  if (!acesso[campo].length) ul.appendChild(el('div','param-note', tipo==='admin' ? 'Nenhum admin — o primeiro login vira admin.' : 'Nenhum usuário comum cadastrado.'));
  acesso[campo].forEach(function(em, i){
    var row = el('div','param-user');
    row.innerHTML = '<span>'+esc(em)+(em.toLowerCase()===emailAtual()?' <span class="chip info">você</span>':'')+'</span>';
    var rm = el('button','btn btn-sm param-rm','remover'); rm.type='button';
    rm.addEventListener('click', function(){
      if (tipo==='admin' && em.toLowerCase()===emailAtual() && !confirm('Remover você mesmo dos administradores? Você perderá o acesso aos Parâmetros.')) return;
      if (tipo==='admin' && acesso.emailsAutorizados.length===1){ showToast('Mantenha pelo menos um administrador.', true); return; }
      acesso[campo].splice(i,1);
      saveAcesso().then(function(){ applyAccess(); if (currentTab==='param') rerenderTab('param'); });
    });
    row.appendChild(rm); ul.appendChild(row);
  });
  box.appendChild(ul);
  var add = el('div','param-add');
  var inp = el('input','abc-search'); inp.type='email'; inp.placeholder='nome@maqcampo.com.br';
  var b = el('button','btn btn-sm param-btn','Adicionar'); b.type='button';
  function adicionar(){
    var em = inp.value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ showToast('Informe um e-mail válido.', true); return; }
    if (tipo==='comum' && lower(acesso.emailsAutorizados).indexOf(em)>=0){ showToast('Esse e-mail já é admin.', true); return; }
    if (lower(acesso[campo]).indexOf(em)<0) acesso[campo].push(em);
    if (tipo==='admin') acesso.emailsComuns = acesso.emailsComuns.filter(function(x){ return x.toLowerCase()!==em; });
    saveAcesso().then(function(ok){ if (ok) showToast('Usuário adicionado.'); if (currentTab==='param') rerenderTab('param'); });
  }
  b.addEventListener('click', adicionar);
  inp.addEventListener('keydown', function(e){ if (e.key==='Enter') adicionar(); });
  add.appendChild(inp); add.appendChild(b);
  box.appendChild(add);
  return box;
}

applyAccess();
initAuth();

})();

</script>
