}

/* ===== SORTIMENTO =====
   Itens = Filial × Part Number vendidos nos últimos 12 meses da Base_Fat. (mesma relação da Curva ABC: POP = NFs venda − NFs devolução; POP ≤ 0 ou Qtd ≤ 0 ficam fora).
   Saldo = Inventário_de_Peças.xlsx, armazém 01 da filial. Saldo > 0 → item sortido (100%); zero/ausente → 0%.
   Nível de sortimento = itens com saldo / itens vendidos. <80% atenção · 80–90% bom · >90% ótimo. POP 3+ = reposição recomendada. */
function sortColor(p){
  if (p==null) return 'var(--text-muted)';
  if (p > 0.9) return 'var(--status-good)';
  if (p >= 0.8) return 'var(--status-warning)';
  return 'var(--status-critical)';
}
function sortChipCls(p){ return p==null ? 'muted' : (p > 0.9 ? 'good' : (p >= 0.8 ? 'warn' : 'bad')); }
function popKey(p){ return p>=6 ? '6+' : String(p); }

var sortGapLimit = 100;
function buildSortimento(){
  var sel = fSelOrAll('sort','filial');
  var allFil = fIsAll('sort','filial');
  var popSel = fSelOrAll('sort','pop');
  var inv = (DATA.abc && DATA.abc.inv) || {stock:{}};
  var rows = abcRows().filter(function(r){ return sel.indexOf(r.filial)>=0 && popSel.indexOf(popKey(r.pop))>=0; });
  rows.forEach(function(r){ var st = inv.stock[r.filial+'|'+r.item]; r.saldo = st ? st[0] : 0; r.ok = r.saldo > 0; });
  /* saldo do item nas outras filiais (armazém 01) — indica possibilidade de transferência */
  var redeStock = {};
  Object.keys(inv.stock).forEach(function(k){ var i = k.indexOf('|'); var it = k.slice(i+1), fil = k.slice(0,i); var q = inv.stock[k][0]||0; if (q>0){ (redeStock[it] = redeStock[it] || []).push({fil:fil, q:q}); } });
  rows.forEach(function(r){
    var lst = (redeStock[r.item]||[]).filter(function(x){ return x.fil!==r.filial; });
    r.saldoRede = lst.reduce(function(t,x){ return t+x.q; }, 0);
    r.saldoRedeTip = lst.map(function(x){ return x.fil+': '+fmtNum(x.q); }).join(' · ');
  });

  var keys = POP_FAIXAS.map(function(f){ return f.value; }).filter(function(k){ return popSel.indexOf(k)>=0; });
  function agg(list){
    var o = {n:0, s:0, byPop:{}};
    keys.forEach(function(k){ o.byPop[k] = {n:0, s:0}; });
    o.p3 = {n:0, s:0};
    list.forEach(function(r){
      var k = popKey(r.pop); o.n++; if (r.ok) o.s++;
      if (o.byPop[k]){ o.byPop[k].n++; if (r.ok) o.byPop[k].s++; }
      if (r.pop>=3){ o.p3.n++; if (r.ok) o.p3.s++; }
    });
    o.pct = o.n ? o.s/o.n : null; o.p3.pct = o.p3.n ? o.p3.s/o.p3.n : null;
    keys.forEach(function(k){ var b=o.byPop[k]; b.pct = b.n ? b.s/b.n : null; });
    return o;
  }
  var tot = agg(rows);
  var filiais = uniq(rows.map(function(r){ return r.filial; }));
  var byFil = filiais.map(function(f){ var a = agg(rows.filter(function(r){ return r.filial===f; })); a.filial=f; return a; })
    .sort(function(a,b){ return b.n-a.n; });

  var panel = el('div','tab-panel','');
  if (!rows.length){ var cE = chartCard('Sortimento', 3); emptyNote(cE.body); panel.appendChild(cE.card); return panel; }

  var gaps = rows.filter(function(r){ return !r.ok; });
  var gaps3 = gaps.filter(function(r){ return r.pop>=3; });
  var kpiRow = el('div','kpi-row');
  kpiRow.style.gridTemplateColumns = 'repeat(auto-fit, minmax(170px,1fr))';
  function lvl(p){ return p==null?'':(p>0.9?'ótimo':(p>=0.8?'bom':'atenção')); }
  kpiRow.appendChild(kpiTile('Nível de sortimento', tot.pct==null?'—':fmtPct(tot.pct,1), fmtNum(tot.s)+' de '+fmtNum(tot.n)+' itens · '+lvl(tot.pct), tot.pct==null?'':(tot.pct>0.9?'good':(tot.pct>=0.8?'':'warn'))));
  kpiRow.appendChild(kpiTile('Sortimento POP 3+', tot.p3.pct==null?'—':fmtPct(tot.p3.pct,1), fmtNum(tot.p3.s)+' de '+fmtNum(tot.p3.n)+' · reposição recomendada', tot.p3.pct==null?'':(tot.p3.pct>0.9?'good':(tot.p3.pct>=0.8?'':'warn'))));
  kpiRow.appendChild(kpiTile('Itens vendidos', fmtNum(tot.n), 'filial × part number · 12 meses'));
  kpiRow.appendChild(kpiTile('Com saldo', fmtNum(tot.s), 'saldo > 0 no armazém 01'));
  kpiRow.appendChild(kpiTile('Sem saldo', fmtNum(tot.n-tot.s), 'vendidos e zerados'));
  kpiRow.appendChild(kpiTile('Sem saldo POP 3+', fmtNum(gaps3.length), 'prioridade de reposição', gaps3.length>0?'warn':'good'));
  panel.appendChild(kpiRow);

  /* matriz filial × POP */
  var c1 = chartCard('Nível de sortimento por POP', 3, 'itens com saldo / itens vendidos · por filial e empresa');
  var scroll = el('div','chart-scroll'); scroll.style.maxHeight = 'none';
  var tbl = el('table','data-table heatmap-table');
  var h = '<thead><tr><th>Filial</th>';
  keys.forEach(function(k){ h += '<th class="num">'+(k==='6+'?'POP 6+':'POP '+k)+'</th>'; });
  h += '<th class="num">POP 3+</th><th class="num">Total</th><th class="num">Itens</th></tr></thead>';
  tbl.innerHTML = h;
  var tb = el('tbody');
  function cell(b){
    if (!b || !b.n) return '<td class="num" style="color:var(--text-muted)">—</td>';
    return '<td class="num" title="'+b.s+' de '+b.n+' itens com saldo"><span class="chip '+sortChipCls(b.pct)+'">'+fmtPct(b.pct,0)+'</span> <span style="color:var(--text-muted);font-size:11px">'+b.s+'/'+b.n+'</span></td>';
  }
  function rowHtml(name, a){
    var x = '<td>'+esc(name)+'</td>';
    keys.forEach(function(k){ x += cell(a.byPop[k]); });
    x += cell(a.p3) + cell({n:a.n, s:a.s, pct:a.pct}) + '<td class="num">'+fmtNum(a.n)+'</td>';
    return x;
  }
  byFil.forEach(function(a){ var tr = el('tr'); tr.innerHTML = rowHtml(a.filial, a); tb.appendChild(tr); });
  var trT = el('tr','heatmap-total-row'); trT.innerHTML = rowHtml(allFil ? 'Empresa' : 'Total selecionado', tot); tb.appendChild(trT);
  tbl.appendChild(tb); scroll.appendChild(tbl); c1.body.appendChild(scroll);
  var leg = el('div','legend-row legend-row-below');
  leg.innerHTML = '<span class="legend-item"><span class="legend-swatch" style="background:var(--status-critical)"></span>&lt; 80% atenção</span>'+
    '<span class="legend-item"><span class="legend-swatch" style="background:var(--status-warning)"></span>80% a 90% bom</span>'+
    '<span class="legend-item"><span class="legend-swatch" style="background:var(--status-good)"></span>&gt; 90% ótimo</span>'+
    '<span class="legend-item">POP 3+ = reposição recomendada</span>';
  c1.body.appendChild(leg);
  var g1 = el('div','chart-grid'); g1.appendChild(c1.card); panel.appendChild(g1);

  /* empresa por POP + ranking filiais */
  var g2 = el('div','chart-grid');
  var c2 = chartCard('Sortimento por POP · '+(allFil?'empresa':(sel.length===1?sel[0]:sel.length+' filiais')), 1);
  coverageBars(c2.body, keys.filter(function(k){ return tot.byPop[k].n; }).map(function(k){
    var b = tot.byPop[k]; return {label:(k==='6+'?'POP 6 ou mais':'POP '+k), covered:b.s, total:b.n, pct:b.pct, color:sortColor(b.pct)};
  }));
  g2.appendChild(c2.card);
  var c3 = chartCard('Nível de sortimento por filial', 1, 'todas as faixas selecionadas');
  rankList(c3.body, byFil.slice().sort(function(a,b){ return (b.pct||0)-(a.pct||0); }).map(function(a){ return {label:a.filial, value:a.pct||0, color:sortColor(a.pct)}; }), {showPct:false, valueFmt:function(v){ return fmtPct(v,1); }});
  g2.appendChild(c3.card);
  var c4 = chartCard('Sortimento POP 3+ por filial', 1, 'itens com reposição recomendada');
  rankList(c4.body, byFil.filter(function(a){ return a.p3.n; }).sort(function(a,b){ return (b.p3.pct||0)-(a.p3.pct||0); }).map(function(a){ return {label:a.filial+' ('+a.p3.s+'/'+a.p3.n+')', value:a.p3.pct||0, color:sortColor(a.p3.pct)}; }), {showPct:false, valueFmt:function(v){ return fmtPct(v,1); }});
  g2.appendChild(c4.card);
  panel.appendChild(g2);

  /* lista de itens sem saldo */
  var c5 = chartCard('Itens vendidos sem saldo', 3, '');
  var titleN = c5.card.querySelector('.chart-title .n') || (function(){ var t=c5.card.querySelector('.chart-title'); var sp=el('span','n',''); t.appendChild(document.createTextNode(' ')); t.appendChild(sp); return sp; })();
  var tools = el('div','abc-tools');
  var search = el('input','abc-search'); search.type='search'; search.placeholder='Buscar item ou descrição...';
  var onlyP3 = el('label','abc-cob','<input type="checkbox" checked style="width:auto"> Só POP 3+ (reposição recomendada)');
  var expS = el('button','btn btn-sm abc-export','Exportar Excel'); expS.type='button';
  expS.title = 'Exporta todos os itens da lista (com a busca e o "Só POP 3+" atuais) + o nível de sortimento por filial e POP';
  tools.appendChild(search); tools.appendChild(onlyP3); tools.appendChild(expS);
  c5.body.appendChild(tools);
  var host = el('div'); c5.body.appendChild(host);
  var currentGaps = [];
  function renderGaps(){
    var q = search.value.trim().toLowerCase();
    var p3 = onlyP3.querySelector('input').checked;
    var list = gaps.filter(function(r){ return (!p3 || r.pop>=3) && (!q || (r.item+' '+r.desc).toLowerCase().indexOf(q)>=0); })
      .sort(function(a,b){ return b.pop-a.pop || b.qtd-a.qtd; });
    currentGaps = list;
    titleN.textContent = fmtNum(list.length)+' itens · ordenado por POP';
    host.innerHTML = '';
    if (!list.length){ emptyNote(host, 'Nenhum item sem saldo para o filtro.'); return; }
    var sc = el('div','chart-scroll abc-table-scroll');
    var t = el('table','data-table');
    t.innerHTML = '<thead><tr><th>Filial</th><th>Item</th><th>Descrição</th><th class="num">POP</th><th class="num">Meses c/ venda</th><th class="num">Qtd. Vds</th><th class="num">Saldo</th><th class="num">Saldo outras filiais</th><th class="num">Faturamento</th><th>Última venda</th></tr></thead>';
    var b2 = el('tbody');
    list.slice(0, sortGapLimit).forEach(function(r){
      var tr = el('tr');
      var d = r.ult ? r.ult.split('-').reverse().join('/') : '—';
      tr.innerHTML = '<td>'+esc(r.filial)+'</td><td>'+esc(r.item)+'</td><td class="abc-desc" title="'+esc(r.desc)+'">'+esc(r.desc)+'</td>'+
        '<td class="num"><span class="chip '+(r.pop>=3?'bad':'muted')+'">'+r.pop+'</span></td><td class="num">'+r.meses+'</td><td class="num">'+fmtNum(r.qtd)+'</td><td class="num">'+fmtNum(r.saldo)+'</td>'+
        '<td class="num"'+(r.saldoRedeTip?' title="'+esc(r.saldoRedeTip)+'"':'')+'>'+(r.saldoRede>0?'<span class="chip info">'+fmtNum(r.saldoRede)+'</span>':'<span style="color:var(--text-muted)">0</span>')+'</td>'+
        '<td class="num">'+fmtBRL(r.valor)+'</td><td>'+d+'</td>';
      b2.appendChild(tr);
    });
    t.appendChild(b2); sc.appendChild(t); host.appendChild(sc);
    if (list.length > sortGapLimit){
      var more = el('button','btn btn-sm abc-more','Mostrar mais ('+fmtNum(list.length-sortGapLimit)+' restantes)'); more.type='button';
      more.addEventListener('click', function(){ sortGapLimit += 200; renderGaps(); });
      host.appendChild(more);
    }
  }
  search.addEventListener('input', renderGaps);
  onlyP3.querySelector('input').addEventListener('change', renderGaps);
  expS.addEventListener('click', function(){
    exportSortExcel(currentGaps, {sel:sel, allFil:allFil, keys:keys, tot:tot, byFil:byFil, p3:onlyP3.querySelector('input').checked, q:search.value.trim()}, expS);
  });
  renderGaps();
  var g3 = el('div','chart-grid'); g3.appendChild(c5.card); panel.appendChild(g3);
  return panel;
}

/* ================= ZERO VENDAS (refeita em 06/10/2026) =================
   Base: Inventário_de_Peças.xlsx, armazém 01 (Peças varejo), por filial × item (IRRIGAFAZ fora — sem data de entrada).
   Sem venda = nenhuma venda líquida (vendida − devolvida > 0) do item NA FILIAL nos últimos 12 meses da Base_Fat. (DATA.zv.ini a DATA.zv.fim).
   Data da última entrada = coluna J (Dt.Ult.Entr.). Corte = 1º dia da janela de 12 meses (DATA.zv.corte).
   Zero venda = sem venda 12m e última entrada ANTES do corte (no estoque há mais de 12 meses).
   Novo inventário sem venda = sem venda 12m e última entrada a partir do corte (no estoque há menos de 12 meses).
   Linhas DATA.zv.rows: [filial, item, desc, saldo qtd, valor, custo unit., dt últ. entrada, última venda na filial (base desde DATA.zv.baseIni), qtd vendida 12m outras filiais, detalhe outras filiais] */
var ZV_COLS = {filial:0, item:1, desc:2, qtd:3, valor:4, custo:5, entr:6, ult:7, outQ:8, outTip:9};
var zvTableState = { sit:'all', search:'', onlyTransf:false, limit:100 };
function zvIso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function zvAddMonths(iso, n){ var d = new Date(iso+'T00:00:00'); d.setMonth(d.getMonth()+n); return zvIso(d); }
function zvAddDays(iso, n){ var d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return zvIso(d); }
function zvMonthsBetween(a, b){ /* meses completos de a até b (ISO) */
  var A = new Date(a+'T00:00:00'), B = new Date(b+'T00:00:00');
  var m = (B.getFullYear()-A.getFullYear())*12 + (B.getMonth()-A.getMonth());
  if (B.getDate() < A.getDate()) m--;
  return Math.max(0, m);
}
function zvRows(){
  var z = DATA.zv || {rows:[]};
  var ref = z.ref;
  return (z.rows||[]).map(function(r){
    var o = {filial:r[0], item:r[1], desc:r[2], qtd:r[3], valor:r[4], custo:r[5], entr:r[6], ult:r[7], outQ:r[8]||0, outTip:r[9]||''};
    o.sit = (o.entr && o.entr < z.corte) ? 'zv' : 'novo';
    o.meses = o.entr ? zvMonthsBetween(o.entr, ref) : null;
    return o;
  });
}
var ZV_SIT = { zv:{label:'Zero venda', cls:'bad', color:'var(--status-critical)'}, novo:{label:'Novo sem venda', cls:'warn', color:'var(--status-warning)'} };
function zvChip(s){ return '<span class="chip '+ZV_SIT[s].cls+'">'+ZV_SIT[s].label+'</span>'; }

function buildZeroVendas(){
  var z = DATA.zv || {rows:[], tot:{}};
  var sel = fSelOrAll('zv','filial');
  var allFil = fIsAll('zv','filial');
  var rows = zvRows().filter(function(r){ return sel.indexOf(r.filial)>=0; });
  var fils = sel.filter(function(f){ return z.tot[f]; });
  var est = 0, nEst = 0, cv = 0;
  fils.forEach(function(f){ est += z.tot[f].total; nEst += z.tot[f].n; cv += z.tot[f].cv; });
  function sum(list){ return list.reduce(function(t,r){ return t+r.valor; }, 0); }
  var zvL = rows.filter(function(r){ return r.sit==='zv'; });
  var nvL = rows.filter(function(r){ return r.sit==='novo'; });
  var zvV = sum(zvL), nvV = sum(nvL);
  var lim90 = zvAddMonths(z.corte, 3);
  var vira = nvL.filter(function(r){ return r.entr < lim90; });
  var transf = rows.filter(function(r){ return r.outQ > 0; });
  function pct(v){ return est ? v/est : 0; }

  var panel = el('div','tab-panel','');
  if (!fils.length){ var cE = chartCard('Zero Vendas', 3); emptyNote(cE.body); panel.appendChild(cE.card); return panel; }

  var kpiRow = el('div','kpi-row');
  kpiRow.style.gridTemplateColumns = 'repeat(auto-fit, minmax(175px,1fr))';
  kpiRow.appendChild(kpiTile('Zero venda (+12 meses)', fmtBRL(zvV,true), fmtNum(zvL.length)+' itens · '+fmtPct(pct(zvV),1)+' do estoque', 'warn'));
  kpiRow.appendChild(kpiTile('Novo inventário sem venda', fmtBRL(nvV,true), fmtNum(nvL.length)+' itens · '+fmtPct(pct(nvV),1)+' · entrada < 12 meses'));
  kpiRow.appendChild(kpiTile('Estoque com venda 12m', fmtBRL(cv,true), fmtPct(pct(cv),1)+' do estoque', 'good'));
  kpiRow.appendChild(kpiTile('Estoque varejo (arm. 01)', fmtBRL(est,true), fmtNum(nEst)+' itens com saldo'));
  kpiRow.appendChild(kpiTile('Vira zero venda em 90 dias', fmtBRL(sum(vira),true), fmtNum(vira.length)+' itens · entrada de '+fmtDateBR(z.corte)+' a '+fmtDateBR(zvAddDays(lim90,-1)), vira.length?'warn':''));
  kpiRow.appendChild(kpiTile('Vendido em outra filial', fmtBRL(sum(transf),true), fmtNum(transf.length)+' itens sem venda aqui · transferência', 'good'));
  panel.appendChild(kpiRow);

  /* composição por filial + aging */
  var byFil = fils.map(function(f){

/* ================= CURVA ABC =================
   Base: Base_Fat. (últimos 12 meses fechados na base).
   Linha = Filial × Item. POP = NFs de venda distintas (Tipo N) − NFs de devolução distintas (Tipo D); itens com POP ≤ 0 ou Qtd. Vds ≤ 0 não são listados.
   Qtd. Vds = qtde vendida − qtde devolvida (Tipo D). Valor e LB líquidos de devolução. */
var ABC_COLS = {filial:0, item:1, desc:2, pop:3, qtd:4, valor:5, lb:6, ult:7, cli:8, dev:9};
var ABC_CRIT = { q:{label:'Quantidade', art:'da quantidade', field:'qtd'}, v:{label:'Valor', art:'do valor', field:'valor'}, l:{label:'Lucro bruto', art:'do lucro bruto', field:'lb'} };
var ABC_COLORS = { A:'var(--status-good)', B:'var(--status-warning)', C:'var(--status-critical)' };
var POP_FAIXAS = [
  {value:'1', label:'POP 1', test:function(p){ return p===1; }},
  {value:'2', label:'POP 2', test:function(p){ return p===2; }},
  {value:'3', label:'POP 3', test:function(p){ return p===3; }},
  {value:'4', label:'POP 4', test:function(p){ return p===4; }},
  {value:'5', label:'POP 5', test:function(p){ return p===5; }},
  {value:'6+', label:'POP 6 ou mais', test:function(p){ return p>=6; }}
];

function abcRows(){
  return ((DATA.abc && DATA.abc.rows) || []).map(function(r){
    return {filial:r[0], item:r[1], desc:r[2], pop:r[3], qtd:r[4], valor:r[5], lb:r[6], ult:r[7], cli:r[8], dev:r[9]||0, meses:r[10]||0, cmv:r[11]||0};
  });
}
/* ---------- Sugestão de compra ----------
   Saldo: Inventário_de_Peças.xlsx, armazém 01 (Peças varejo) da filial. Item ausente no inventário = saldo 0.
   Custo médio: custo do item na filial; sem saldo na filial → custo médio do item na rede; sem estoque na rede → CMV unitário das vendas.
   Demanda mensal = Qtd. Vds 12m ÷ 12.
   Item recorrente = vendeu em 2+ meses diferentes. Item com venda em 1 mês só = "Sob encomenda" (não sugere compra).
   Estoque alvo = demanda mensal × cobertura (meses, ajustável).  Sugestão = arredonda para cima (alvo − saldo), mínimo 0. */
var abcCobertura = 2;
function abcApplyPurchase(rows){
  var inv = (DATA.abc && DATA.abc.inv) || {stock:{}, netcost:{}};
  rows.forEach(function(r){
    var st = inv.stock[r.filial+'|'+r.item];
    r.saldo = st ? st[0] : 0;
    if (st && st[1] > 0){ r.custo = st[1]; r.custoFonte = 'Custo médio da filial'; }
    else if (inv.netcost[r.item] > 0){ r.custo = inv.netcost[r.item]; r.custoFonte = 'Custo médio da rede (sem saldo na filial)'; }
    else if (r.qtd > 0 && r.cmv > 0){ r.custo = r.cmv / r.qtd; r.custoFonte = 'CMV unitário das vendas (sem estoque na rede)'; }
    else { r.custo = 0; r.custoFonte = 'Sem custo'; }
    r.dm = r.qtd / 12;
    r.cobAtual = r.dm > 0 ? r.saldo / r.dm : null;
    var recorrente = r.meses >= 2;
    if (!recorrente){
      r.sug = 0; r.status = 'Sob encomenda';
    } else {
      var alvo = r.dm * abcCobertura;
      r.sug = Math.max(0, Math.ceil(alvo - r.saldo - 1e-9));
      if (r.saldo <= 0) r.status = 'Ruptura';
      else if (r.sug > 0) r.status = 'Comprar';
      else if (r.cobAtual != null && r.cobAtual > abcCobertura * 3) r.status = 'Excesso';
      else r.status = 'OK';
    }
    r.vCompra = r.sug * r.custo;
  });
}
var ABC_STATUS = { 'Ruptura':'bad', 'Comprar':'warn', 'OK':'good', 'Excesso':'info', 'Sob encomenda':'muted' };
function statusChip(s){ return '<span class="chip '+(ABC_STATUS[s]||'muted')+'">'+esc(s)+'</span>'; }
/* classifica A (até 80% acumulado), B (até 95%), C (resto / valores ≤ 0) */
function classifyAbc(rows, field, key){
  var pos = rows.filter(function(r){ return r[field] > 0; }).sort(function(a,b){ return b[field]-a[field]; });
  var total = pos.reduce(function(s,r){ return s+r[field]; },0);
  var cum = 0;
  pos.forEach(function(r){
    var before = total ? cum/total : 1;
    r[key] = before < 0.80 ? 'A' : (before < 0.95 ? 'B' : 'C');
    cum += r[field];
    r[key+'Cum'] = total ? cum/total : 0;
  });
  rows.forEach(function(r){ if (!(r[field] > 0)){ r[key] = 'C'; r[key+'Cum'] = 1; } });
  return {sorted: pos, total: total};
}

function abcChip(c){
  var cls = c==='A' ? 'good' : (c==='B' ? 'warn' : 'bad');
  return '<span class="chip '+cls+'">'+c+'</span>';
}

/* curva de Pareto: % itens (x) × % acumulado do critério (y) */
function paretoChart(body, sorted, field, totalItems){
  if (!sorted.length){ emptyNote(body); return; }
  var W = 760, H = 280, padL = 46, padR = 16, padT = 14, padB = 30;
  var innerW = W-padL-padR, innerH = H-padT-padB;
  var total = sorted.reduce(function(s,r){ return s+r[field]; },0) || 1;
  var n = totalItems || sorted.length;
  function x(f){ return padL + f*innerW; }
  function y(f){ return padT + innerH - f*innerH; }
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('class','viz'); svg.style.height = H+'px';
  function mk(tag, attrs){ var e=document.createElementNS(svgNS,tag); Object.keys(attrs).forEach(function(k){ e.setAttribute(k,attrs[k]); }); svg.appendChild(e); return e; }

  /* faixas A/B/C pelo nº de itens */
  var cntA=0, cntB=0;
  sorted.forEach(function(r){ if (r._cls==='A') cntA++; else if (r._cls==='B') cntB++; });
  var bands = [
    {c:'A', from:0, to:cntA/n},
    {c:'B', from:cntA/n, to:(cntA+cntB)/n},
    {c:'C', from:(cntA+cntB)/n, to:1}
  ];
  bands.forEach(function(b){
    if (b.to<=b.from) return;
    mk('rect',{x:x(b.from), y:padT, width:Math.max(0.5,x(b.to)-x(b.from)), height:innerH, fill:ABC_COLORS[b.c], opacity:'0.09'});
    var t = mk('text',{x:(x(b.from)+x(b.to))/2, y:y(0.06), 'text-anchor':'middle', 'font-size':'12', 'font-weight':'800', fill:ABC_COLORS[b.c]});
    t.textContent = b.c;
  });
  [0,0.25,0.5,0.75,1].forEach(function(g){
    mk('line',{x1:padL, x2:W-padR, y1:y(g), y2:y(g), 'class': g===0?'viz-baseline':'viz-grid-line'});
    var t = mk('text',{x:padL-8, y:y(g)+3.5, 'text-anchor':'end', 'class':'viz-axis-label'}); t.textContent = Math.round(g*100)+'%';
    var tx = mk('text',{x:x(g), y:H-8, 'text-anchor': g===0?'start':(g===1?'end':'middle'), 'class':'viz-axis-label'}); tx.textContent = Math.round(g*100)+'% dos itens';
  });
  [0.8,0.95].forEach(function(g){
    mk('line',{x1:padL, x2:W-padR, y1:y(g), y2:y(g), stroke:'var(--text-muted)', 'stroke-dasharray':'4 4', 'stroke-width':'1'});
  });
  var d = 'M '+x(0)+' '+y(0), cum = 0, pts=[];
  sorted.forEach(function(r,i){ cum += r[field]; var px=x((i+1)/n), py=y(cum/total); d += ' L '+px+' '+py; pts.push({px:px, py:py, r:r, cum:cum/total, i:i}); });
  if (pts.length) d += ' L '+x(1)+' '+pts[pts.length-1].py;
  mk('path',{d:d, fill:'none', stroke:'var(--cat-1)', 'stroke-width':'2.2', 'stroke-linejoin':'round'});
  var dot = mk('circle',{r:'3.5', fill:'var(--cat-1)', opacity:'0'});
  var overlay = mk('rect',{x:padL, y:padT, width:innerW, height:innerH, fill:'transparent'});
  overlay.addEventListener('mousemove', function(evt){
    var rect = svg.getBoundingClientRect();
    var relX = (evt.clientX-rect.left)*(W/rect.width);
    var idx = Math.round(((relX-padL)/innerW)*n)-1;
    idx = Math.max(0, Math.min(pts.length-1, idx));
    var p = pts[idx];
    dot.setAttribute('cx',p.px); dot.setAttribute('cy',p.py); dot.setAttribute('opacity','1');
    showTooltip(evt.clientX, evt.clientY,
      '<div class="viz-tooltip-title">'+(p.i+1)+'º · '+esc(p.r.desc)+'</div>'+
      '<div class="viz-tooltip-row"><span>Filial</span><span class="viz-tooltip-val">'+esc(p.r.filial)+'</span></div>'+
      '<div class="viz-tooltip-row"><span>Classe</span><span class="viz-tooltip-val">'+p.r._cls+'</span></div>'+
      '<div class="viz-tooltip-row"><span>% acumulado</span><span class="viz-tooltip-val">'+fmtPct(p.cum,1)+'</span></div>'+
      '<div class="viz-tooltip-row"><span>% dos itens</span><span class="viz-tooltip-val">'+fmtPct((p.i+1)/n,1)+'</span></div>');
  });
  overlay.addEventListener('mouseleave', function(){ dot.setAttribute('opacity','0'); hideTooltip(); });
  body.appendChild(svg);
}

function fmtBRL2(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtQtd(v){ return (Number(v)||0).toLocaleString('pt-BR',{maximumFractionDigits:2}); }
function fmtDateBR(s){ if (!s) return '—'; var p=String(s).slice(0,10).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : s; }

var abcCritKey = 'v'; /* critério da curva (alternado no próprio gráfico) */
var abcTableState = { sort:'valor', dir:-1, search:'', limit:50, status:null, pop:null };

    if (!fIsAll('abc','pop')){

    var t = '<table class="data-table abc-sum-table"><thead><tr><th>Classe</th><th class="num">Itens</th><th class="num">% itens</th><th class="num">'+esc(cdef.label)+'</th><th class="num">% total</th></tr></thead><tbody>';
    srs.forEach(function(x){
      t += '<tr><td>'+abcChip(x.c)+'</td><td class="num">'+fmtNum(x.n)+'</td><td class="num">'+fmtPct(x.pctN,1)+'</td><td class="num">'+fmtV(x.v)+'</td><td class="num">'+fmtPct(x.pctV,1)+'</td></tr>';
    });
    t += '</tbody><tfoot><tr><td>Total</td><td class="num">'+fmtNum(scope.length)+'</td><td class="num">'+fmtPct(scope.length?1:0,1)+'</td><td class="num">'+fmtV(tot)+'</td><td class="num">'+fmtPct(tot?1:0,1)+'</td></tr></tfoot></table>';
    card.body.appendChild(el('div','chart-scroll', t));
    gSum.appendChild(card.card);
  });
  panel.appendChild(gSum);

  /* ---- Pareto + resumo por classe ---- */
  var g1 = el('div','abc-row');
  var cP = chartCard('Curva ABC por '+crit.label.toLowerCase(), null, '% acumulado × % dos itens');
  var sortedScope = scope.filter(function(r){ return r[crit.field]>0; }).sort(function(a,b){ return b[crit.field]-a[crit.field]; });
  var seg = el('div','abc-seg');
  [['q','Qtd'],['v','Valor'],['l','Lucro']].forEach(function(o){
    var bt = el('button', o[0]===critKey ? 'is-on' : '', o[1]); bt.type='button';

    seg.appendChild(bt);
  });
  cP.card.querySelector('.chart-head').appendChild(seg);
  paretoChart(cP.body, sortedScope, crit.field, scope.length);

  var cS = chartCard('Distribuição por POP', 1);
  var popRows = POP_FAIXAS.map(function(f){
    var rs = rows.filter(function(r){ return f.test(r.pop); });
    return {label:f.label, n:rs.length, q:rs.reduce(function(s,r){ return s+r.valor; },0)};
  });
  var popN = popRows.reduce(function(s,p){ return s+p.n; },0), popQ = popRows.reduce(function(s,p){ return s+p.q; },0);
  var pt = '<table class="data-table abc-sum-table"><thead><tr><th>POP</th><th class="num">Itens</th><th class="num">%</th></tr></thead><tbody>';
  popRows.forEach(function(p){
    var pi = popN? p.n/popN:0, pq = popQ? p.q/popQ:0;
    pt += '<tr><td><span class="abc-track"><span class="abc-bar" style="width:'+Math.max(2,Math.round(pi*100))+'%"></span></span>'+esc(p.label)+'</td><td class="num">'+fmtNum(p.n)+'</td><td class="num">'+fmtPct(pi,1)+'</td></tr>';
  });
  pt += '</tbody><tfoot><tr><td>Total</td><td class="num">'+fmtNum(popN)+'</td><td class="num">'+fmtPct(popN?1:0,1)+'</td></tr></tfoot></table>';
  cS.body.appendChild(el('div','chart-scroll', pt));
  g1.appendChild(cS.card);
  g1.appendChild(cP.card);
  panel.appendChild(g1);

  /* ---- tabela de itens ---- */
  var g3 = el('div','chart-grid');
  var cT = chartCard('Itens', 3, fmtNum(rows.length)+' linhas');
  var tools = el('div','abc-tools');
  var search = el('input','abc-search'); search.type='search'; search.placeholder='Buscar item ou descrição…'; search.value = abcTableState.search;
  tools.appendChild(search);
  tools.appendChild(buildMultiDropdown({
    label:'Status', all:'Todos', plural:'status', light:true,
    options: Object.keys(ABC_STATUS).map(function(k){ return {value:k, label:k}; }),
    get: function(){ return abcTableState.status; },
    set: function(v){ abcTableState.status = v; },
    onChange: function(){ abcTableState.limit = 50; renderTable(); }
  }));
  tools.appendChild(buildMultiDropdown({
    label:'POP', all:'Todos', plural:'faixas', light:true,
    options: POP_FAIXAS.map(function(f){ return {value:f.value, label:f.label}; }),
    get: function(){ return abcTableState.pop; },
    set: function(v){ abcTableState.pop = v; },
    onChange: function(){ abcTableState.limit = 50; renderTable(); }
  }));
  var cobWrap = el('label','abc-cob','Cobertura alvo <input type="number" min="0.5" max="12" step="0.5" value="'+abcCobertura+'"> meses');
  tools.appendChild(cobWrap);
  var expBtn = el('button','btn btn-sm abc-export','<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>Exportar Excel');
  expBtn.type = 'button';
  tools.appendChild(expBtn);
  expBtn.addEventListener('click', function(){ exportAbcExcel(currentList, selFil, expBtn); });
  cT.body.appendChild(tools);
  var summary = el('div','abc-summary');
  cT.body.appendChild(summary);
  function renderSummary(list){
    var rup = list.filter(function(r){ return r.status==='Ruptura'; }).length;
    var comp = list.filter(function(r){ return r.sug>0; });
    var vc = comp.reduce(function(s,r){ return s+r.vCompra; },0);
    var exc = list.filter(function(r){ return r.status==='Excesso'; }).length;
    summary.innerHTML =
      '<div><span>Itens em ruptura</span><b class="t-bad">'+fmtNum(rup)+'</b></div>'+
      '<div><span>Itens a comprar</span><b>'+fmtNum(comp.length)+'</b></div>'+
      '<div><span>Valor de compra previsto</span><b>'+fmtBRL(vc)+'</b></div>'+
      '<div><span>Itens em excesso</span><b>'+fmtNum(exc)+'</b></div>';
  }
  cobWrap.querySelector('input').addEventListener('change', function(e){
    var v = parseFloat(String(e.target.value).replace(',','.'));
    if (!(v > 0)) return;
    abcCobertura = v; abcApplyPurchase(rows); renderTable();
  });
  var tableHost = el('div');
  cT.body.appendChild(tableHost);
  g3.appendChild(cT.card);
  panel.appendChild(g3);

  var COLS = [
    {key:'filial', label:'Filial'},
    {key:'item', label:'Item'},
    {key:'desc', label:'Descrição', cls:'abc-desc'},
    {key:'abcQ', label:'ABC Qtd', chip:true},
    {key:'abcV', label:'ABC Valor', chip:true},
    {key:'abcL', label:'ABC Lucro', chip:true},
    {key:'pop', label:'POP', num:true, fmt:fmtNum},
    {key:'meses', label:'Meses c/ venda', num:true, fmt:fmtNum},
    {key:'qtd', label:'Qtd. Vds', num:true, fmt:fmtQtd},
    {key:'saldo', label:'Saldo atual', num:true, fmt:function(v){ return v ? fmtQtd(v) : '0'; }},
    {key:'custo', label:'Custo médio', num:true, fmt:function(v){ return v ? fmtBRL2(v) : '–'; }, titleKey:'custoFonte'},
    {key:'cobAtual', label:'Cobertura (meses)', num:true, fmt:function(v){ return v==null ? '–' : v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}); }},
    {key:'sug', label:'Sugestão compra', num:true, fmt:function(v){ return v ? fmtQtd(v) : '–'; }, strong:true},
    {key:'vCompra', label:'Valor compra', num:true, fmt:function(v){ return v ? fmtBRL(v) : '–'; }, strong:true},
    {key:'status', label:'Status', status:true},
    {key:'valor', label:'Faturamento', num:true, fmt:function(v){return fmtBRL(v);}},
    {key:'lb', label:'Lucro bruto', num:true, fmt:function(v){return fmtBRL(v);}},
    {key:'pctlb', label:'% LB', num:true, fmt:function(v){return fmtPct(v,1);}},

  function renderTable(){
    var q = abcTableState.search.trim().toLowerCase();
    var list = q ? rows.filter(function(r){ return (r.item+' '+r.desc).toLowerCase().indexOf(q)>=0; }) : rows.slice();
    if (abcTableState.status != null) list = list.filter(function(r){ return abcTableState.status.indexOf(r.status)>=0; });
    if (abcTableState.pop != null){ var fxs = POP_FAIXAS.filter(function(f){ return abcTableState.pop.indexOf(f.value)>=0; }); list = list.filter(function(r){ return fxs.some(function(f){ return f.test(r.pop); }); }); }
    renderSummary(list);
    currentList = list;
    var nEl = cT.card.querySelector('.chart-title .n'); if (nEl) nEl.textContent = fmtNum(list.length)+' linhas';
    var k = abcTableState.sort, dir = abcTableState.dir;
    list.sort(function(a,b){
      var va=a[k], vb=b[k];
      if (typeof va==='string' || typeof vb==='string') return String(va||'').localeCompare(String(vb||''),'pt-BR')*dir;
      return ((va||0)-(vb||0))*dir;
    });
    var shown = list.slice(0, abcTableState.limit);
    var h = '<div class="chart-scroll abc-table-scroll"><table class="data-table abc-table"><thead><tr>';
    COLS.forEach(function(c){
      var arrow = c.key===k ? (dir<0?' ▼':' ▲') : '';
      h += '<th class="'+(c.num?'num ':'')+'sortable" data-k="'+c.key+'">'+esc(c.label)+arrow+'</th>';
    });
    h += '</tr></thead><tbody>';
    shown.forEach(function(r){
      h += '<tr>';
      COLS.forEach(function(c){
        var v = r[c.key];
        if (c.chip) h += '<td>'+abcChip(v)+'</td>';
        else if (c.status) h += '<td>'+statusChip(v)+'</td>';
        else if (c.titleKey) h += '<td class="num" title="'+esc(r[c.titleKey])+'">'+esc(c.fmt(v))+'</td>';
        else if (c.strong) h += '<td class="num abc-strong">'+esc(c.fmt(v))+'</td>';
        else if (c.cls) h += '<td class="'+c.cls+'" title="'+esc(v)+'">'+esc(v)+'</td>';
        else h += '<td'+(c.num?' class="num"':'')+'>'+esc(c.fmt? c.fmt(v) : v)+'</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    if (!list.length) h = '<div class="chart-empty">Nenhum item encontrado.</div>';
    tableHost.innerHTML = h;
    if (list.length > shown.length){
      var more = el('button','btn btn-sm abc-more','Mostrar mais ('+fmtNum(list.length-shown.length)+' restantes)');
      more.type='button';
      more.addEventListener('click', function(){ abcTableState.limit += 100; renderTable(); });
      tableHost.appendChild(more);
    }
    tableHost.querySelectorAll('th.sortable').forEach(function(th){
      th.addEventListener('click', function(){
        var key = th.getAttribute('data-k');
        if (abcTableState.sort===key) abcTableState.dir *= -1;
        else { abcTableState.sort = key; abcTableState.dir = (key==='filial'||key==='item'||key==='desc'||key==='status'||key.indexOf('abc')===0) ? 1 : -1; }
        renderTable();
      });
    });
  }
  var currentList = [];
  var searchTimer = null;
  search.addEventListener('input', function(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){ abcTableState.search = search.value; abcTableState.limit = 50; renderTable(); }, 150);
  });
  renderTable();

  return panel;
}

/* exporta a tabela de itens (linhas filtradas, na ordem atual) para .xlsx */
function exportAbcExcel(list, selFil, btn){
  if (typeof XLSX === 'undefined'){ showToast('Não foi possível carregar o gerador de Excel (sem conexão com a internet?).', true); return; }
  if (!list || !list.length){ showToast('Nenhuma linha para exportar com os filtros atuais.', true); return; }
  var head = ['Filial','Item','Descrição','ABC Qtd','ABC Valor','ABC Lucro','POP','Meses c/ venda','Qtd. Vds','Saldo atual','Custo médio','Cobertura (meses)','Sugestão compra','Valor compra','Status','Faturamento','Lucro bruto','% LB','Última venda'];
  var aoa = [head];
  list.forEach(function(r){
    aoa.push([r.filial, r.item, r.desc, r.abcQ, r.abcV, r.abcL, r.pop, r.meses, r.qtd, r.saldo, r.custo ? Math.round(r.custo*100)/100 : null,
      r.cobAtual==null ? null : Math.round(r.cobAtual*10)/10, r.sug, Math.round(r.vCompra*100)/100, r.status,
      Math.round(r.valor*100)/100, Math.round(r.lb*100)/100, Math.round(r.pctlb*10000)/10000, fmtDateBR(r.ult)]);
  });
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  var fmts = {10:'#,##0.00', 13:'#,##0.00', 15:'#,##0.00', 16:'#,##0.00', 17:'0.0%', 11:'0.0', 8:'#,##0.##', 9:'#,##0.##'};
  for (var R=1; R<aoa.length; R++){
    Object.keys(fmts).forEach(function(c){ var ref = XLSX.utils.encode_cell({r:R, c:+c}); if (ws[ref] && typeof ws[ref].v==='number') ws[ref].z = fmts[c]; });
  }
  ws['!cols'] = [12,16,48,8,9,9,6,9,10,10,12,11,11,13,14,14,14,8,12].map(function(w){ return {wch:w}; });
  ws['!autofilter'] = {ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:aoa.length-1, c:head.length-1}})};

/* recalcula DATA.abc a partir das linhas da Base_Fat. (usado no botão Atualizar dados) */
function computeAbcFromAoa(faoa, headerRowIdx, header){
  var ix = function(n){ return header.indexOf(n); };
  var iLoja=ix('Loja'), iAM=ix('Ano_Mes'), iTipo=ix('Tipo'), iNf=ix('N.Nf'), iSerie=ix('Serie'), iProd=ix('Produto'),
      iDesc=ix('Desc. Produto'), iQ=ix('Qtde.'), iV=ix('Valor'), iLB=ix('LB'), iDt=ix('Datas'), iCli=ix('Cliente'), iCMV=ix('CMV');
  if (iProd<0 || iLoja<0 || iAM<0) return null;
  var maxM = null;
  for (var r=headerRowIdx+1; r<faoa.length; r++){ var row=faoa[r]; if (!row) continue; var mk=excelMonthKey(row[iAM]); if (mk && (!maxM || mk>maxM)) maxM=mk; }
  if (!maxM) return null;
  var win = {}, y=+maxM.slice(0,4), m=+maxM.slice(5,7), list=[];
  for (var i=0;i<12;i++){ var mm=m-i, yy=y; while(mm<=0){ mm+=12; yy--; } var k=yy+'-'+String(mm).padStart(2,'0'); win[k]=1; list.push(k); }
  function num(v){ if (typeof v==='number') return v; var n=parseFloat(String(v==null?'':v).replace(',','.')); return isNaN(n)?0:n; }
  function dstr(v){ if (v instanceof Date && !isNaN(v)) return v.getUTCFullYear()+'-'+String(v.getUTCMonth()+1).padStart(2,'0')+'-'+String(v.getUTCDate()).padStart(2,'0'); return String(v==null?'':v).slice(0,10); }
  var acc = {};
  for (var r2=headerRowIdx+1; r2<faoa.length; r2++){
    var row2 = faoa[r2]; if (!row2) continue;
    var fil = row2[iLoja], mk2 = excelMonthKey(row2[iAM]);
    if (!fil || !mk2 || !win[mk2]) continue;
    var prod = String(row2[iProd]==null?'':row2[iProd]).trim(); if (!prod) continue;
    var key = fil+'\u0001'+prod;
    var a = acc[key] || (acc[key] = {fil:fil, prod:prod, desc:String(row2[iDesc]==null?'':row2[iDesc]).trim(), nf:{}, dv:{}, q:0, v:0, lb:0, c:0, ult:'', cli:{}, m:{}});
    var q = num(row2[iQ]);
    if (row2[iTipo]==='D'){ a.q -= q; a.dv[String(row2[iSerie]==null?'':row2[iSerie]).trim()+'|'+String(row2[iNf]==null?'':row2[iNf]).trim()] = 1; }
    else {
      a.q += q;
      a.nf[String(row2[iSerie]==null?'':row2[iSerie]).trim()+'|'+String(row2[iNf]==null?'':row2[iNf]).trim()] = 1;
      a.cli[String(row2[iCli]==null?'':row2[iCli]).trim()] = 1;
      a.m[mk2] = 1;
      var ds = dstr(row2[iDt]); if (ds > a.ult) a.ult = ds;
    }
    a.v += num(row2[iV]); a.lb += num(row2[iLB]); if (iCMV>=0) a.c += num(row2[iCMV]);
  }
  var rows = [];
  Object.keys(acc).forEach(function(k){
    var a = acc[k], nVend = Object.keys(a.nf).length, nDev = Object.keys(a.dv).length;
    if (!nVend) return;
    var pop = nVend - nDev;
    if (pop <= 0 || a.q <= 0) return;
    rows.push([a.fil, a.prod, a.desc, pop, Math.round(a.q*100)/100, Math.round(a.v*100)/100, Math.round(a.lb*100)/100, a.ult, Object.keys(a.cli).length, nDev, Object.keys(a.m).length, Math.round(a.c*100)/100]);
  });
  rows.sort(function(p,q){ return q[5]-p[5]; });
  list.sort();
  return {ini:list[0], fim:list[list.length-1], rows:rows, inv:{stock:{}, netcost:{}}};
}

function niceCeil(v){
  if (v <= 0) return 1;
  var exp = Math.floor(Math.log10(v));
  var base = Math.pow(10, exp);
  var frac = v/base;
  var niceFrac = frac<=1?1:frac<=2?2:frac<=5?5:10;
  return niceFrac*base;
}

/* ---- Line / area chart (time series) ---- */
function renderLineChart(container, points, opts){
  opts = opts || {};

  var svgH = plotH + marginT + marginB;
  var maxVal = Math.max.apply(null, points.map(function(p){ return p.y; }));
  var niceMax = niceCeil(maxVal||1);
  var svg = svgEl('svg', { class:'viz', viewBox:'0 0 '+svgW+' '+svgH });
  svg.style.height = Math.round(svgH * ((container.clientWidth||600)/svgW)) + 'px';

  var ticks = 4;
  for (var t=0;t<=ticks;t++){
    var val = niceMax*t/ticks;
    var y = marginT + plotH - (val/niceMax)*plotH;
    svg.appendChild(svgEl('line', { x1:marginL, x2:marginL+plotW, y1:y, y2:y, class: t===0?'viz-baseline':'viz-grid-line' }));
    var lab = svgEl('text', { x:marginL-8, y:y+3, 'text-anchor':'end', class:'viz-axis-label' });

  function yAt(v){ return marginT + plotH - (v/niceMax)*plotH; }

  var color = resolveVar(opts.color || 'var(--cat-1)');
  var d = '';
  points.forEach(function(p,i){ d += (i===0?'M':'L') + xAt(i).toFixed(1) + ' ' + yAt(p.y).toFixed(1) + ' '; });
  var areaD = d + 'L' + xAt(n-1).toFixed(1) + ' ' + (marginT+plotH) + ' L' + xAt(0).toFixed(1) + ' ' + (marginT+plotH) + ' Z';
  svg.appendChild(svgEl('path', { d:areaD, fill:color, opacity:0.1, stroke:'none' }));
  svg.appendChild(svgEl('path', { d:d, fill:'none', stroke:color, 'stroke-width':2, 'stroke-linejoin':'round', 'stroke-linecap':'round' }));

  // x ticks (sparse)
  var maxTicks = 8;
  var everyIdx = Math.max(1, Math.ceil(n/maxTicks));
  points.forEach(function(p,i){
    if (i%everyIdx===0 || i===n-1){
      var lab = svgEl('text', { x:xAt(i), y: marginT+plotH+20, 'text-anchor':'middle', class:'viz-axis-label' });
      lab.textContent = p.xLabel;
      svg.appendChild(lab);
    }
  });

  // crosshair + hover
  var crosshair = svgEl('line', { x1:0, x2:0, y1:marginT, y2:marginT+plotH, class:'viz-grid-line', style:'opacity:0; stroke: var(--text-muted); stroke-dasharray:2,3;' });
  svg.appendChild(crosshair);
  var dot = svgEl('circle', { r:4.5, fill:color, stroke:resolveVar('var(--surface)'), 'stroke-width':2, style:'opacity:0' });
  svg.appendChild(dot);
  var hitRect = svgEl('rect', { x:marginL, y:marginT, width:plotW, height:plotH, fill:'transparent', style:'cursor:crosshair' });
  svg.appendChild(hitRect);

  hitRect.addEventListener('pointermove', function(ev){
    var rect = svg.getBoundingClientRect();
    var relX = (ev.clientX - rect.left) / rect.width * svgW;
    var i = clamp(Math.round((relX - marginL)/stepX), 0, n-1);
    crosshair.setAttribute('x1', xAt(i)); crosshair.setAttribute('x2', xAt(i));
    crosshair.style.opacity = 1;
    dot.setAttribute('cx', xAt(i)); dot.setAttribute('cy', yAt(points[i].y)); dot.style.opacity = 1;
    showTooltip(ev.clientX, ev.clientY, ttBox(points[i].xLabel, [ ttRow(color, opts.unitLabel||'Total', fmtValue(points[i].y)) ]));
  });
  hitRect.addEventListener('pointerleave', function(){ crosshair.style.opacity=0; dot.style.opacity=0; hideTooltip(); });

  container.appendChild(svg);
}

/* ---- Generic table renderer (accessibility: table view of a chart's data) ---- */
function renderTable(container, columns, rows){
  container.innerHTML = '';
  var wrap = el('div', { class:'chart-scroll' });
  var table = el('table', { class:'data-table' });
  var thead = el('thead');
  var htr = el('tr');
  columns.forEach(function(c){ htr.appendChild(el('th', { text:c.label })); });
  thead.appendChild(htr); table.appendChild(thead);
  var tbody = el('tbody');
  rows.forEach(function(r){
    var tr = el('tr');
    columns.forEach(function(c){
      var td = el('td', { class: c.num?'num':'' });
      td.textContent = c.format ? c.format(r[c.key]) : r[c.key];
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  container.appendChild(wrap);
}

/* ---- Ranked "quadro" table: rank, label, proportional bar, value, % ---- */
function renderRankTable(container, data, opts){
  opts = opts || {};
  container.innerHTML = '';
  if (!data.length){ container.appendChild(el('div',{class:'chart-empty', text:'Sem dados para os filtros selecionados.'})); return; }
  var fmtValue = opts.formatValue || fmtNum;
  var maxVal = Math.max.apply(null, data.map(function(d){ return d.value; }));
  var wrap = el('div', { class:'chart-scroll' });
  var table = el('div', { class:'rank-table' });
  data.forEach(function(d, i){
    var row = el('div', { class:'rank-row' });
    row.appendChild(el('div', { class:'rank-rank', text:String(i+1) }));
    row.appendChild(el('div', { class:'rank-label', title:d.label, text:d.label }));
    var track = el('div', { class:'rank-bar-track' });
    track.appendChild(el('div', { class:'rank-bar-fill', style:'width:'+(maxVal ? (d.value/maxVal*100) : 0)+'%' }));
    row.appendChild(track);
    row.appendChild(el('div', { class:'rank-value', text:fmtValue(d.value) }));
    if (opts.showPct){
      row.appendChild(el('div', { class:'rank-pct', text:fmtPct(d.pct,1) }));
    }
    row.addEventListener('pointermove', function(ev){
      var rows = [ ttRow(resolveVar('var(--status-good)'), opts.unitLabel||'Valor', fmtValue(d.value)) ];
      if (opts.showPct) rows.push(ttRow(null, '% do total', fmtPct(d.pct,1)));
      showTooltip(ev.clientX, ev.clientY, ttBox(d.label, rows));
    });
    row.addEventListener('pointerleave', hideTooltip);
    table.appendChild(row);
  });
  wrap.appendChild(table);
  container.appendChild(wrap);
}

var openDropdown = null;
function closeOpenDropdown(){
  if (openDropdown){ openDropdown.panel.remove(); openDropdown.btn.classList.remove('is-active'); openDropdown = null; }
}
document.addEventListener('pointerdown', function(ev){
  if (openDropdown && !openDropdown.root.contains(ev.target)) closeOpenDropdown();
});

function buildMultiSelectFilter(dim){
  var options = DICTS[dim.dict];
  function dispLabel(raw){ return dim.displayLabel ? dim.displayLabel(raw) : raw; }
  var wrap = el('div', { class:'filter-group' });
  wrap.appendChild(el('div', { class:'filter-label', text: dim.label+':' }));
  var control = el('div', { class:'filter-control' });
  var btn = el('button', { type:'button', class:'filter-btn' });
  var valueSpan = el('span', { class:'filter-value is-placeholder', text:'Todos' });
  btn.appendChild(valueSpan);
  var badge = el('span', { class:'count-badge hidden' });
  btn.appendChild(badge);
  btn.appendChild(el('span', { class:'chev', html:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>' }));
  control.appendChild(btn);
  wrap.appendChild(control);

  function refreshLabel(){
    var sel = filters[dim.key];
    if (!sel.size){ valueSpan.textContent = 'Todos'; valueSpan.classList.add('is-placeholder'); badge.classList.add('hidden'); }
    else {
      valueSpan.classList.remove('is-placeholder');
      if (sel.size===1){ valueSpan.textContent = dispLabel(options[Array.from(sel)[0]]); badge.classList.add('hidden'); }
      else { valueSpan.textContent = sel.size + ' selecionados'; badge.classList.add('hidden'); }
    }
  }
  refreshLabel();

  btn.addEventListener('click', function(){
    if (openDropdown && openDropdown.btn === btn){ closeOpenDropdown(); return; }
    closeOpenDropdown();
    var panel = el('div', { class:'dropdown-panel' });
    var needsSearch = options.length > 7;
    var search = null;
    if (needsSearch){
      search = el('input', { class:'dropdown-search', placeholder:'Buscar '+dim.label.toLowerCase()+'…', type:'text' });
      panel.appendChild(search);
    }
    var list = el('div', { class:'dropdown-list' });
    panel.appendChild(list);

    // counts among rows passing every OTHER active filter (not this one) — feedback like a real slicer
    var otherIdx = computeFilteredIdxExcept(dim.key);
    var counts = aggregateCount(otherIdx, ROWS[dim.key]);

    function draw(filterText){
      list.innerHTML = '';
      var order = options.map(function(_,i){return i;});
      order.sort(function(a,b){ return (counts.get(b)||0) - (counts.get(a)||0); });
      var shown = 0;
      order.forEach(function(i){
        var label = dispLabel(options[i]);
        if (filterText && label.toLowerCase().indexOf(filterText)===-1) return;
        var c = counts.get(i)||0;
        shown++;
        var row = el('label', { class:'dropdown-item' });
        var cb = el('input', { type:'checkbox' });
        cb.checked = filters[dim.key].has(i);
        cb.addEventListener('change', function(){
          if (cb.checked) filters[dim.key].add(i); else filters[dim.key].delete(i);
          refreshLabel();
          renderAll();
        });
        row.appendChild(cb);
        var lbl = el('span', { class:'lbl' }); lbl.textContent = label;
        row.appendChild(lbl);
        var n = el('span', { class:'n' }); n.textContent = fmtInt(c);
        row.appendChild(n);
        list.appendChild(row);
      });
      if (!shown) list.appendChild(el('div', { class:'dropdown-empty', text:'Nada encontrado.' }));
    }
    draw('');
    if (search) search.addEventListener('input', function(){ draw(search.value.toLowerCase()); });

    var foot = el('div', { class:'dropdown-foot' });
    var clearBtn = el('button', { type:'button', class:'btn btn-ghost btn-sm', text:'Limpar' });
    clearBtn.addEventListener('click', function(){ filters[dim.key].clear(); refreshLabel(); renderAll(); draw(search?search.value.toLowerCase():''); });
    var doneBtn = el('button', { type:'button', class:'btn btn-primary btn-sm', text:'Aplicar' });
    doneBtn.addEventListener('click', closeOpenDropdown);
    foot.appendChild(clearBtn); foot.appendChild(doneBtn);
    panel.appendChild(foot);

    control.appendChild(panel);
    btn.classList.add('is-active');
    openDropdown = { root:control, panel:panel, btn:btn };
    if (search) search.focus();
  });

  return wrap;
}

function computeFilteredIdxExcept(exceptKey){
  var out = [];
  var useDate = filters.datePreset !== 'all' && filters.dateFrom && filters.dateTo;
  for (var i=0;i<N;i++){
    if (exceptKey!=='filial' && filters.filial.size && !filters.filial.has(ROWS.filial[i])) continue;
    if (exceptKey!=='tipo' && filters.tipo.size && !filters.tipo.has(ROWS.tipo[i])) continue;
    if (exceptKey!=='comprador' && filters.comprador.size && !filters.comprador.has(ROWS.comprador[i])) continue;
    if (exceptKey!=='origem' && filters.origem.size && !filters.origem.has(ROWS.origem[i])) continue;
    if (exceptKey!=='status' && filters.status.size && !filters.status.has(ROWS.status[i])) continue;
    if (exceptKey!=='situacEntrega' && filters.situacEntrega.size && !filters.situacEntrega.has(ROWS.situacEntrega[i])) continue;
    if (exceptKey!=='setor' && filters.setor.size && !filters.setor.has(ROWS.setor[i])) continue;
    if (useDate){
      var di = ROWS.date[i];
      if (di < 0) continue;
      var ds = DATES[di];
      if (ds < filters.dateFrom || ds > filters.dateTo) continue;
    }
    out.push(i);
  }
  if (exceptKey !== 'pop' && filters.pop.size){
    var popCounts2 = computeProdutoPopCounts(out);
    out = out.filter(function(i){ return popMatchesFilter(popCounts2.get(ROWS.produto[i])||0, filters.pop); });
  }
  return out;
}

function setKpi(key, value, sub, warn){

function daysBetweenIso(aIso, bIso){
  var a = new Date(aIso+'T00:00:00'), b = new Date(bIso+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function renderKpis(idx){
  var total = 0, itens = idx.length;
  var pedidoSet = new Set();
  var bloqueadoPedidoSet = new Set();
  var bloqueadoLinhas = 0;
  var leadLogSum = 0, leadLogN = 0;
  var leadComprasSum = 0, leadComprasN = 0;
  var leadClassSum = 0, leadClassN = 0;
  var todayStr = todayISO();
  for (var j=0;j<idx.length;j++){
    var i = idx[j];
    total += ROWS.total[i];
    pedidoSet.add(ROWS.pedido[i]);
    if (DICTS.status[ROWS.status[i]] === 'Bloqueado'){
      bloqueadoPedidoSet.add(ROWS.pedido[i]);
      bloqueadoLinhas++;
    }
    // Lead Time Classificação: só pedidos com NF emitida E data de
    // digitação da NF. Digitação → classificação; se a classificação
    // ainda não existir, usa a data de hoje.
    var hasDigit = ROWS.dateDigit[i] >= 0;
    var digitStr = hasDigit ? DATES_DIGIT[ROWS.dateDigit[i]] : null;
    if (ROWS.dateNf[i] >= 0 && hasDigit){
      var classfStrForClass = ROWS.dateClassf[i] >= 0 ? DATES_CLASSF[ROWS.dateClassf[i]] : todayStr;
      var dClass = daysBetweenIso(digitStr, classfStrForClass);
      if (dClass >= 0){ leadClassSum += dClass; leadClassN++; }
    }
    // Lead Time Logístico (cascading, per pedido) — Data NF → Data Recebimento:
    //   1) digitação da NF (recebimento) − NF, quando as duas datas existem
    //   2) hoje − NF, quando só falta a data de digitação (aguardando)
    //   3) hoje − data do pedido, quando nem a NF foi emitida ainda
    // Lead Time Compras: data do pedido → classificação (usa hoje quando
    // falta a classificação; a data do pedido praticamente nunca falta).
    // Correção de consistência: em ~42% da base a DATA_NF vem registrada
    // antes da DATA_PC (vínculo de nota anterior ao pedido no sistema de
    // origem). Nesses casos a NF é tratada como se fosse na mesma data do
    // pedido só para este cálculo, evitando picos artificiais no lead time
    // logístico causados por essa inconsistência de datas.
    var pcStr = ROWS.date[i] >= 0 ? DATES[ROWS.date[i]] : todayStr;
    var hasNf = ROWS.dateNf[i] >= 0;
    var hasClassf = ROWS.dateClassf[i] >= 0;
    var nfStr = hasNf ? DATES_NF[ROWS.dateNf[i]] : null;
    var classfStr = hasClassf ? DATES_CLASSF[ROWS.dateClassf[i]] : null;
    if (hasNf && nfStr < pcStr) nfStr = pcStr;

    var dLog;
    if (hasNf && hasDigit) dLog = daysBetweenIso(nfStr, digitStr);
    else if (hasNf) dLog = daysBetweenIso(nfStr, todayStr);
    else dLog = daysBetweenIso(pcStr, todayStr);
    if (dLog >= 0){ leadLogSum += dLog; leadLogN++; }

    var dCompras = daysBetweenIso(pcStr, classfStr || todayStr);
    if (dCompras >= 0){ leadComprasSum += dCompras; leadComprasN++; }
  }
  var pedidos = pedidoSet.size;
  setKpi('pedidos', fmtInt(pedidos), itens ? (fmtInt(itens)+' itens no período') : '');
  setKpi('total', fmtCompactBRL(total), pedidos ? (fmtInt(pedidos)+' pedidos') : '');
  setKpi('ticket', fmtBRL2(pedidos ? total/pedidos : 0), 'valor total ÷ nº de pedidos');
  setKpi('itens', fmtInt(itens), 'linhas de item compradas');
  var bloqueadoPedidos = bloqueadoPedidoSet.size;
  var blocPct = pedidos ? bloqueadoPedidos/pedidos : 0;

function csvEscape(v){
  v = (v==null) ? '' : String(v);
  if (/[;"\n\r]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';

}
function buildDetailCsv(idx){
  var lines = [ DETAIL_COLUMNS.map(function(c){ return csvEscape(c.label); }).join(';') ];

var EXPECTED_HEADERS = ['C7_FILIAL','DESCR_FIL','STATUS_PC','SITUAC_PC','SITUAC_ENTREGA','C7_NUM','ITEM_PC','C7_FORNECE','C7_LOJA','NOME_FORNEC','COD_PRODUTO','DESC_PRODUTO','QTDE','TOTAL','COND_PGTO','PRIMEIRO_VENCTO','SALDO_STK','SET_COMPRAS','NUM_SC','SOLICITANTE','NOME_COMPRADOR','NOME_REDUZ_COMPRADOR','DATA_SC','DATA_PC','PREV_ENTREGA','DATA_NF','DATA_DIGIT_NF','DATA_CLASSF','TEMPO_SCxPC','TEMPO_LOG','TEMPO_CLASSF_NF','TIPO_COMPRA','ARMAZEM','SETOR','CONTA_CTB'];

function decodeFileBuffer(buf){
  // Try strict UTF-8 first; TOTVS exports are usually ISO-8859-1/Windows-1252.
  try {
    var utf8 = new TextDecoder('utf-8', { fatal:true }).decode(buf);
    return utf8;
  } catch(e){
    return new TextDecoder('iso-8859-1').decode(buf);
  }
}

function parseCsvText(text){
  // Semicolon-delimited, CRLF or LF, minimal quote support.
  var lines = text.split(/\r\n|\n|\r/);
  while (lines.length && lines[lines.length-1].trim()==='') lines.pop();
  if (!lines.length) return { headers:[], rows:[] };
  function splitLine(line){
    var out = []; var cur=''; var inQ=false;
    for (var i=0;i<line.length;i++){
      var c = line[i];
      if (inQ){
        if (c === '"'){ if (line[i+1]==='"'){ cur+='"'; i++; } else { inQ=false; } }
        else cur += c;
      } else {
        if (c === '"') inQ = true;
        else if (c === ';') { out.push(cur); cur=''; }
        else cur += c;
      }
    }
    out.push(cur);
    return out;
  }
  var headers = splitLine(lines[0]).map(function(h){ return h.trim(); });
  var rows = [];
  for (var i=1;i<lines.length;i++){
    if (lines[i].trim()==='') continue;
    rows.push(splitLine(lines[i]));
  }
  return { headers:headers, rows:rows };
}

function parseBrNumber(s){
  if (s==null) return 0;
  s = String(s).trim();
  if (!s) return 0;
  if (s.indexOf(',') !== -1) s = s.replace(/\./g,'').replace(',', '.');
  var v = parseFloat(s);
  return isNaN(v) ? 0 : v;
}
function parseIntSafe(s){
  var v = parseBrNumber(s);
  return isNaN(v) ? 0 : Math.trunc(v);
}
function parseDateIso(s){
  if (!s) return null;
  var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s).trim());
  if (!m) return null;
  var year = parseInt(m[3],10);
  if (year < 2000 || year > 2100) return null;
  return m[3] + '-' + m[2] + '-' + m[1];
}

function normalizeFilialCode(code){
  // C7_FILIAL no CSV vem sem zero à esquerda (ex.: "10102"), mas o mapa de
  // filiais é cadastrado com 6 dígitos (ex.: "010102"). Normaliza os dois
  // lados removendo zeros à esquerda antes de comparar.
  code = String(code==null?'':code).trim();
  var stripped = code.replace(/^0+/, '');
  return stripped === '' ? '0' : stripped;
}
function buildNormalizedFilialMap(filialMap){
  var norm = {};
  if (filialMap){
    Object.keys(filialMap).forEach(function(k){ norm[normalizeFilialCode(k)] = filialMap[k]; });
  }
  return norm;
}
function buildCompactDataFromCsv(headers, rows, filialMap){
  var idxOf = {};
  headers.forEach(function(h,i){ idxOf[h.toUpperCase()] = i; });
  var normFilialMap = buildNormalizedFilialMap(filialMap);
  var missing = EXPECTED_HEADERS.filter(function(h){ return !(h in idxOf); });
  if (missing.length > 6){
    throw new Error('Cabeçalho não reconhecido. Colunas ausentes: ' + missing.slice(0,6).join(', ') + (missing.length>6?'…':'') + '. Confirme se o arquivo veio da VIEW de compras.');
  }
  function get(row, name){ var i = idxOf[name]; return i==null ? '' : (row[i]||''); }

  var dictKeys = ['filial','status','situacPc','situacEntrega','origem','tipo','armazem','setor','contaCtb','fornec','comprador','produto','condPgto'];
  var dictMaps = {}; dictKeys.forEach(function(k){ dictMaps[k] = new Map(); });
  function dictIdx(key, value){
    value = (value==null || value==='') ? '(Não informado)' : String(value).trim();
    var m = dictMaps[key];
    if (!m.has(value)) m.set(value, m.size);
    return m.get(value);
  }

  var dateMap = new Map();
  function dateIdx(iso){ if (!iso) return -1; if (!dateMap.has(iso)) dateMap.set(iso, dateMap.size); return dateMap.get(iso); }
  var dateNfMap = new Map();
  function dateNfIdx(iso){ if (!iso) return -1; if (!dateNfMap.has(iso)) dateNfMap.set(iso, dateNfMap.size); return dateNfMap.get(iso); }
  var dateClassfMap = new Map();
  function dateClassfIdx(iso){ if (!iso) return -1; if (!dateClassfMap.has(iso)) dateClassfMap.set(iso, dateClassfMap.size); return dateClassfMap.get(iso); }
  var dateDigitMap = new Map();
  function dateDigitIdx(iso){ if (!iso) return -1; if (!dateDigitMap.has(iso)) dateDigitMap.set(iso, dateDigitMap.size); return dateDigitMap.get(iso); }
  var dateEntregaMap = new Map();
  function dateEntregaIdx(iso){ if (!iso) return -1; if (!dateEntregaMap.has(iso)) dateEntregaMap.set(iso, dateEntregaMap.size); return dateEntregaMap.get(iso); }
  var pedMap = new Map();
  function pedIdx(v){ if (!pedMap.has(v)) pedMap.set(v, pedMap.size); return pedMap.get(v); }
  // SOLICITANTE fica fora do sistema genérico de dicts porque a aba Tarefas
  // precisa saber se o valor original era realmente vazio (para liberar
  // edição) — dictIdx() normal substitui vazio por "(Não informado)".
  var solicMap = new Map();
  function solicIdx(value){
    value = String(value==null?'':value).trim();
    if (!solicMap.has(value)) solicMap.set(value, solicMap.size);
    return solicMap.get(value);
  }

  function parseDateStrict(s){
    // like parseDateIso, but keeps year bound at 2024-2100 (for lead-time math, not display)
    var iso = parseDateIso(s);
    if (!iso) return null;
    var y = parseInt(iso.slice(0,4),10);
    if (y < 2024) return null;
    return iso;
  }

  // DATA_NF / DATA_CLASSF are kept as their own date pools (not precomputed
  // day-diffs) so the two lead-time KPIs can be computed live in the
  // browser against "today", mirroring build_data.py.
  var out = { filial:[], status:[], situacPc:[], situacEntrega:[], origem:[], tipo:[], armazem:[], setor:[], contaCtb:[], fornec:[], comprador:[], produto:[], condPgto:[], total:[], qtde:[], saldo:[], tempoSC:[], tempoLog:[], tempoClassf:[], date:[], dateNf:[], dateClassf:[], dateDigit:[], dateEntrega:[], pedido:[], solicitante:[] };

  rows.forEach(function(row){
    var filialCode = get(row,'C7_FILIAL').trim();
    var filialName = normFilialMap[normalizeFilialCode(filialCode)] || filialCode;
    out.filial.push(dictIdx('filial', filialName));
    out.status.push(dictIdx('status', get(row,'STATUS_PC')));
    out.situacPc.push(dictIdx('situacPc', get(row,'SITUAC_PC')));
    out.situacEntrega.push(dictIdx('situacEntrega', get(row,'SITUAC_ENTREGA')));
    out.origem.push(dictIdx('origem', get(row,'SET_COMPRAS')));
    out.tipo.push(dictIdx('tipo', get(row,'TIPO_COMPRA')));
    out.armazem.push(dictIdx('armazem', get(row,'ARMAZEM')));
    out.setor.push(dictIdx('setor', get(row,'SETOR')));
    out.contaCtb.push(dictIdx('contaCtb', get(row,'CONTA_CTB')));
    out.fornec.push(dictIdx('fornec', get(row,'NOME_FORNEC').trim()));
    var comprador = get(row,'NOME_REDUZ_COMPRADOR').trim() || '(Não informado)';
    out.comprador.push(dictIdx('comprador', comprador));
    out.produto.push(dictIdx('produto', get(row,'DESC_PRODUTO').trim()));
    out.condPgto.push(dictIdx('condPgto', get(row,'COND_PGTO').trim()));
    out.solicitante.push(solicIdx(get(row,'SOLICITANTE')));
    out.total.push(Math.round(parseBrNumber(get(row,'TOTAL'))*100)/100);
    out.qtde.push(parseBrNumber(get(row,'QTDE')));
    out.saldo.push(parseBrNumber(get(row,'SALDO_STK')));
    out.tempoSC.push(parseIntSafe(get(row,'TEMPO_SCxPC')));
    out.tempoLog.push(parseIntSafe(get(row,'TEMPO_LOG')));
    out.tempoClassf.push(parseIntSafe(get(row,'TEMPO_CLASSF_NF')));
    var dNf = parseDateStrict(get(row,'DATA_NF'));
    var dClassf = parseDateStrict(get(row,'DATA_CLASSF'));
    var dDigit = parseDateStrict(get(row,'DATA_DIGIT_NF'));
    var dEntrega = parseDateStrict(get(row,'PREV_ENTREGA'));
    out.date.push(dateIdx(parseDateIso(get(row,'DATA_PC'))));
    out.dateNf.push(dateNfIdx(dNf));
    out.dateClassf.push(dateClassfIdx(dClassf));
    out.dateDigit.push(dateDigitIdx(dDigit));
    out.dateEntrega.push(dateEntregaIdx(dEntrega));
    // Chave do pedido sempre no formato FILIAL(6)-NUM(6) (ex.: 010101-000007), mesmo se
    // o CSV vier com zeros à esquerda removidos (ex.: aberto/salvo no Excel). Mantém as
    // chaves da aba Tarefas e o vínculo com o histórico (boot-hist) estáveis.
    var numPc = get(row,'C7_NUM').trim();
    if (/^\d+$/.test(numPc) && numPc.length < 6) numPc = ('000000' + numPc).slice(-6);
    var filKey = /^\d+$/.test(filialCode) && filialCode.length < 6 ? ('000000' + filialCode).slice(-6) : filialCode;
    out.pedido.push(pedIdx(filKey + '-' + numPc));
  });

  var dicts = {};
  dictKeys.forEach(function(k){ dicts[k] = Array.from(dictMaps[k].keys()); });
  dicts.solicitante = Array.from(solicMap.keys());
  // dates/pedidos were assigned incrementally in first-seen order; sort dates and remap indices
  function sortAndRemap(map, arr){
    var vals = Array.from(map.keys());
    var sorted = vals.slice().sort();
    var remap = {}; sorted.forEach(function(d,i){ remap[map.get(d)] = i; });
    var remapped = arr.map(function(v){ return v<0 ? -1 : remap[v]; });
    return { sorted: sorted, remapped: remapped };
  }
  var dateRes = sortAndRemap(dateMap, out.date);
  out.date = dateRes.remapped;
  var dateNfRes = sortAndRemap(dateNfMap, out.dateNf);
  out.dateNf = dateNfRes.remapped;
  var dateClassfRes = sortAndRemap(dateClassfMap, out.dateClassf);
  out.dateClassf = dateClassfRes.remapped;
  var dateDigitRes = sortAndRemap(dateDigitMap, out.dateDigit);
  out.dateDigit = dateDigitRes.remapped;
  var dateEntregaRes = sortAndRemap(dateEntregaMap, out.dateEntrega);
  out.dateEntrega = dateEntregaRes.remapped;

  return {
    dicts: dicts,
    dates: dateRes.sorted,
    datesNf: dateNfRes.sorted,
    datesClassf: dateClassfRes.sorted,
    datesDigit: dateDigitRes.sorted,
    datesEntrega: dateEntregaRes.sorted,
    pedidos: Array.from(pedMap.keys()),
    rows: out,
    meta: { rowCount: rows.length }
  };
}

/* ---- Histórico da compra (HITORICO_PC.xlsx): FILIAL(6)-NUM_PC(6) -> HIST_COMPRA ---- */
function pad6(v){ v = String(v==null?'':v).trim(); if (/^\d+(\.0+)?$/.test(v)) v = String(parseInt(v,10)); return /^\d+$/.test(v) && v.length < 6 ? ('000000'+v).slice(-6) : v; }
function normHead(h){ return String(h==null?'':h).normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toUpperCase(); }
function buildHistFromWorkbook(wb){
  var hist = {};
  wb.SheetNames.some(function(nm){
    var aoa = XLSX.utils.sheet_to_json(wb.Sheets[nm], {header:1, raw:true, defval:''});
    var hr = -1, ix = {};
    for (var r=0; r<Math.min(aoa.length, 15); r++){
      var hs = aoa[r].map(normHead);
      if (hs.indexOf('HIST_COMPRA')>=0 && hs.indexOf('NUM_PC')>=0){ hr = r; hs.forEach(function(h,i){ if (!(h in ix)) ix[h]=i; }); break; }
    }
    if (hr < 0) return false;
    var iF = ix.CR_FILIAL != null ? ix.CR_FILIAL : ix.C7_FILIAL, iN = ix.NUM_PC, iH = ix.HIST_COMPRA;
    var seen = {};
    for (var r2=hr+1; r2<aoa.length; r2++){
      var row = aoa[r2], txt = String(row[iH]==null?'':row[iH]).replace(/\s+/g,' ').trim();
      if (!txt) continue;
      var k = pad6(row[iF]) + '-' + pad6(row[iN]);
      if (!seen[k]){ seen[k] = {}; hist[k] = txt; seen[k][txt] = 1; }
      else if (!seen[k][txt]){ seen[k][txt] = 1; hist[k] += ' | ' + txt; }
    }
    return true;
  });
  return hist;
}
/* ---- Filiais.csv (Código;Filial) -> mapa ---- */
function parseFiliaisCsv(buf){
  var p = parseCsvText(decodeFileBuffer(buf)), map = {};
  var hs = p.headers.map(normHead);
  var iC = hs.findIndex(function(h){ return h.indexOf('COD')===0; }); if (iC<0) iC = 0;
  var iN = hs.findIndex(function(h){ return h==='FILIAL' || h==='NOME' || h.indexOf('DESCR')===0; }); if (iN<0) iN = 1;
  p.rows.forEach(function(r){ var c = String(r[iC]||'').trim(), n = String(r[iN]||'').trim(); if (c && n) map[pad6(c)] = n; });
  return map;
}
var FILIAL_MAP_PADRAO = {'010101':'Palmas','010102':'Balsas','010103':'Caxias','010104':'Paragominas','010105':'Redenção','010106':'Teresina','010107':'Cristalina','010108':'Paracatu','010109':'Palmas CD','010110':'Formosa','010111':'Brasilia','010112':'Nova Crixas'};

/* monta a base compacta a partir dos arquivos baixados */
api.processar = function(csvBuf, histWb, filiaisBuf){
  var filialMap = FILIAL_MAP_PADRAO;
  if (filiaisBuf){ try { var fm = parseFiliaisCsv(filiaisBuf); if (Object.keys(fm).length) filialMap = fm; } catch(e){ console.warn('Filiais.csv', e); } }
  var parsed = parseCsvText(decodeFileBuffer(csvBuf));
  if (!parsed.rows.length) throw new Error('DADOS_BI_COMPRAS sem linhas.');
  var data = buildCompactDataFromCsv(parsed.headers, parsed.rows, filialMap);
  var hist = histWb ? buildHistFromWorkbook(histWb) : {};
  return { data:data, hist:hist };
};

/* Dropdown de múltipla escolha, padrão único do painel:
   "Selecionar todos" no topo + botões Marcar todos / Desmarcar todos.
   cfg: {label, all, plural, options:[{value,label}], get:()=>null|lista, set:(null|lista)=>void, onChange, light} */
function buildMultiDropdown(cfg){
  var opts = cfg.options;
  var allVals = opts.map(function(o){ return o.value; });
  var group = el('div','filter-group'+(cfg.light?' light':''));
  group.appendChild(el('span','filter-label', esc(cfg.label)));
  var ctrl = el('div','filter-control');
  var btn = el('button','filter-btn','<span class="filter-value"></span>'+CHEV);
  btn.type = 'button';
  var valueEl = btn.querySelector('.filter-value');
  var panel = el('div','dropdown-panel hidden');
  var allRow = el('label','dropdown-item dropdown-all','<input type="checkbox"><span class="lbl">Selecionar todos</span>');
  var allCb = allRow.querySelector('input');
  var list = el('div','dropdown-list');
  var foot = el('div','dropdown-foot');
  var markB = el('button','btn btn-ghost btn-sm','Marcar todos'); markB.type='button'; markB.style.cssText = FOOT_BTN_STYLE;
  var clearB = el('button','btn btn-ghost btn-sm','Desmarcar todos'); clearB.type='button'; clearB.style.cssText = FOOT_BTN_STYLE;
  foot.appendChild(markB); foot.appendChild(clearB);
  panel.appendChild(allRow); panel.appendChild(list); panel.appendChild(foot);
  ctrl.appendChild(btn); ctrl.appendChild(panel);
  group.appendChild(ctrl);

  function cur(){ var v = cfg.get(); return v == null ? allVals.slice() : v.slice(); }
  function setSel(arr){
    var isAll = arr.length===allVals.length && allVals.every(function(v){ return arr.indexOf(v)>=0; });
    cfg.set(isAll ? null : arr);
    syncChecks(); refreshLabel(); cfg.onChange();
  }
  function syncChecks(){
    var c = cur();
    list.querySelectorAll('input').forEach(function(cb){ cb.checked = c.indexOf(cb.value)>=0; });
    allCb.checked = c.length===allVals.length;
    allCb.indeterminate = c.length>0 && c.length<allVals.length;
  }
  function refreshLabel(){
    var v = cfg.get(), txt;
    if (v == null) txt = cfg.all;
    else if (!v.length) txt = 'Nenhum';
    else if (v.length===1){ var o = opts.filter(function(x){ return x.value===v[0]; })[0]; txt = o ? o.label : v[0]; }
    else txt = v.length+' '+cfg.plural;
    valueEl.textContent = txt;
    valueEl.classList.toggle('is-placeholder', v == null);
    group.classList.toggle('has-value', v != null);
  }

  opts.forEach(function(o){
    var item = el('label','dropdown-item');
    item.innerHTML = '<input type="checkbox"><span class="lbl">'+esc(o.label)+'</span>';
    var cb = item.querySelector('input');
    cb.value = o.value;
    cb.addEventListener('change', function(){
      var c = cur(), idx = c.indexOf(o.value);
      if (cb.checked && idx<0) c.push(o.value);
      if (!cb.checked && idx>=0) c.splice(idx,1);
      c.sort(function(a,b){ return allVals.indexOf(a)-allVals.indexOf(b); });
      setSel(c);
    });
    list.appendChild(item);
  });
  allCb.addEventListener('change', function(){ setSel(allCb.checked ? allVals.slice() : []); });
  markB.addEventListener('click', function(){ setSel(allVals.slice()); });
  clearB.addEventListener('click', function(){ setSel([]); });
  btn.addEventListener('click', function(evt){
    evt.stopPropagation();
    var willOpen = panel.classList.contains('hidden');
    closeAllPanels(panel);
    panel.classList.toggle('hidden', !willOpen);
  });

  syncChecks(); refreshLabel();
  return group;
}

function todayStr(){
  /* horário de Brasília (America/Sao_Paulo), independente do fuso do navegador */
  var fmt = new Intl.DateTimeFormat('en-CA', { timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false });
  var parts = {};
  fmt.formatToParts(new Date()).forEach(function(p){ parts[p.type] = p.value; });
  return parts.year + '-' + parts.month + '-' + parts.day + 'T' + parts.hour + ':' + parts.minute;
}

/* localiza blocos de tabela dinâmica (ex.: Soma de Valor / Soma de CMV / Soma de LB) numa aba,
   a partir da linha 'Rótulos de Linha' que antecede cada bloco */
function findPivotBlocks(aoa){
  var blocks = {};
  for (var i=0;i<aoa.length;i++){
    var row = aoa[i];
    if (row && row[0] === 'Rótulos de Linha'){
      var label = (aoa[i-1] && aoa[i-1][0]) || ('bloco'+i);
      var months = [];
      var j=1;
      while (row[j] instanceof Date){ months.push(row[j]); j++; }
      var dataRows = [];
      var k = i+1;
      while (aoa[k] && aoa[k][0] && aoa[k][0] !== 'Total Geral'){
        dataRows.push(aoa[k]);
        k++;
      }
      blocks[label] = { months: months, rows: dataRows };
    }
  }
  return blocks;
}

function parseFaturamentoWorkbook(wb){

  if (!histSheet || !fatSheet) throw new Error('Não encontrei as abas "Fat_Hist_Filial" e/ou "Base_Fat." na planilha.');

  var aoa = XLSX.utils.sheet_to_json(histSheet, {header:1, raw:true});
  var blocks = findPivotBlocks(aoa);
  var bV = blocks['Soma de Valor'], bC = blocks['Soma de CMV'], bL = blocks['Soma de LB'];
  if (!bV || !bC || !bL) throw new Error('Não encontrei os blocos de Valor/CMV/LB em "Fat_Hist_Filial".');

  var pivotMonths = bV.months.map(excelMonthKey).filter(function(m){ return !!m; });
  var pivotMonthSet = {};
  pivotMonths.forEach(function(m){ pivotMonthSet[m]=1; });

  function metricMap(block){
    var map = {};
    block.rows.forEach(function(row){
      var fil = row[0];
      if (!fil) return;
      var byMonth = {};
      block.months.forEach(function(d,i){
        var mk = excelMonthKey(d);
        if (!mk) return;
        var v = row[1+i];
        if (v == null || v === '') return;
        byMonth[mk] = Number(v)||0;
      });
      map[fil] = byMonth;
    });
    return map;
  }
  var mV = metricMap(bV), mC = metricMap(bC), mL = metricMap(bL);

  var grid = {};
  Object.keys(mV).forEach(function(fil){
    var byMonth = {};
    pivotMonths.forEach(function(m){
      var v = mV[fil] && mV[fil][m];
      if (v == null) return;
      var c = (mC[fil] && mC[fil][m]) || 0;
      var l = (mL[fil] && mL[fil][m]) || 0;
      byMonth[m] = { v:v, c:c, l:l, i:(v-c-l), q:0 };
    });
    grid[fil] = byMonth;
  });

  /* linhas brutas: qtde. e clientes distintos para todos os meses, e também
     v/c/i/l diretos para meses que ainda não aparecem no resumo histórico
     (ex.: o mês corrente, antes da tabela dinâmica ser atualizada) */
  var faoa = XLSX.utils.sheet_to_json(fatSheet, {header:1, raw:true});
  var headerRowIdx = -1, header = null;
  for (var r=0; r<Math.min(faoa.length,20); r++){
    var row2 = faoa[r];
    if (row2 && row2.indexOf('Loja')>=0 && row2.indexOf('Ano_Mes')>=0 && row2.indexOf('Valor')>=0){
      headerRowIdx = r; header = row2; break;
    }
  }
  var clientsGrid = {};
  var extraMonthsSet = {};
  var devolGrid = {};
  if (headerRowIdx >= 0){
    var idxLoja = header.indexOf('Loja');
    var idxAnoMes = header.indexOf('Ano_Mes');
    var idxCliente = header.indexOf('Cliente');
    var idxQtde = header.indexOf('Qtde.');
    var idxValor = header.indexOf('Valor');
    var idxCMV = header.indexOf('CMV');
    var idxImpostos = header.indexOf('Impostos');
    var idxLB = header.indexOf('LB');
    var idxTipo = header.indexOf('Tipo');
    var clientSets = {};
    var rawAgg = {};
    var cmvGrid = {};
    for (var rr=headerRowIdx+1; rr<faoa.length; rr++){
      var row3 = faoa[rr];
      if (!row3) continue;
      var fil2 = row3[idxLoja];
      var mk2 = excelMonthKey(row3[idxAnoMes]);
      if (!fil2 || !mk2) continue;

      if (pivotMonthSet[mk2]){
        if (grid[fil2] && grid[fil2][mk2]){
          grid[fil2][mk2].q += Number(row3[idxQtde])||0;
        }
      } else {
        extraMonthsSet[mk2] = 1;
        rawAgg[fil2] = rawAgg[fil2] || {};
        var cell = rawAgg[fil2][mk2] || {v:0,c:0,i:0,l:0,q:0};
        cell.v += Number(row3[idxValor])||0;
        cell.c += Number(row3[idxCMV])||0;
        cell.i += Number(row3[idxImpostos])||0;
        cell.l += Number(row3[idxLB])||0;
        cell.q += Number(row3[idxQtde])||0;
        rawAgg[fil2][mk2] = cell;
      }

      cmvGrid[fil2] = cmvGrid[fil2] || {};
      cmvGrid[fil2][mk2] = (cmvGrid[fil2][mk2]||0) + (Number(row3[idxCMV])||0);

      var cliente = row3[idxCliente];
      if (cliente != null){
        clientSets[fil2] = clientSets[fil2] || {};
        clientSets[fil2][mk2] = clientSets[fil2][mk2] || {};
        clientSets[fil2][mk2][cliente] = 1;
      }

      if (idxTipo>=0 && row3[idxTipo]==='D'){
        devolGrid[fil2] = devolGrid[fil2] || {};
        devolGrid[fil2][mk2] = (devolGrid[fil2][mk2]||0) + Math.abs(Number(row3[idxValor])||0);
      }
    }
    Object.keys(clientSets).forEach(function(fil3){
      clientsGrid[fil3] = {};
      Object.keys(clientSets[fil3]).forEach(function(m3){
        clientsGrid[fil3][m3] = Object.keys(clientSets[fil3][m3]);
      });
    });
    Object.keys(rawAgg).forEach(function(fil4){
      grid[fil4] = grid[fil4] || {};
      Object.keys(rawAgg[fil4]).forEach(function(m4){
        grid[fil4][m4] = rawAgg[fil4][m4];
      });
    });
  }

  var months = pivotMonths.concat(Object.keys(extraMonthsSet)).sort();
  var filiais = Object.keys(grid);
  var devolMonths = {};
  Object.keys(devolGrid).forEach(function(f){ Object.keys(devolGrid[f]).forEach(function(m){ devolMonths[m]=1; }); });

  var abc = headerRowIdx >= 0 ? computeAbcFromAoa(faoa, headerRowIdx, header) : null;
  return { months: months, grid: grid, clientsGrid: clientsGrid, filiais: filiais, devolGrid: devolGrid, devolMonths: Object.keys(devolMonths).sort(), abc: abc, cmvGrid: (typeof cmvGrid!=='undefined' ? cmvGrid : null), faoa: faoa, headerRowIdx: headerRowIdx, header: header };
}

function applyFaturamentoUpdate(parsed, fileName){
  DATA.fat.grid = { months: parsed.months, grid: parsed.grid };
  DATA.fat.clients_grid = parsed.clientsGrid;
  DATA.fat.devol_grid = { months: parsed.devolMonths, grid: parsed.devolGrid };

  var periodSet = {};
  BASE_NONFAT_MONTHS.forEach(function(m){ periodSet[m]=1; });
  parsed.months.forEach(function(m){ periodSet[m]=1; });
  DATA.meta.periodos = Object.keys(periodSet).sort();

  var filSet = {};
  DATA.meta.filiais.forEach(function(f){ filSet[f]=1; });
  parsed.filiais.forEach(function(f){ filSet[f]=1; });
  DATA.meta.filiais = Object.keys(filSet);
  FILIAIS = DATA.meta.filiais;

  DATA.meta.gerado_em = todayStr();
