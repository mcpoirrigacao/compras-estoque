  resetTabState('fat');
  if (parsed.abc){ DATA.abc = parsed.abc; resetTabState('abc'); }
  if (parsed.cmvGrid){ DATA.giro.cmv = parsed.cmvGrid; resetTabState('giro'); }
  updateSourceLabel();
  renderFilterBar();
  updateTabDots();
  rerenderAll();
}

/* Estoque Histórico.xlsx: colunas B9_FILIAL, LOJA, B9_LOCAL, ..., MÊS_ANO, TOTAL → DATA.giro.estoque */
function isEstoqueHistWorkbook(wb){
  var ws = wb.Sheets[wb.SheetNames[0]];
  var aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true});
  for (var r=0; r<Math.min(aoa.length,10); r++){ var row=aoa[r]||[]; if (row.indexOf('B9_FILIAL')>=0 && row.indexOf('TOTAL')>=0) return true; }
  return false;
}
function parseEstoqueHistWorkbook(wb){
  var ws = wb.Sheets[wb.SheetNames[0]];
  var aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true});
  var h=-1, header=null;
  for (var r=0; r<Math.min(aoa.length,10); r++){ var row=aoa[r]||[]; if (row.indexOf('B9_FILIAL')>=0 && row.indexOf('TOTAL')>=0){ h=r; header=row; break; } }
  if (h<0) throw new Error('Cabeçalho do Estoque Histórico não encontrado.');
  var iL=header.indexOf('LOJA'), iMA=header.indexOf('MÊS_ANO'), iA=header.indexOf('ANO'), iM=header.indexOf('MES'), iT=header.indexOf('TOTAL');
  var grid={}, ms={};
  for (var k=h+1; k<aoa.length; k++){
    var rw=aoa[k]; if (!rw || !rw[iL]) continue;
    var mk = iMA>=0 ? excelMonthKey(rw[iMA]) : null;
    if (!mk && iA>=0 && iM>=0 && rw[iA] && rw[iM]) mk = rw[iA]+'-'+String(rw[iM]).padStart(2,'0');
    if (!mk) continue;
    var fil = String(rw[iL]).trim();
    grid[fil] = grid[fil] || {};
    grid[fil][mk] = (grid[fil][mk]||0) + (Number(rw[iT])||0);
    ms[mk]=1;
  }
  return {estoque:grid, months:Object.keys(ms).sort()};
}


/* =====================================================================
   MOTOR DE CÁLCULO — monta a base do painel a partir das planilhas da pasta
   Entradas (pasta Compras-estoque do SharePoint):
     Métrica Mensal.xlsx      → Base_Fat. / Fat_Hist_Filial / Base_Filiais / Compras
     Estoque Histórico.xlsx   → saldo mensal do armazém 01 por filial (Giro e evolução do Inventário)
     Inventário_de_Peças.xlsx → aba Inventário (saldo/custo por filial × item × armazém)
                                + Planilha1 (data da última entrada por filial × item)
     Armazém.xlsx             → nomes dos armazéns
   Mesmas regras do painel original (ver comentários de cada aba).
   ===================================================================== */
var ARZ_NOMES = { '01':'Peças varejo', '10':'Peças com defeito', '20':'EPI', '30':'Sist. de irrigação', '31':'Sist. de gotejo',
  '32':'Sist. de energia solar', '50':'Requisitado em O.S.', '60':'Uso e consumo', '80':'Estoque em terceiros', '81':'Estoque de terceiros' };
var FILIAL_ORDEM = ['010101','010102','010103','010104','010105','010106','010107','010108','010109','010110','010111','010112'];

function sheetAoa(wb, name){
  var ws = wb.Sheets[name];
  if (!ws){ var k = Object.keys(wb.Sheets).filter(function(n){ return n.trim().toLowerCase()===String(name).trim().toLowerCase(); })[0]; ws = k ? wb.Sheets[k] : null; }
  return ws ? XLSX.utils.sheet_to_json(ws, {header:1, raw:true}) : null;
}
function findHeader(aoa, cols, maxRows){
  for (var r=0; r<Math.min(aoa.length, maxRows||20); r++){
    var row = (aoa[r]||[]).map(function(x){ return String(x==null?'':x).trim(); });
    if (cols.every(function(c){ return row.indexOf(c)>=0; })) return {idx:r, header:row};
  }
  return null;
}
function txt(v){ return String(v==null?'':v).trim(); }
function num(v){ if (typeof v==='number') return v; var n = parseFloat(String(v==null?'':v).replace(/\./g,'').replace(',','.')); return isNaN(n)?0:n; }
function isoDate(v){
  if (v instanceof Date && !isNaN(v)){
    if (v.getUTCFullYear() < 1950) return '';   /* hora pura (sem data) vira 1899/1900 */
    return v.getUTCFullYear()+'-'+String(v.getUTCMonth()+1).padStart(2,'0')+'-'+String(v.getUTCDate()).padStart(2,'0');
  }
  var s = txt(v);
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if (m) return m[3]+'-'+m[2]+'-'+m[1];
  return '';
}
function mesAntes(mk, n){ var y=+mk.slice(0,4), m=+mk.slice(5,7)-n; while(m<=0){ m+=12; y--; } return y+'-'+String(m).padStart(2,'0'); }

/* código da filial → nome (Base_Filiais da Métrica Mensal; Irrigafaz = 999999) */
function lerFiliais(wbMetrica){
  var map = {'999999':'Irrigafaz'};
  var aoa = sheetAoa(wbMetrica, 'Base_Filiais') || [];
  var h = findHeader(aoa, ['Código','Filial']);
  if (h){
    var iC = h.header.indexOf('Código'), iF = h.header.indexOf('Filial');
    for (var r=h.idx+1; r<aoa.length; r++){ var row=aoa[r]||[]; var c=txt(row[iC]); if (c) map[c.padStart(6,'0')] = txt(row[iF]); }
  }
  return map;
}

/* compras por filial × mês (aba Compras da Métrica Mensal) */
function lerCompras(wbMetrica){
  var aoa = sheetAoa(wbMetrica, 'Compras'); if (!aoa) return {grid:{}};
  var h = findHeader(aoa, ['Descr_Filial','TOTAL','MÊS_ANO']); if (!h) return {grid:{}};
  var iF=h.header.indexOf('Descr_Filial'), iT=h.header.indexOf('TOTAL'), iM=h.header.indexOf('MÊS_ANO'), grid={};
  for (var r=h.idx+1; r<aoa.length; r++){
    var row=aoa[r]||[]; var f=txt(row[iF]), ma=txt(row[iM]).match(/^(\d{1,2})\/(\d{4})$/);
    if (!f || !ma) continue;
    var mk = ma[2]+'-'+ma[1].padStart(2,'0');
    grid[f] = grid[f] || {}; grid[f][mk] = Math.round(((grid[f][mk]||0) + num(row[iT]))*100)/100;
  }
  return {grid:grid};
}

/* Inventário_de_Peças.xlsx → linhas {cod, fil, item, arz, desc, qtd, valor, custo} + datas de última entrada */
function lerInventario(wbInv){
  var aoa = sheetAoa(wbInv, 'Inventário') || sheetAoa(wbInv, wbInv.SheetNames[0]);
  var h = findHeader(aoa||[], ['Loja','Produto','Arz','Saldo Atual','Sld.Atu.']);
  if (!h) throw new Error('Inventário_de_Peças: não encontrei o cabeçalho (Loja, Produto, Arz, Saldo Atual, Sld.Atu.).');
  var ix = function(n){ return h.header.indexOf(n); };
  var iL=ix('Loja'), iP=ix('Produto'), iA=ix('Arz'), iD=ix('Descricao'), iQ=ix('Saldo Atual'), iV=ix('Sld.Atu.'), iC=ix('C Unitario'), iE=ix('Dt.Ult.Entr.');
  var linhas = [];
  for (var r=h.idx+1; r<aoa.length; r++){
    var row = aoa[r]||[]; var cod = txt(row[iL]); var item = txt(row[iP]);
    if (!cod || !item) continue;
    cod = cod.padStart(6,'0');
    linhas.push({cod:cod, item:item, arz:txt(row[iA]).padStart(2,'0'), desc:txt(row[iD]), qtd:num(row[iQ]), valor:num(row[iV]), custo:num(row[iC]), entr: iE>=0 ? isoDate(row[iE]) : ''});
  }
  var entr = {};
  var aoa2 = sheetAoa(wbInv, 'Planilha1');
  var h2 = aoa2 ? findHeader(aoa2, ['D1_FILIAL','D1_COD','ULTIMA_DATA_ENTRADA']) : null;
  if (h2){
    var jF=h2.header.indexOf('D1_FILIAL'), jC=h2.header.indexOf('D1_COD'), jD=h2.header.indexOf('ULTIMA_DATA_ENTRADA');
    for (var k=h2.idx+1; k<aoa2.length; k++){
      var rw = aoa2[k]||[]; var f = txt(rw[jF]), c = txt(rw[jC]), d = isoDate(rw[jD]);
      if (f && c && d){ var key = f.padStart(6,'0')+'|'+c; if (!entr[key] || d > entr[key]) entr[key] = d; }
    }
  }
  linhas.forEach(function(l){ var d = entr[l.cod+'|'+l.item]; if (d && (!l.entr || d > l.entr)) l.entr = d; });
  return linhas;
}
function lerArmazens(wbArz){
  var map = {};
  if (!wbArz) return map;
  var aoa = sheetAoa(wbArz, wbArz.SheetNames[0]) || [];
  var h = findHeader(aoa, ['Codigo','Descricao']); if (!h) return map;
  for (var r=h.idx+1; r<aoa.length; r++){ var row=aoa[r]||[]; var c=txt(row[0]).padStart(2,'0'); if (c) map[c] = txt(row[1]); }
  return map;
}
function nomeArz(cod, arzMap){
  if (ARZ_NOMES[cod]) return ARZ_NOMES[cod];
  var d = arzMap[cod]; if (!d) return 'Armazém '+cod;
  d = d.toLowerCase(); return d.charAt(0).toUpperCase()+d.slice(1);
}

/* vendas por filial × item a partir das linhas da Base_Fat. */
function vendasBaseFat(faoa, hIdx, header, filMap, win){
  var ix = function(n){ return header.indexOf(n); };
  var iF=ix('Filial'), iL=ix('Loja'), iAM=ix('Ano_Mes'), iT=ix('Tipo'), iP=ix('Produto'), iQ=ix('Qtde.'), iD=ix('Datas');
  var net = {}, ult = {}, baseIni = null;
  for (var r=hIdx+1; r<faoa.length; r++){
    var row = faoa[r]; if (!row) continue;
    var mk = excelMonthKey(row[iAM]); var prod = txt(row[iP]); if (!mk || !prod) continue;
    if (!baseIni || mk < baseIni) baseIni = mk;
    var fil = txt(row[iL]) || filMap[txt(row[iF]).padStart(6,'0')] || '';
    var key = fil+'|'+prod, q = num(row[iQ]), dev = row[iT]==='D';
    if (win[mk]) net[key] = (net[key]||0) + (dev ? -q : q);
    if (!dev){ var d = isoDate(row[iD]); if (d && (!ult[key] || d > ult[key])) ult[key] = d; }
  }
  return {net:net, ult:ult, baseIni:baseIni};
}

/* ---------- base completa ---------- */
function montarBase(f){
  /* f = {metrica:wb, estoque:wb, inventario:wb, armazem:wb|null, invData:'YYYY-MM-DD', hoje:'YYYY-MM-DD', fontes:{...}} */
  var filMap = lerFiliais(f.metrica);
  var fat = parseFaturamentoWorkbook(f.metrica);
  var est = parseEstoqueHistWorkbook(f.estoque);
  var arzMap = lerArmazens(f.armazem);
  var inv = lerInventario(f.inventario);
  var invNome = function(cod){ return cod==='010101' ? 'Matriz' : (filMap[cod] || cod); };   /* no inventário Palmas = Matriz */
  var filNome = function(cod){ return filMap[cod] || cod; };

  /* ===== Inventário (todas as filiais e armazéns) ===== */
  var byFil = {}, byArz = {}, cross = {}, skusFil = {}, skusSet = {}, skusRep = 0, vt = 0, qt = 0;
  inv.forEach(function(l){
    var fn = invNome(l.cod), an = nomeArz(l.arz, arzMap);
    byFil[fn] = byFil[fn] || {filial:fn, valor:0, qtd:0}; byFil[fn].valor += l.valor; byFil[fn].qtd += l.qtd;
    byArz[an] = byArz[an] || {arz:an, nome:an, valor:0, qtd:0}; byArz[an].valor += l.valor; byArz[an].qtd += l.qtd;
    cross[fn] = cross[fn] || {}; cross[fn][an] = (cross[fn][an]||0) + l.valor;
    vt += l.valor; qt += l.qtd;
    if (l.arz==='01' && l.qtd > 0){ skusFil[fn] = (skusFil[fn]||0) + 1; skusSet[l.item] = 1; skusRep++; }
  });
  var r2 = function(x){ return Math.round(x*100)/100; };
  var invPecas = {
    kpi: {valor_total:r2(vt), qtd_total:r2(qt), skus:Object.keys(skusSet).length, skus_repeat:skusRep},
    by_filial: Object.keys(byFil).map(function(k){ var o=byFil[k]; return {filial:k, valor:r2(o.valor), qtd:r2(o.qtd)}; }).sort(function(a,b){ return b.valor-a.valor; }),
    by_arz: Object.keys(byArz).map(function(k){ var o=byArz[k]; return {arz:k, nome:k, valor:r2(o.valor), qtd:r2(o.qtd)}; }).sort(function(a,b){ return b.valor-a.valor; }),
    cross: cross,
    skus_by_filial: Object.keys(skusFil).map(function(k){ return {filial:k, skus:skusFil[k], pct: skusRep ? Math.round(skusFil[k]/skusRep*10000)/10000 : 0}; }).sort(function(a,b){ return b.skus-a.skus; }),
    hist: (function(){
      var total = {}; Object.keys(est.estoque).forEach(function(fl){ Object.keys(est.estoque[fl]).forEach(function(m){ total[m] = r2((total[m]||0) + est.estoque[fl][m]); }); });
      return {months: est.months, total: total, grid: est.estoque};
    })()
  };

  /* ===== saldos do armazém 01 para Curva ABC / Sortimento ===== */
  var stock = {}, rede = {};
  inv.forEach(function(l){
    if (l.arz!=='01' || l.qtd<=0) return;
    var c = l.qtd ? l.valor/l.qtd : l.custo;
    if (l.cod!=='999999') stock[filNome(l.cod)+'|'+l.item] = [l.qtd, Math.round(c*10000)/10000];
    rede[l.item] = rede[l.item] || [0,0]; rede[l.item][0] += l.qtd; rede[l.item][1] += l.valor;
  });
  var netcost = {}; Object.keys(rede).forEach(function(it){ if (rede[it][0]>0) netcost[it] = Math.round(rede[it][1]/rede[it][0]*10000)/10000; });
  var abc = fat.abc || {ini:null, fim:null, rows:[]};
  abc.inv = {data: f.fontes && f.fontes.inventario || 'Inventário_de_Peças.xlsx', arz:'01 - Peças varejo', stock:stock, netcost:netcost};

  /* ===== Zero Vendas: armazém 01, sem IRRIGAFAZ; janela = 12 meses da Curva ABC ===== */
  var win = {}; if (abc.fim){ for (var i=0;i<12;i++) win[mesAntes(abc.fim, i)] = 1; }
  var vend = vendasBaseFat(fat.faoa, fat.headerRowIdx, fat.header, filMap, win);
  var porItem = {};   /* item → [{fil, q}] com venda líquida > 0 na janela */
  Object.keys(vend.net).forEach(function(k){ var q = vend.net[k]; if (q>0){ var i=k.indexOf('|'); var it=k.slice(i+1); (porItem[it] = porItem[it] || []).push({fil:k.slice(0,i), q:q}); } });
  var ordem = function(fl){ var c = Object.keys(filMap).filter(function(k){ return filMap[k]===fl; })[0]; var p = FILIAL_ORDEM.indexOf(c); return p<0 ? 99 : p; };
  var zvRows = [], tot = {};
  inv.forEach(function(l){
    if (l.arz!=='01' || l.qtd<=0 || l.cod==='999999') return;
    var fn = filNome(l.cod), key = fn+'|'+l.item;
    var t = tot[fn] = tot[fn] || {total:0, n:0, cv:0, ncv:0};
    t.total += l.valor; t.n++;
    if ((vend.net[key]||0) > 0){ t.cv += l.valor; t.ncv++; return; }
    var outros = (porItem[l.item]||[]).filter(function(x){ return x.fil!==fn; }).sort(function(a,b){ return ordem(a.fil)-ordem(b.fil); });
    var outQ = outros.reduce(function(s,x){ return s+x.q; }, 0);
    zvRows.push([fn, l.item, l.desc, l.qtd, r2(l.valor), Math.round(l.valor/l.qtd*10000)/10000, l.entr||'', vend.ult[key]||'', r2(outQ),
      outros.map(function(x){ return x.fil+': '+Math.round(x.q*100)/100; }).join(' · ')]);
  });
  Object.keys(tot).forEach(function(k){ var t=tot[k]; t.total=r2(t.total); t.cv=r2(t.cv); });

/* ---------- JSON da pasta (acesso e parâmetros) com trava otimista por ETag ---------- */
function lerJson(nome){
  return gfetch(itemUrl(nome)).then(function(meta){
    if (meta.status===404) return {status:'vazio', data:null, etag:null};
    if (!meta.ok) return {status:'erro', erro:'HTTP '+meta.status};
    return meta.json().then(function(mj){
      return gfetch(itemUrl(nome)+'/content').then(function(c){
        if (!c.ok) return {status:'erro', erro:'HTTP '+c.status};
        return c.json().then(function(d){ return {status:'ok', data:d||{}, etag:mj.eTag || mj.cTag || null}; });
      });
    });
  }).catch(function(e){ return {status:'erro', erro:e.message||'rede'}; });
}
function gravarJson(nome, obj, etag){
  var headers = {'Content-Type':'application/json'}; if (etag) headers['If-Match'] = etag;
  return gfetch(itemUrl(nome)+'/content', {method:'PUT', headers:headers, body:JSON.stringify(obj, null, 2)}).then(function(r){
    if (!r.ok) return {ok:false, status:r.status};
    return r.json().then(function(j){ return {ok:true, etag:j.eTag || j.cTag || null}; }).catch(function(){ return {ok:true, etag:null}; });
  }).catch(function(){ return {ok:false, status:0}; });
}
/* lê a versão atual, aplica a alteração e grava com If-Match; em conflito (412/409) relê e reaplica */
function alterarJson(nome, alterar){
  var tent = 0;
  function tentar(){
    tent++;
    return lerJson(nome).then(function(atual){
      if (atual.status==='erro') throw new Error('não consegui ler '+nome+' ('+atual.erro+')');
      var novo = alterar(clone(atual.data || {}), atual.status==='vazio');
      return gravarJson(nome, novo, atual.etag).then(function(r){
        if (r.ok) return {data:novo, etag:r.etag};
        if ((r.status===412 || r.status===409) && tent<5) return tentar();
        throw new Error(r.status===401||r.status===403 ? 'sem permissão para gravar na pasta Compras-estoque' : (r.status===412||r.status===409 ? 'outra pessoa está alterando ao mesmo tempo — tente de novo' : 'falha ao gravar '+nome+' ('+r.status+')'));
      });
    });
  }
  return tentar();
}

/* lê as planilhas da pasta; usa o cache local se nenhum arquivo mudou (forcar = ignora o cache) */
function carregarPlanilhas(forcar){

/* base compacta fica em cache no IndexedDB (é grande demais para o localStorage) */
var CP_DB = 'compras_pecas_cp', CP_STORE = 'base';
function cpIdb(modo, fn){
  return new Promise(function(res){
    try {
      var rq = indexedDB.open(CP_DB, 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore(CP_STORE); };
      rq.onerror = function(){ res(null); };
      rq.onsuccess = function(){
        try {
          var tx = rq.result.transaction(CP_STORE, modo), st = tx.objectStore(CP_STORE), out = null;
          var r = fn(st); if (r) r.onsuccess = function(){ out = r.result; };
          tx.oncomplete = function(){ rq.result.close(); res(out); };
          tx.onerror = tx.onabort = function(){ rq.result.close(); res(null); };
        } catch(e){ res(null); }
      };
    } catch(e){ res(null); }
  });
}
function cpCacheLer(){ return cpIdb('readonly', function(st){ return st.get('atual'); }); }
function cpCacheGravar(v){ return cpIdb('readwrite', function(st){ st.put(v, 'atual'); }); }
function cpCacheLimpar(){ return cpIdb('readwrite', function(st){ st.clear(); }); }
function cpFonteTxt(){
  var m = CP.meta(); if (!m || !m.arquivo) return '';
  return m.arquivo.nome + ' · atualizado em ' + fmtDateTime(m.arquivo.modificado) + ' · ' + (m.linhas||0).toLocaleString('pt-BR') + ' linhas';
}
function cpAtualizarAba(){
  if (built.compras){ built.compras.remove(); delete built.compras; }
  if (currentTab==='compras'){ selectTab('compras'); renderFilterBar(); }
  updateTabDots();
}
function carregarCompras(forcar){
  if (cpLendo || typeof XLSX === 'undefined') return Promise.resolve();
  var sel = {}; CP_CHAVES.forEach(function(k){ sel[k] = acharArquivo(params.arquivos[k]); });
  if (!sel.compras){
    var msg = arquivosPasta.length ? 'Arquivo não encontrado na pasta: '+params.arquivos.compras : '';
    if (msg !== cpErro || CP.temDados()){ cpErro = msg; cpSig = null; CP.setDados(null); cpAtualizarAba(); }
    return Promise.resolve();
  }
  var sig = CP_CHAVES.map(function(k){ return k+'='+(sel[k] ? sel[k].name+'@'+sel[k].eTag : '-'); }).join(';');
  if (!forcar && sig===cpSig && CP.temDados()) return Promise.resolve();
  cpLendo = true; cpErro = '';
  if (currentTab==='compras' && !CP.temDados()) cpAtualizarAba();
  var meta = { sig:sig, arquivo:{nome:sel.compras.name, modificado:sel.compras.lastModifiedDateTime, tamanho:sel.compras.size},
               historico: sel.historico ? sel.historico.name : '', filiais: sel.filiais ? sel.filiais.name : '' };
  return (forcar ? Promise.resolve(null) : cpCacheLer()).then(function(c){
    if (c && c.sig===sig && c.data) return {data:c.data, hist:c.hist, meta:c.meta, modo:'cache'};
    setSyncStatus('⏳ lendo pedidos de compra…','saving');
    return Promise.all([ baixarArquivo(sel.compras), sel.historico ? baixarArquivo(sel.historico) : null, sel.filiais ? baixarArquivo(sel.filiais) : null ])
      .then(function(bufs){
        return new Promise(function(res){ setTimeout(res, 30); }).then(function(){
          var wbH = bufs[1] ? XLSX.read(bufs[1], {type:'array'}) : null;
          var r = CP.processar(bufs[0], wbH, bufs[2]);
          meta.linhas = r.data.meta.rowCount; meta.lido_em = new Date().toISOString();
          cpCacheGravar({sig:sig, data:r.data, hist:r.hist, meta:meta});
          return {data:r.data, hist:r.hist, meta:meta, modo:'lido'};
        });
      });
  }).then(function(r){
    cpSig = sig; CP.setDados(r.data, r.hist, r.meta);
    if (r.modo==='lido') setSyncStatus('☁ planilhas lidas agora','ok');
  }).catch(function(e){
    console.error(e); cpErro = 'Pedidos de compra: ' + (e.message || String(e));
    showToast(cpErro, true);
  }).then(function(){ cpLendo = false; cpAtualizarAba(); });
}
function buildCompras(){
  if (CP.temDados()){ var p = CP.montarPainel(cpFonteTxt()); return p; }
  var p2 = el('div','tab-panel','');
  var titulo = cpLendo ? 'Lendo os pedidos de compra…' : (cpErro ? 'Não foi possível montar a aba Compras' : 'Aguardando os pedidos de compra');
  var msg = cpLendo ? 'Baixando DADOS_BI_COMPRAS e HITORICO_PC da pasta do SharePoint. Isso leva alguns segundos.'
    : (cpErro ? esc(cpErro)+(nivelAcesso()==='admin' ? ' — confira os nomes dos arquivos na aba <b>Parâmetros</b>.' : ' — avise um administrador.')
    : (msAccount ? 'Conectando à pasta Compras-estoque do SharePoint…' : 'Entre com a conta Microsoft para carregar os dados.'));
  p2.appendChild(el('div','empty-state','<b>'+titulo+'</b>'+msg));
  return p2;
}
CP.onChange = function(){ updateTabDots(); };
function setBusy(b){
  var bt = document.getElementById('update-data-btn'); if (!bt) return;
  bt.disabled = b; bt.classList.toggle('is-loading', b);
  document.getElementById('update-data-label').textContent = b ? 'Lendo…' : 'Atualizar dados';
}
function conectar(){
  if (!msAccount) return Promise.resolve();
  setSyncStatus('⏳ conectando…','saving');
  return resolverPasta().then(function(p){
    if (!p){ paramsOk = false; applyAccess(); setSyncStatus('⚠ pasta do SharePoint inacessível','warn'); return; }
    setSyncStatus('⏳ conferindo acesso…','saving');
    return lerParametros().then(lerAcesso).then(function(){
      applyAccess();
      if (!acessoOk){ setSyncStatus('⚠ falha ao ler o acesso','warn'); return; }
      if (nivelAcesso()==='bloqueado'){ setSyncStatus('🔒 sem acesso','warn'); return; }
      var eu = emailAtual();
      if (!acesso.emailsAutorizados.length && !acesso.emailsComuns.length){
        /* primeiro acesso vira admin */
        salvarAcesso(function(a){ if (!a.emailsAutorizados.length && !a.emailsComuns.length) a.emailsAutorizados.push(eu); }, 'Você é o primeiro administrador do Compras-peças.');
      } else if (!acessoEtag && acessoLegado && nivelAcesso()==='admin'){
        salvarAcesso(function(){});   /* migra os usuários do arquivo antigo para compras_pecas_acesso.json */
      }
      startPolling();
      return carregarPlanilhas(false);
    });
  });
}
/* a cada 2 min confere se alguma planilha ou os parâmetros mudaram */
function startPolling(){ clearInterval(_pollTimer); _pollTimer = setInterval(verificarMudancas, 120000); }
function verificarMudancas(){
  if (!msAccount || lendo || nivelAcesso()==='bloqueado' || !pasta) return;
  var antes = paramsEtag+'|'+acessoEtag;
  lerParametros().then(lerAcesso).then(function(){ if (paramsEtag+'|'+acessoEtag!==antes){ applyAccess(); if (currentTab==='param') rerenderTab('param'); } });
  carregarPlanilhas(false);
}
document.addEventListener('visibilitychange', function(){ if (!document.hidden) verificarMudancas(); });

/* ---------- níveis de acesso ---------- */
function emailAtual(){ return msAccount ? String(msAccount.username||'').toLowerCase() : ''; }
function lower(l){ return (l||[]).map(function(x){ return String(x).toLowerCase(); }); }
function nivelAcesso(){
  if (!msAccount) return msalReady ? 'deslogado' : 'local';
  if (!acessoOk) return 'bloqueado';
  var e = emailAtual();
  if (acesso.emailsAutorizados.indexOf(e)>=0) return 'admin';
  if (acesso.emailsComuns.indexOf(e)>=0) return 'comum';
  if (!acesso.emailsAutorizados.length && !acesso.emailsComuns.length) return 'admin';   /* primeiro acesso */
  return 'bloqueado';
}
function applyAccess(){
  var nivel = nivelAcesso();
  var ovL = document.getElementById('overlay-login'), ovN = document.getElementById('overlay-negado');
  ovL.style.display = nivel==='deslogado' ? 'flex' : 'none';
  ovN.style.display = nivel==='bloqueado' ? 'flex' : 'none';
  if (nivel==='bloqueado'){
    document.getElementById('overlay-email-info').textContent = 'Logado como: '+emailAtual();
    document.getElementById('overlay-negado-msg').textContent = !pasta
      ? 'Não consegui acessar a pasta Compras-estoque no SharePoint ('+(pastaErro||'erro')+'). Verifique se sua conta tem acesso à pasta.'
      : (!acessoOk ? 'Não consegui ler a lista de usuários na pasta. Tente entrar de novo.' : 'Seu e-mail não está cadastrado para usar este sistema. Peça a um administrador para liberar seu acesso.');
  }
  var isAdmin = nivel==='admin' || nivel==='local';   /* modo local libera tudo p/ testes offline */
  document.body.classList.toggle('is-admin', isAdmin);
  var tp = TABS.filter(function(t){ return t.id==='param'; })[0];
  if (tp) tp._btn.hidden = !isAdmin;
  if (!isAdmin && currentTab==='param') TABS[0]._btn.click();
  updateLoginUI();
}
function updateLoginUI(){
  var lbl = document.getElementById('ms-login-label'), info = document.getElementById('ms-user-info'); if (!lbl) return;
  var nivel = nivelAcesso();
  if (msAccount){
    lbl.textContent = '✓ '+(msAccount.name || msAccount.username);
    info.textContent = msAccount.username + (nivel==='admin' ? ' · admin' : nivel==='comum' ? ' · visualização' : '');
    info.style.display = 'block';
  } else if (!msalReady && msalInstance===null && _authIniciado){
    lbl.textContent = '🔑 Entrar com Microsoft';
    info.textContent = '(modo local — login indisponível)'; info.style.display = 'block';
  } else {
    lbl.textContent = msalReady ? '🔑 Entrar com Microsoft' : '⏳ Inicializando...';
    info.style.display = 'none';
  }
  document.getElementById('btn-ms-login').title = msAccount ? 'Clique para sair' : 'Entrar com a conta Microsoft da MAQCAMPO';
}
/* um popup de login fechado no meio deixa o MSAL travado em "interaction_in_progress" */
function limparInteracaoTravada(){
  [window.sessionStorage, window.localStorage].forEach(function(st){
    try { Object.keys(st).filter(function(k){ return /interaction\.status/i.test(k); }).forEach(function(k){ st.removeItem(k); }); } catch(e){}
  });
}
var _authIniciado = false;
function resetAuthState(){
  msAccount = null; paramsEtag = null; paramsOk = false; pasta = null; arquivosPasta = [];
  params = { arquivos: clone(ARQ_PADRAO) };
  acesso = { emailsAutorizados:[], emailsComuns:[] }; acessoOk = false; acessoEtag = null; acessoLegado = null;
  clearInterval(_pollTimer);
  try { localStorage.removeItem(CACHE_KEY); } catch(e){}
  cpCacheLimpar(); cpSig = null; cpErro = ''; CP.setDados(null); cpAtualizarAba();
  setSyncStatus('','');
}
function fazerLogin(){
  if (!msalInstance){ showToast(_authIniciado ? 'Login indisponível neste modo (abra pelo endereço publicado).' : 'Autenticação ainda inicializando — aguarde e tente de novo.', true); return; }
  document.getElementById('ms-login-label').textContent = '⏳ Abrindo login...';
  msalInstance.loginPopup({ scopes:GRAPH_SCOPES, prompt:'select_account' }).then(function(resp){
    msAccount = resp.account;
    try { msalInstance.setActiveAccount(msAccount); } catch(e){}
    updateLoginUI(); applyAccess(); rerenderAll();
    return conectar().then(function(){ showToast('Logado como '+msAccount.username); });
  }).catch(function(e){
    limparInteracaoTravada(); updateLoginUI();
    var code = (e && (e.errorCode||e.message)) || '';
    if (/popup/.test(code)) showToast('Popup bloqueado — libere popups para este site.', true);
    else if (code==='user_cancelled') showToast('Login cancelado.');
    else showToast('Erro no login: '+(code||'desconhecido'), true);
  });
}
function fazerLogout(){
  var inst = msalInstance;
  resetAuthState(); setData(null); applyAccess();
  if (inst){ try { if (inst.clearCache) inst.clearCache(); } catch(e){} try { inst.setActiveAccount(null); } catch(e){} }
  showToast('Sessão encerrada.');
}
document.getElementById('btn-ms-login').addEventListener('click', function(){
  if (msAccount){ if (confirm('Sair de '+msAccount.username+'?')) fazerLogout(); return; }
  fazerLogin();
});
document.getElementById('update-data-btn').addEventListener('click', function(){
  if (!msAccount){ showToast('Entre com o Microsoft primeiro.', true); return; }
  if (!pasta){ conectar(); return; }
  carregarPlanilhas(true);
});

function initAuth(){
  return loadMsal().then(function(){
    var MsalClass = window.msal && window.msal.PublicClientApplication;
    if (!MsalClass) throw new Error('MSAL indisponível');
    limparInteracaoTravada();
    msalInstance = new MsalClass(MSAL_CONFIG);
    return msalInstance.initialize();
  }).then(function(){
    msalReady = true;
    var accs = msalInstance.getAllAccounts();
    _authIniciado = true;
    if (accs.length){ msAccount = msalInstance.getActiveAccount() || accs[0]; updateLoginUI(); return conectar(); }
    applyAccess();
  }).catch(function(){
    msalReady = false; msalInstance = null; _authIniciado = true;
    applyAccess();
    setSyncStatus('modo local — login indisponível','warn');
  });
}

/* ================= ABA PARÂMETROS ================= */
function buildParametros(){
  var panel = el('div','tab-panel','');
  var nivel = nivelAcesso();
  var grid = el('div','chart-grid param-grid');

  /* --- Usuários --- */
  var cU = chartCard('Usuários & Acesso', 2, 'login Microsoft · '+ACESSO_FILE);
  var who = el('div','param-who');
  who.innerHTML = '<div><span>Usuário logado</span><b>'+esc(emailAtual()||'— (modo local)')+'</b></div>'+
    '<div><span>Nível</span><b>'+esc(nivel==='local'?'local (sem login)':nivel==='comum'?'comum (visualização)':nivel)+'</b></div>';
  cU.body.appendChild(who);
  if (!msAccount){
    cU.body.appendChild(el('div','param-note','Entre com a conta Microsoft para gerenciar os usuários.'));
  } else {
    var cols = el('div','param-cols');
    cols.appendChild(listaUsuarios('Administradores — veem tudo e editam Parâmetros', 'emailsAutorizados', 'admin'));
    cols.appendChild(listaUsuarios('Usuários comuns — só visualizam', 'emailsComuns', 'comum'));
    cU.body.appendChild(cols);
  }
  grid.appendChild(cU.card);

  /* --- Pasta --- */
  var cS = chartCard('Pasta no SharePoint', 1, 'Compras-estoque');
  var info = el('div','param-kv');
  info.innerHTML =
    '<div><span>Pasta</span><b><a href="'+esc(pasta ? pasta.webUrl : SP_PASTA_WEB)+'" target="_blank" rel="noopener">'+esc(pasta ? pasta.nome : 'Compras-estoque')+'</a>'+(!pasta && pastaErro ? ' · <span class="t-bad">'+esc(pastaErro)+'</span>' : '')+'</b></div>'+
    '<div><span>Parâmetros gravados em</span><b>'+esc(ACESSO_FILE)+' · '+esc(PARAM_FILE)+'</b></div>'+
    '<div><span>Última leitura das planilhas</span><b>'+(ultimaLeitura? esc(ultimaLeitura.toLocaleString('pt-BR')) : '—')+'</b></div>'+
    '<div><span>Base calculada em</span><b>'+esc(DATA ? fmtDateTime(DATA.meta.gerado_em) : '—')+'</b></div>';
  cS.body.appendChild(info);
  var bR = el('button','btn btn-sm param-btn','Recarregar planilhas agora'); bR.type='button';
  bR.addEventListener('click', function(){ if (!msAccount){ showToast('Entre com o Microsoft primeiro.', true); return; } pasta = null; resolverPasta().then(function(){ carregarPlanilhas(true); }); });
  cS.body.appendChild(bR);
  grid.appendChild(cS.card);

  /* --- Arquivos de origem --- */
  var cA = chartCard('Planilhas de origem', 3, 'lidas da pasta a cada acesso · o painel não altera esses arquivos');
  if (erroLeitura) cA.body.appendChild(el('div','param-note','<span class="t-bad">⚠ '+esc(erroLeitura)+'</span>'));
  var sc = el('div','chart-scroll'); sc.style.maxHeight = 'none';
  var t = el('table','data-table');
  t.innerHTML = '<thead><tr><th>Fonte</th><th>Nome do arquivo na pasta</th><th>Situação</th><th>Modificado em</th><th class="num">Tamanho</th><th>Usado em</th></tr></thead>';
  var tb = el('tbody'); var inputs = {};
  Object.keys(ARQ_PADRAO).forEach(function(k){
    var f = acharArquivo(params.arquivos[k]);
    var tr = el('tr');
    tr.innerHTML = '<td><b>'+esc(ARQ_INFO[k].label)+'</b>'+(ARQ_INFO[k].obrig?'':' <span class="chip muted">'+(ARQ_INFO[k].grupo?'aba Compras':'opcional')+'</span>')+'</td><td class="param-file"></td>'+
      '<td>'+(f ? '<span class="chip good">encontrado</span>' : (arquivosPasta.length ? '<span class="chip '+(ARQ_INFO[k].obrig?'bad':'warn')+'">não encontrado</span>' : '<span class="chip muted">—</span>'))+'</td>'+
      '<td>'+(f ? esc(new Date(f.lastModifiedDateTime).toLocaleString('pt-BR')) : '—')+'</td>'+
      '<td class="num">'+(f ? (f.size/1024>1024 ? (f.size/1048576).toLocaleString('pt-BR',{maximumFractionDigits:1})+' MB' : Math.round(f.size/1024)+' KB') : '—')+'</td>'+
      '<td class="param-uso">'+esc(ARQ_INFO[k].uso)+'</td>';
    var inp = el('input','abc-search'); inp.value = params.arquivos[k]; inp.setAttribute('list','lista-arquivos-pasta');
    inputs[k] = inp; tr.querySelector('.param-file').appendChild(inp);
    tb.appendChild(tr);
  });
  t.appendChild(tb); sc.appendChild(t); cA.body.appendChild(sc);
  var dl = document.createElement('datalist'); dl.id = 'lista-arquivos-pasta';
  arquivosPasta.forEach(function(f){ var o = document.createElement('option'); o.value = f.name; dl.appendChild(o); });
  cA.body.appendChild(dl);
  if (arquivosPasta.length){
    var outros = arquivosPasta.filter(function(f){ return f.name!==PARAM_FILE && f.name!==ACESSO_FILE && !Object.keys(ARQ_PADRAO).some(function(k){ var a = acharArquivo(params.arquivos[k]); return a && a.name===f.name; }); });
    if (outros.length) cA.body.appendChild(el('div','param-note','Outros arquivos na pasta (não usados pelo painel): '+outros.map(function(f){ return esc(f.name); }).join(', ')+'.'));
  }
  var tools = el('div','abc-tools');
  var bS = el('button','btn btn-sm param-btn','Salvar nomes e recarregar'); bS.type='button';
  var bP = el('button','btn btn-sm param-btn param-btn-ghost','Restaurar nomes padrão'); bP.type='button';
  bS.addEventListener('click', function(){
    var novo = {}; Object.keys(inputs).forEach(function(k){ novo[k] = inputs[k].value.trim() || ARQ_PADRAO[k]; });
    params.arquivos = novo;
    salvarParametros().then(function(ok){ if (ok){ showToast('Parâmetros salvos.'); carregarPlanilhas(true); } });
  });
  bP.addEventListener('click', function(){ Object.keys(inputs).forEach(function(k){ inputs[k].value = ARQ_PADRAO[k]; }); });
  tools.appendChild(bS); tools.appendChild(bP);
  cA.body.appendChild(tools);
  cA.body.appendChild(el('div','param-note','Para atualizar o painel, substitua as planilhas na pasta mantendo o mesmo nome (ou ajuste o nome aqui). O painel percebe a mudança sozinho em até 2 minutos, ou na hora pelo botão <b>Atualizar dados</b>.'));
  grid.appendChild(cA.card);

  panel.appendChild(grid);
  return panel;
}
function listaUsuarios(titulo, campo, tipo){
  var box = el('div','param-users');
  var lista = acesso[campo];
  box.appendChild(el('div','abc-subtitle', esc(titulo)+' <span class="n">('+lista.length+')</span>'));
  var ul = el('div','param-list');
  if (!lista.length) ul.appendChild(el('div','param-note', tipo==='admin' ? 'Nenhum admin — o primeiro login vira admin.' : 'Nenhum usuário comum cadastrado.'));
  lista.forEach(function(em){
    var row = el('div','param-user');
    row.innerHTML = '<span>👤 '+esc(em)+(em===emailAtual()?' <span class="chip info">você</span>':'')+'</span>';
    var rm = el('button','btn btn-sm param-rm','remover'); rm.type='button';
    rm.addEventListener('click', function(){
      if (tipo==='admin' && acesso.emailsAutorizados.length===1){ showToast('Precisa ficar pelo menos um administrador.', true); return; }
      if (tipo==='admin' && em===emailAtual() && !confirm('Remover você mesmo dos administradores? Você perderá o acesso aos Parâmetros.')) return;
      salvarAcesso(function(a){
        a[campo] = a[campo].filter(function(x){ return x!==em; });
        if (!a.emailsAutorizados.length) a.emailsAutorizados = [em];   /* nunca deixa sem admin */
      }, 'Removido.');
    });
    row.appendChild(rm); ul.appendChild(row);
  });
  box.appendChild(ul);
  var add = el('div','param-add');
  var inp = el('input','abc-search'); inp.type='email'; inp.placeholder='email@maqcampo.com.br';
  var b = el('button','btn btn-sm '+(tipo==='admin'?'param-btn':'param-btn-ghost'), tipo==='admin'?'+ Admin':'+ Usuário'); b.type='button';
  function adicionar(){
    var em = inp.value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ showToast('Informe um e-mail válido.', true); return; }
    if (tipo==='comum' && acesso.emailsAutorizados.indexOf(em)>=0){ showToast('Já é admin.', true); return; }
    salvarAcesso(function(a){
      if (tipo==='admin'){ if (a.emailsAutorizados.indexOf(em)<0) a.emailsAutorizados.push(em); a.emailsComuns = a.emailsComuns.filter(function(x){ return x!==em; }); }
      else if (a.emailsAutorizados.indexOf(em)<0 && a.emailsComuns.indexOf(em)<0) a.emailsComuns.push(em);
    }, tipo==='admin' ? 'Administrador adicionado.' : 'Usuário adicionado.');
  }
  b.addEventListener('click', adicionar);
  inp.addEventListener('keydown', function(e){ if (e.key==='Enter') adicionar(); });
  add.appendChild(inp); add.appendChild(b);
  box.appendChild(add);
  return box;
}

applyAccess();
initAuth();

})();

</script>
